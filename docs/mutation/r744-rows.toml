id = "A7_key_id_none_guard"
description = "drop the KeyID is None guard in rows_of"
reason = "equivalent: names.get(str(None)) answers None the same way, so the row could only measure the dictionary"

[[dropped]]
id = "A8_round_half_up"
description = "round_half_up through Python's round, banker's rounding"
reason = "ranked below the cap: a single arithmetic line with one direct test, and the estimator's own rounding is the row E3 measures the consequence of"

[[dropped]]
id = "S1_script_step"
description = "drop the script's --step check"
reason = "ranked below the cap: the same rule is measured in the library by A6's neighbour, sample_for_reanalysis, and the script test drives it end to end"

[[dropped]]
