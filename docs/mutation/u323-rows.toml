                identity_provider=None,
                mount_enumerator=mount_enumerator,
            )
        )
    if backup_facts.Portion.DATABASE in wanted:'''

[[rows]]
id = "I6_provider_dropped_at_the_gate"
description = "_not_the_recorded_volume: the volume gate is asked with no provider, so the platform's own identity read answers"
file = "src/cratekit/modules/tools/backup.py"
surface = "maintainer"
