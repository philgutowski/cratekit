# U270, a job's export items written a hundred to a request. Author's rows,
# measured on Linux with the base's machine bound failures subtracted. Each
# row names its subset, the test files that drive the engine, the binding,
# the export writer and the adapter's add; a zero there is promoted to a full
# run by the driver before it is reported.

name = "u270"
pass_kind = "light"

