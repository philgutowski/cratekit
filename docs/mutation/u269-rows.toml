name = "u269"
pass_kind = "light"

# U269 removes lxml from the slim core and adds two guards in
# tests/test_packaging.py. A small card with no path that writes or deletes, so
# the table is the static registry size: the two new guards, each driven by the
# regression it names, and a sample of the existing slim core and export reader
# guards the brief says stay as they are.

[[rows]]
id = "M1_lxml_declared_again"
description = "pyproject.toml: declare lxml in the slim core again, which nothing under src imports"
file = "pyproject.toml"
surface = "maintainer"
tests = ["tests/test_packaging.py"]
old = '''    "rapidfuzz>=3.0",      # three-state match scoring (R11)
'''
new = '''    "rapidfuzz>=3.0",      # three-state match scoring (R11)
    "lxml>=5.0",           # rekordbox XML parsing
'''

