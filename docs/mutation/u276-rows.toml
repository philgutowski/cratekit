name = "u276"
pass_kind = "light"

[[rows]]
id = "K1_default_is_whole"
description = "KEY_DEFAULT: the whole track again, so every caller naming no method separates and the key reverts to the old reading"
file = "src/cratekit/analysis/detect.py"
surface = "user"
tests = ["tests/test_analysis_key_default.py", "tests/test_analysis_key_methods.py", "tests/test_analysis_key_windows.py", "tests/test_head_agreement.py"]
old = '''KEY_DEFAULT = KEY_PLAIN'''
new = '''KEY_DEFAULT = KEY_WHOLE'''

[[rows]]
id = "K2_profile_default_whole"
description = "key_profile: default its method to whole by name, past KEY_DEFAULT, so a caller of the profile alone separates"
file = "src/cratekit/analysis/detect.py"
surface = "user"
tests = ["tests/test_analysis_key_default.py", "tests/test_analysis_key_methods.py", "tests/test_analysis_key_windows.py"]
old = '''    method: str = KEY_DEFAULT,
    timings: MutableMapping[str, float] | None = None,
) -> Any:'''
new = '''    method: str = KEY_WHOLE,
    timings: MutableMapping[str, float] | None = None,
) -> Any:'''

[[rows]]
id = "K3_analyse_file_default_whole"
description = "analyse_file: default its key to whole by name, so analyze run and its workers, which name none, separate"
file = "src/cratekit/analysis/detect.py"
surface = "user"
tests = ["tests/test_analysis_key_default.py", "tests/test_analysis_key_methods.py", "tests/test_analysis_key_windows.py"]
old = '''    key: str = KEY_DEFAULT,
    timings'''
new = '''    key: str = KEY_WHOLE,
    timings'''

[[rows]]
id = "K4_plain_separates"
description = "key_profile: separate under every method, plain included, so the default pays the separation and reads whole's key"
file = "src/cratekit/analysis/detect.py"
surface = "user"
tests = ["tests/test_analysis_key_default.py", "tests/test_analysis_key_methods.py", "tests/test_analysis_key_windows.py"]
old = '''        if method != KEY_PLAIN:
            with timed(timings, "harmonic"):'''
new = '''        if True:
            with timed(timings, "harmonic"):'''

[[rows]]
id = "K5_stages_of_plain_keeps_harmonic"
description = "stages_of: answer every stage for plain too, so the stage report counts a separation the plain chroma never ran"
file = "src/cratekit/analysis/detect.py"
surface = "maintainer"
tests = ["tests/test_analysis_key_default.py", "tests/test_analysis_key_methods.py"]
old = '''    if method == KEY_PLAIN:
        return tuple(stage for stage in STAGES if stage != "harmonic")
    return STAGES'''
new = '''    return STAGES'''

[[rows]]
id = "K6_stages_of_refuses_nothing"
description = "stages_of: drop the refusal of a method nobody built, so a misspelt method reads as one that separates"
file = "src/cratekit/analysis/detect.py"
surface = "maintainer"
tests = ["tests/test_analysis_key_default.py", "tests/test_analysis_key_methods.py"]
old = '''    if method not in KEY_METHODS:
        raise ValueError(f"the key method is one of {KEY_METHODS}, not {method!r}")
    if method == KEY_PLAIN:'''
new = '''    if method == KEY_PLAIN:'''

[[rows]]
id = "K7_stage_table_keeps_every_row"
description = "stage_table: print every stage whatever the method, so a plain run's table shows a harmonic separation row of naught seconds"
file = "scripts/analyze_stages.py"
surface = "maintainer"
tests = ["tests/test_analysis_key_default.py"]
old = '''        if key in detect.STAGES and key not in met:
            continue'''
new = '''        if False:
            continue'''

[[rows]]
id = "K8_stage_table_drops_too_much"
description = "stage_table: leave out every detector stage the method meets instead of the ones it does not, so a whole run's table loses its separation row"
file = "scripts/analyze_stages.py"
surface = "maintainer"
tests = ["tests/test_analysis_key_default.py"]
old = '''        if key in detect.STAGES and key not in met:'''
new = '''        if key in detect.STAGES and key in met and key == "harmonic":'''

[[rows]]
id = "K9_agreement_script_default_whole"
description = "head_agreement.py: default --key to whole, so the attended sitting's run with no --key reads the old method, not the shipped one"
file = "scripts/head_agreement.py"
surface = "maintainer"
tests = ["tests/test_analysis_key_default.py", "tests/test_head_agreement.py"]
old = '''        default=detect.KEY_DEFAULT,'''
