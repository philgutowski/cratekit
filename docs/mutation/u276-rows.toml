[[rows]]
id = "K10_stage_script_default_whole"
description = "analyze_stages.py stages: default --key to whole, so the stage report times a method the run does not ship"
file = "scripts/analyze_stages.py"
surface = "maintainer"
tests = ["tests/test_analysis_key_default.py"]
old = '''    timed.add_argument("--key", default=detect.KEY_DEFAULT, choices=detect.KEY_METHODS)'''
new = '''    timed.add_argument("--key", default=detect.KEY_WHOLE, choices=detect.KEY_METHODS)'''

[[rows]]
id = "K11_run_binding_names_whole"
