        registry=tree_registry.read(cfg),
        declared=taxonomy.load_taxonomy(taxonomy.shipped_template_text("default")),
    )
'''

[[rows]]
id = "V2_composite_a_landing_under_an_alias"
description = "What V2 holds without the guard's spelling: an aliased default loader at the preflight"
file = "src/cratekit/intake/landing.py"
