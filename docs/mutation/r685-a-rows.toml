name = "r685-a"
pass_kind = "light"

# R-685: the one loader for a library's active taxonomy, the verbs that read
# through it, and the guard that keeps them there. Scoped to the branch's own
# guards. Author's table, no independent verifier (METHOD, 2026-09-07).

[[rows]]
id = "L1_the_active_copy_is_never_read"
description = "The loader resolves a path nothing is ever at, so every library falls back to the shipped template: R-685's defect, restored in the loader"
file = "src/cratekit/core/active_taxonomy.py"
surface = "user"
tests = ["tests/test_active_taxonomy.py", "tests/test_routing_workers.py", "tests/test_landing_labels.py", "tests/test_rebuild.py"]
old = '''
    path = config.state_path("taxonomy_active", cfg)
    try:
        text = path.read_text(encoding="utf-8")
'''
new = '''
    path = config.state_path("taxonomy_active", cfg).with_name("never-there.toml")
    try:
        text = path.read_text(encoding="utf-8")
'''

[[rows]]
id = "L2_an_unmounted_library_falls_back"
