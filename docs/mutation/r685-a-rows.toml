'''
new = '''
        if False:
'''

[[rows]]
id = "L3_a_copy_that_does_not_parse_falls_back"
description = "An active copy that fails validation is replaced by the shipped template instead of refused"
file = "src/cratekit/core/active_taxonomy.py"
surface = "user"
tests = ["tests/test_active_taxonomy.py", "tests/test_rebuild.py"]
old = '''
    try:
        return taxonomy.load_taxonomy(text)
    except taxonomy.TaxonomyError as exc:
        raise refuse(
'''
new = '''
    try:
        return taxonomy.load_taxonomy(text)
    except taxonomy.TaxonomyError as exc:
        return _shipped(cfg.taxonomy.template)
        raise refuse(
'''

