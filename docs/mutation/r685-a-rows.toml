'''

[[rows]]
id = "V1_route_inbox_export_reads_the_shipped_text"
description = "The export routing verb parses the shipped text instead of loading the library's copy"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_active_taxonomy.py", "tests/test_routing_workers.py"]
old = '''
    declared = active_taxonomy.load(cfg)
    _refuse_off_the_bridge(
        cfg, declared, export, instead="run route inbox without --export, which "
'''
new = '''
    declared = taxonomy.load_taxonomy(taxonomy.shipped_template_text("default"))
    _refuse_off_the_bridge(
        cfg, declared, export, instead="run route inbox without --export, which "
'''

[[rows]]
id = "V2_landing_preflight_reads_the_shipped_text"
description = "The landing's preflight parses the shipped text, so an undeclared catalog tree is not seen"
file = "src/cratekit/intake/landing.py"
surface = "user"
