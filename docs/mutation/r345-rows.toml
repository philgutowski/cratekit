name = "r345"
pass_kind = "light"

# Config: the validator and the derivation. Explicit subsets, because config
# is imported by nearly every test file and a derived subset would be the
# whole suite per row.

[[rows]]
id = "A1_colon_required"
description = "backup_remote_name: accept a value with no colon, so a bare folder name names a remote (the brief's row)"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_doctor.py", "tests/test_backup_cli.py"]
old = '''    if not colon or len(name) < 2:
        return None'''
new = '''    if len(name) < 2:
        return None'''

[[rows]]
id = "A2_single_letter"
description = "backup_remote_name: accept a single character before the colon, so C:/x names a remote called C"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_doctor.py", "tests/test_backup_cli.py"]
old = '''    if not colon or len(name) < 2:
        return None'''
new = '''    if not colon or len(name) < 1:
        return None'''

[[rows]]
id = "A3_name_shape"
description = "backup_remote_name: drop the rclone name rule, so -gdrive and a trailing space name a remote"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_doctor.py", "tests/test_backup_cli.py"]
old = '''    if not _RCLONE_REMOTE_NAME.match(name):
        return None'''
new = '''    if False:
        return None'''

[[rows]]
id = "A4_leading_hyphen"
description = "the name rule admits a leading hyphen"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_doctor.py", "tests/test_backup_cli.py"]
old = '''_RCLONE_REMOTE_NAME = re.compile(r"^[\w.+@][\w.+@ -]*(?<! )$")'''
new = '''_RCLONE_REMOTE_NAME = re.compile(r"^[\w.+@-][\w.+@ -]*(?<! )$")'''

[[rows]]
id = "A5_trailing_space"
description = "the name rule admits a trailing space"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_doctor.py", "tests/test_backup_cli.py"]
old = '''_RCLONE_REMOTE_NAME = re.compile(r"^[\w.+@][\w.+@ -]*(?<! )$")'''
new = '''_RCLONE_REMOTE_NAME = re.compile(r"^[\w.+@][\w.+@ -]*$")'''

