surface = "user"
tests = ["tests/test_doctor.py", "tests/test_paths_resolved.py", "tests/test_cli_contract.py"]
old = '''        if flag:
            _put(document, key, wizard.resolve(key, flag=flag, question=""))'''
new = '''        if False:
            _put(document, key, wizard.resolve(key, flag=flag, question=""))'''

