file = "src/cratekit/cli/setup.py"
surface = "user"
tests = ["tests/test_doctor.py", "tests/test_paths_resolved.py", "tests/test_cli_contract.py"]
old = '''    missing = [key for key in config.BACKUP_DESTINATION_KEYS if not recorded(key)]'''
new = '''    missing = list(config.BACKUP_DESTINATION_KEYS)'''

[[rows]]
