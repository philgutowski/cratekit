[[rows]]
id = "A1_majority_boundary"
description = "majority_unmapped: half is a majority, so 5 of 10 refuses"
file = "src/cratekit/write/metadata_cli.py"
surface = "user"
tests = ["tests/test_paths_resolved.py", "tests/test_metadata_cli.py", "tests/test_doctor.py"]
old = '''        return self.active > 0 and self.unmapped * 2 > self.active'''
new = '''        return self.active > 0 and self.unmapped * 2 >= self.active'''

[[rows]]
id = "A2_majority_coefficient"
description = "majority_unmapped: two thirds rather than half, so 6 of 10 is not a majority"
file = "src/cratekit/write/metadata_cli.py"
surface = "user"
tests = ["tests/test_paths_resolved.py", "tests/test_metadata_cli.py", "tests/test_doctor.py"]
old = '''        return self.active > 0 and self.unmapped * 2 > self.active'''
new = '''        return self.active > 0 and self.unmapped * 3 > self.active'''

