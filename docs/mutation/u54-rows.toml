name = "u54-acquisition-worker"
pass_kind = "light"

# U54's own diff: the queue side guards in acquire/cli.py, the worker's answer
# reading, the landing checks, and the engine's new park seam in core/jobs.py.
# The unit binds a verb that WRITES files into the library's staging root, so
# every user facing guard is measured and a zero on one owes a composite.

[[rows]]
id = "G1_origin_refusal"
description = "Queue a list from any provider, dropping the refusal that only the provider's own list carries acquirable identifiers"
file = "src/cratekit/acquire/cli.py"
surface = "user"
old = '''    if origin != match.TIDAL:
        raise _unusable(
            f"this is a {origin} list, and acquiring needs the provider's own track "
            f"identifiers, which only a list fetched from the provider carries",
            "fetch the playlist from the provider into a list document first, "
            "then acquire that",
            "a pasted tracklist is matched against the library with match.run; "
            "its missing rows carry acquisition options, not identifiers",
            origin=origin,
        )
'''
new = ""

