name = "u243"
pass_kind = "light"

# U243 changes what the deletion reference set excuses (D rows) and what the
# label verbs do with a tombstoned track (L rows). The D rows carry the merge
# blocker class: any widening of the streaming excusal is a real path the
# proof would stop counting. Rows are the author's; every zero is the author
# could not kill it.

[[rows]]
id = "D1_id_class_takes_a_dot"
description = "_STREAMING_LOCATION: the id class takes any character but a slash, so /v4/catalog/tracks/123.flac/ is excused"
file = "src/cratekit/deletion/candidates.py"
surface = "user"
tests = ["tests/test_deletion_streaming.py", "tests/test_deletion.py"]
old = '''_STREAMING_LOCATION = re.compile(r"/v4/catalog/tracks/[A-Za-z0-9]+/?\Z")'''
new = '''_STREAMING_LOCATION = re.compile(r"/v4/catalog/tracks/[^/]+/?\Z")'''

[[rows]]
id = "D2_end_anchor_is_dollar"
description = "_STREAMING_LOCATION: \\Z becomes $, which also accepts a trailing newline"
