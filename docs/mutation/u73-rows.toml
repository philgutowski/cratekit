[[dropped]]
id = "A6_tie_break"
description = "Drop job_id from the sort key, leaving created alone"
reason = "the tie break only matters for two jobs created in the same timestamp, which the fixture cannot produce without faking the clock; A5 measures the order itself"

[[dropped]]
id = "A11_sync_run_dest"
description = "Write --run into dest run, colliding with the dispatcher's global --run"
reason = "a one site mutation cannot express it, since the handler reads the new dest by name; every run test drives the collision's absence, and the first build measured it failing eleven tests before the dest was separated"
