name = "u123"
pass_kind = "light"

# U123, crate label heard. A unit that writes and removes on the account, so
# its full 25 rows: the engine's refusals and its merge order, the adapter's
# playlist removal, the ledger's vouching, and the one call the dated plan
# gained. Ledger and adapter rows name their subset, since every outbound
# suite imports the ledger and the derived subset would be most of the tree.

