name = "r706-a"
pass_kind = "light"

[[rows]]
id = "A1_ceiling_dropped"
description = "Drop the parts ceiling, so a file of any length is cut into as many parts as it takes"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''    assert_one_set(spend, planned=planned)
    offsets = sample_offsets(duration_s)'''
new = '''    offsets = sample_offsets(duration_s)'''

[[rows]]
id = "A2_ceiling_one_part_wider"
description = "The ceiling admits one part more than MAX_PARTS, a coefficient row on the bound"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''    ceiling = budget.per_run * MAX_PARTS'''
new = '''    ceiling = budget.per_run * (MAX_PARTS + 1)'''

[[rows]]
id = "A3_max_parts_four"
description = "MAX_PARTS moves from three to four, the decision's Part A, B and C plus one"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''MAX_PARTS = 3'''
new = '''MAX_PARTS = 4'''

[[rows]]
id = "A4_month_asked_of_one_run"
description = "The month is asked about one run's worth rather than the whole set, so a set the month cannot afford spends its first part"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''        assert_month_within(spend, planned=len(owed), used_this_month=counter.used(month))'''
new = '''        assert_month_within(
            spend, planned=min(len(owed), spend.per_run), used_this_month=counter.used(month)
        )'''

[[rows]]
id = "A5_run_guard_dropped"
description = "Drop the per part run guard, so an oversize part is paid for"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''    for part in parts:
        assert_run_within(spend, planned=sum(1 for offset in part if offset in still_owed))
    keys = ("", "")'''
new = '''    keys = ("", "")'''

[[rows]]
id = "A6_run_message_reworded"
description = "Reword the per part run refusal, do not append to it"
file = "src/cratekit/intake/acrcloud.py"
old = '''            f"this run would take {planned} recognition calls and the per run "'''
new = '''            f"this part needs {planned} recognition calls and the per run "'''

[[rows]]
id = "A7_ceiling_message_reworded"
description = "Reword the ceiling refusal so it no longer says the file is not one set"
file = "src/cratekit/intake/acrcloud.py"
old = '''            f"nothing was sent. A file this long is not one set, so split it "'''
new = '''            f"nothing was sent. A file this long is too long, so split it "'''

[[dropped]]
id = "A8_run_guard_counts_the_whole_part"
description = "The run guard counts every chunk of a part rather than the owed ones"
reason = "unobservable behind partition: every part it builds is at or under the bound, kept or not, so counting the whole part refuses nothing the owed count admits; a guard covered by another guard, logged rather than measured"
