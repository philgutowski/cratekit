new = '''            plan=dict(gathered),'''

[[rows]]
id = "R22_membership_before_the_mark"
description = "Apply first, write memberships second: the ordering the drive reversed"
file = "src/cratekit/adopt/apply_cli.py"
surface = "user"
old = '''    membership = _write_memberships(cfg, plan, declared)

    actor = str((job.payload or {}).get(ACTOR_KEY) or "")
    report, gathered = apply_outstanding(cfg, plan, declared, actor=actor)'''
new = '''    actor = str((job.payload or {}).get(ACTOR_KEY) or "")
    report, gathered = apply_outstanding(cfg, plan, declared, actor=actor)

    membership = _write_memberships(cfg, plan, declared)'''

