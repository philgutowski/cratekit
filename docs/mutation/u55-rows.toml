                    f"report a census over a library it never read. It was queued "
                    f"by a build that did not record what its items were",
                    remedy=Remedy.REPORT_DEFECT,
                    origin=("adopt", "scan_cli"),
                    detail={"job_id": job.job_id},
                )
'''
new = ""

