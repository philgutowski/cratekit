[[dropped]]
id = "R31_check_app_version"
description = "Flip check_app_version on the reader's open"
reason = "inert by construction: open_db consults it only inside its require_closed branch, so on a read it can kill nothing. Recorded in KTD1 rather than measured."

[[dropped]]
id = "R32_apply_handler_bound"
description = "adopt.apply loses its worker, the sibling of R30"
reason = "ranked below R30 as the same guard in the same table with the same derivation; test_handlers derives the population from the registry, so one of the pair measures the mechanism"

[[dropped]]
id = "R33_artifact_ordinal"
description = "Build the artifact filename from the item identifier rather than the ordinal"
reason = "the same guard modules/outbound/artifacts already carries and U51 already measured; this unit's copy adds no new decision"

