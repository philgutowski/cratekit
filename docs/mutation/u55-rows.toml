new = '''    cfg = config.load()
    rows = {row.content_id: row for row in collection.read_collection(cfg)}'''

[[rows]]
id = "R29_apply_frozen_config"
description = "The same, on the apply worker"
file = "src/cratekit/adopt/apply_cli.py"
surface = "user"
