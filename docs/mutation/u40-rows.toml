name = "u40-author-table"
pass_kind = "full"

# U40's author table. METHOD is explicit that this is a DRAFT rather than a
# result: every fix agent on this project has run its own table honestly and
# still missed guards its own round created, because it mutates what it believes
# it changed. Measured gaps between an author's table and an independent one on
# this repository: 10 against 17, 39 against 49, 49 against 83.
#
# Scope: the round's own diff. The three files this unit adds or edits are
# src/cratekit/tagging/retag.py, src/cratekit/tagging/retag_cli.py and the new
# registry entry, plus a fixed sample of the two seams this unit becomes the
# first caller of.

# ── The null control ────────────────────────────────────────────────────────
[[rows]]
id = "N0_null_control"
description = "A comment reworded and nothing else. Must kill zero, or the baseline is red and every death below is noise."
file = "src/cratekit/tagging/retag.py"
old = '''LAYER: modules.'''
new = '''LAYER: modules layer.'''

