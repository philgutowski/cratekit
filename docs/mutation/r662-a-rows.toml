id = "M1_several_remotes_compared"
description = "destinations naming several remotes are compared against the spelled remote anyway, so an arbitrary one of them is called the expected name"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_doctor.py"]
old = '''    if len(named) != 1:
        return None
