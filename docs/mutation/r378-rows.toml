# R-378, author's table. Harvest's human output names the labels.
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r378-rows.toml

name = "r378"
pass_kind = "light"

[[rows]]
id = "G1_drop_the_review_set_case"
description = "the original defect: render never asks for the review set"
file = "src/cratekit/cli/render.py"
surface = "user"
tests = ["tests/test_label_workers.py"]
old = '''    checks = render_checks(envelope)
    review_set = render_review_set(envelope)
    if envelope.cause is not None:
        lines.append("")
        lines += render_cause(envelope.cause, summary_only=bool(checks))
    lines += checks
    lines += review_set
'''
new = '''    checks = render_checks(envelope)
    if envelope.cause is not None:
        lines.append("")
        lines += render_cause(envelope.cause, summary_only=bool(checks))
    lines += checks
'''

[[rows]]
id = "G2_name_is_dumped_with_the_other_fields"
description = "a named item is printed as key=value, so the name is not its own line"
file = "src/cratekit/cli/render.py"
surface = "user"
tests = ["tests/test_label_workers.py"]
old = '''    name = item.get("name")
    if isinstance(name, str) and name:
        return name
    return ", ".join(f"{k}={_shown_value(v)}" for k, v in item.items())
'''
new = '''    return ", ".join(f"{k}={_shown_value(v)}" for k, v in item.items())
'''

