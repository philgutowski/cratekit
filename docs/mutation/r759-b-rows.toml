name = "r759-b"
pass_kind = "light"

# R-759 table b. P4, removing the lock, repeated ten times for a kill rate,
# because it is the one row whose death rests on real timing: two processes
# have to race into a call still in flight. The interval rows are not
# repeated, since after the rewrite their deaths are comparisons of the
# gate's own stamps and hold by construction. Same text as table a.
# METHOD: a timing row carries a repeat count and a pass rate.

[[rows]]
id = "P4_lock_removed_r01"
description = "the one call at a time lock is never taken, so two processes can have a request in flight together, repeat 1 of 10"
file = "src/cratekit/core/provider_gate.py"
surface = "user"
tests = ["tests/test_provider_gate.py::test_two_processes_never_have_a_call_in_flight_together"]
old = '''                        fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
'''
new = '''                        pass
'''

