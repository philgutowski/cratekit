name = "r759-b"
pass_kind = "light"

# R-759 table b. The two rows whose kill rests on real timing, repeated ten
# times each for a kill rate: P2 is the closest a mutant comes to the bound
# (half the interval), P4 is the race the in flight test exists to catch.
# Same text as table a. METHOD: a timing row carries a repeat count.

[[rows]]
id = "P2_interval_halved_r01"
description = "the shared interval is halved, so calls from two processes come twice as fast as the configuration says, repeat 1 of 10"
file = "src/cratekit/core/provider_gate.py"
surface = "user"
tests = ["tests/test_provider_gate.py::test_two_processes_keep_the_interval_between_every_call"]
old = '''                due = max(state.last_call + self.settings.min_interval_s, state.not_before)
'''
new = '''                due = max(state.last_call + self.settings.min_interval_s / 2, state.not_before)
'''

