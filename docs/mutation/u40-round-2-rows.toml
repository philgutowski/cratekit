[[dropped]]
id = "R7_not_destructive"
description = "Declare the verb non-destructive, so the destructive-session gates never bind to it (KTD24)"
reason = "NOT MEASURABLE AS A MUTATION, and that is the answer rather than a gap. `registry.Entry.__post_init__` refuses any entry that writes files and does not declare destructive, so the mutation raises ValueError at import and takes the whole test file out of collection. Round one recorded it as a collect error for exactly that reason. The refusal itself is driven by tests/test_cli_contract.py:1143, which hands the constructor `writes={'files'}` with no destructive flag and asserts the message. A row that cannot be applied measures the type system, not the suite."

[[dropped]]
id = "R1_gate_not_explicit"
description = "Make the confirm gate ordinary, which drops the verb out of the queued-resume guard entirely"
reason = "REFUSED BY THE DRIVER in round one with a collected count of 0, because the `explicit=True,` line it anchors on is not unique in registry.py and mutate.py refuses an ambiguous match before writing anything rather than mutating the wrong site. Re-anchoring it uniquely would take the whole GateSpec block, which is what R8 above already mutates one field of. Dropped rather than re-anchored because the property it would measure, that this verb sits inside the resume guard's derived population, is exactly what R8 measures from the other flag of the same pair."
