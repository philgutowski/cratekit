# R-368, author's table. A restore verb that can be pointed at a directory
# that is not the live library.
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r368-rows.toml
#
# Every row names an explicit subset. The verb's whole surface lives in one
# test file, the mutated module is imported by that file, and a death on a
# subset is a real death. A zero is promoted to the full suite by the driver
# before it is reported as one.

name = "r368"
pass_kind = "light"

