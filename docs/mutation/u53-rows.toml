name = "u53-routing-and-rebuild-workers"
pass_kind = "light"

# U53's author table, scoped to the unit's own diff after the review's fix
# round: the apply branch and the two hollow verbs in write/routing_cli.py, the
# item derivation and the resume tail in cli/rebuild.py, and the two functions
# this unit added to write/rebuild.py. Twenty five rows, the cap. Dropped rows
