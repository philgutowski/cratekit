[[dropped]]
id = "R7_resort_reports_without_driving"
description = "The resume reports the job again instead of calling run_job, which is the state before U46"
reason = "the item state assertions in the two end to end tests read exactly this line, so R3 and R5 already measure whether anything drives; a third row over one call adds no independent evidence"

[[dropped]]
id = "R8_rebuild_reports_without_driving"
description = "The same omission in the rebuild's resume"
reason = "same as R7, and the rebuild arm of every parametrized resume test drives the same call"

[[dropped]]
id = "U5_unplaced_filter_inverted"
description = "Unplaced reports the rows the tree DOES hold"
reason = "U1 and U3 bracket this from both sides, an empty answer and an everything answer, and an inverted filter cannot survive either"

[[dropped]]
id = "E3_rows_left_as_a_cursor"
description = "rebuild_governed_tree hands the engine the content row generator rather than a list"
reason = "the engine materializes rows itself at its first line, so this mutation is inert in this build; a row known in advance to be inert is a finding to state, not a row to spend"

[[dropped]]
id = "E4_root_exists_always_true"
description = "The worker answers that every root identifier exists"
reason = "driven directly as a behaviour instead, in the test for a registry naming a root the database lacks, which is stronger than a count"

[[dropped]]
id = "A7_readings_scoped_to_the_library"
description = "The apply reads tag truth from the whole music directory rather than from the intake folder"
reason = "not expressible as one textual substitution without rewriting the derivation call, and the digest assertion already pins that the apply acts on the plan it offered"
