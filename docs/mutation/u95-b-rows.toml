name = "u95-b"
pass_kind = "light"

# U95, batch B of three: THE RE-BASING RULE, one field and one clause at a time.
# "All four fields or none" is a claim, so each field is dropped alone.

[[rows]]
id = "B1_manifest_root_not_moved"
description = "_rebased_capture leaves Capture.root at the dead root, which is what _captured_by_key composes coupled entries from"
file = "src/cratekit/core/restore.py"
surface = "user"
old = '''        root=_rebased(captured.root, recorded_root, root),'''
new = '''        root=captured.root,'''

[[rows]]
id = "B2_manifest_database_not_moved"
description = "_rebased_capture leaves Capture.database at the dead root, the file assert_verified asks the disk about"
file = "src/cratekit/core/restore.py"
surface = "user"
old = '''        database=moved(captured.database),'''
new = '''        database=captured.database,'''

[[rows]]
id = "B3_sources_not_moved"
description = "The WRITE side is not re-based: every manifest source still names the configured root"
file = "src/cratekit/core/restore.py"
surface = "user"
old = '''                source=_rebased(entry.source, recorded_root, root),'''
new = '''                source=entry.source,'''

[[rows]]
id = "B4_captured_not_moved"
description = "The READ side is not re-based: writes aim at the target while the bytes come from the dead volume, the bypass run the other way"
file = "src/cratekit/core/restore.py"
surface = "user"
old = '''                captured=moved(entry.captured),'''
new = '''                captured=entry.captured,'''

[[rows]]
id = "B5_not_idempotent"
description = "Drop the already-under-the-new-root clause, so a path naming a target mounted inside the configured root is moved twice"
file = "src/cratekit/core/restore.py"
old = '''    if parts[: len(here)] == here or parts[: len(there)] != there:'''
new = '''    if parts[: len(there)] != there:'''

[[rows]]
id = "B6_recorded_path_not_normalised"
description = "Compare the recorded path's raw parts, so a dotted spelling config calls inside is left unmoved and one it calls outside is moved"
file = "src/cratekit/core/restore.py"
old = '''    parts = Path(os.path.normpath(str(recorded))).parts'''
new = '''    parts = recorded.parts'''

[[rows]]
id = "B8_outside_path_moved_anyway"
description = "A path under NEITHER root is joined onto the target instead of left where it says it is"
file = "src/cratekit/core/restore.py"
old = '''    if parts[: len(here)] == here or parts[: len(there)] != there:
        return recorded
    return Path(root).joinpath(*parts[len(there) :])'''
new = '''    if parts[: len(here)] == here:
        return recorded
    return Path(root).joinpath(*parts[len(there) :])'''

[[dropped]]
id = "B9_equal_roots_shortcut_removed"
description = "Delete the early return for equal roots in _rebased and _rebased_capture"
reason = "an equivalent mutant: with equal roots every path under the root is already under the new root and is returned as it came, so the shortcut only saves work. The object identity it gives _rebased_capture is asserted by the golden test and would be the only death, which measures the assertion rather than a behaviour"

[[dropped]]
id = "B7_recorded_root_not_normalised"
description = "Compare the configured root's raw parts, so a root spelled with dots matches nothing and nothing is carried"
reason = "ranked below the cap: same guard family and same test as B6, which is measured. The dotted ROOT spelling has its own assertion in the re-basing test, so this is not believed to be a zero, and it was not run"
