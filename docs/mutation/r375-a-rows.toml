[[rows]]
id = "S10_commit_not_persisted_at_once"
description = "record_commit: mark the source in memory and leave the write to the close, so a hard kill after the commit leaves a record that claims none"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''    record.sources[source] = str(SourceState.COMMITTED)
    record.change = record.change.merged(change)
    write_record(record, cfg)'''
new = '''    record.sources[source] = str(SourceState.COMMITTED)
    record.change = record.change.merged(change)'''

[[rows]]
id = "S11_commit_replaces_the_summary"
description = "record_commit: replace the change summary instead of merging into it, so a second source erases the first one's counts"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''    record.sources[source] = str(SourceState.COMMITTED)
    record.change = record.change.merged(change)'''
new = '''    record.sources[source] = str(SourceState.COMMITTED)
    record.change = change'''
