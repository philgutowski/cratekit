name = "r375-a"
pass_kind = "light"

# R-375 and R-12, batch A of three: the record the gates keep, core/session.py.
# Three batches rather than one because a Relay session may not background a
# driver and the harness kills a foreground command at 600 seconds.

[[rows]]
id = "S1_keep_is_ignored"
description = "assert_gates: keep a record for nobody, so Keep.RECORD yields Gates.record None"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''            if keep is Keep.RECORD
            else nullcontext()'''
new = '''            if keep is Keep.NOTHING
            else nullcontext()'''

[[rows]]
id = "S2_record_inside_the_watch"
description = "assert_gates: open the record INSIDE the analysis watch, the ordering fault the review found, so it closes CLOSED before the watch judges"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''        with keeping as record:
            with analysis_files_unmoved(watched) if watched else nullcontext():
                yield Gates('''
new = '''        with analysis_files_unmoved(watched) if watched else nullcontext():
            with keeping as record:
                yield Gates('''

[[rows]]
id = "S3_a_raise_is_not_abandoned"
description = "_recorded: drop the abandoning close, so a body that raised leaves its record OPEN"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''            close_session(record, cfg, state=SessionState.ABANDONED, now=now)
        except Exception:  # noqa: BLE001 - the session's own error is the one to surface'''
new = '''            pass
        except Exception:  # noqa: BLE001 - the session's own error is the one to surface'''

[[rows]]
id = "S4_abandon_failure_replaces_the_error"
description = "_recorded: re-raise a failed abandonment instead of logging it, so it replaces the error that ended the session"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''            logger.warning(
                "session %s could not be recorded as abandoned", record.session_id, exc_info=True
            )
        raise'''
new = '''            raise
        raise'''

[[rows]]
id = "S5_clean_close_refusal_leaves_it_open"
description = "_recorded: move the clean close out of the try, so a close that refuses leaves the record OPEN with no verb to abandon it"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''    try:
        yield record
        close_session(
            record,
            cfg,
            state=SessionState.CLOSED,
            intent=intent,
            identity_provider=identity_provider,
            mount_enumerator=mount_enumerator,
            now=now,
        )
    except BaseException:
        try:
            close_session(record, cfg, state=SessionState.ABANDONED, now=now)
        except Exception:  # noqa: BLE001 - the session's own error is the one to surface
            logger.warning(
                "session %s could not be recorded as abandoned", record.session_id, exc_info=True
            )
        raise
'''
new = '''    try:
        yield record
    except BaseException:
        try:
            close_session(record, cfg, state=SessionState.ABANDONED, now=now)
        except Exception:  # noqa: BLE001 - the session's own error is the one to surface
            logger.warning(
                "session %s could not be recorded as abandoned", record.session_id, exc_info=True
            )
        raise
    close_session(
        record,
        cfg,
        state=SessionState.CLOSED,
        intent=intent,
        identity_provider=identity_provider,
        mount_enumerator=mount_enumerator,
        now=now,
    )
'''

