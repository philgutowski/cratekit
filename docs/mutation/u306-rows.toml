name = "u306"
pass_kind = "light"

# The guards U306 added or rewrote: the shared plumbing of the tagging verbs
# (tagging/plan_verbs.py, rows.Tallied, rows.scanned), the shared folder walk
# and zero of analysis.cli that vocals now uses, analysis.artifacts' one item
# reader, tagging.artifacts' read through jobs.Artifacts, the walk handing the
# shops their query builder, and the calibrate verb's handler. Code moved
# verbatim is held by the kill set replay, not here.

