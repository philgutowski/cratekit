file = "src/cratekit/tagging/plan_verbs.py"
surface = "user"
tests = ["tests/test_tag_remap.py", "tests/test_tag_suggest.py", "tests/test_tag_guess.py", "tests/test_tag_backlog.py", "tests/test_tag_campaign.py", "tests/test_shared_homes.py"]
