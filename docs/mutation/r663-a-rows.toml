[[rows]]
id = "M1_empty_not_refused_before_open"
description = "the size of the copy is no longer asked before the open, so an empty copy reaches the binding and is classified only if the canary is what fails"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_paths_resolved.py"]
old = '''        refusal = None if copied.stat().st_size else _not_a_library(Path(source), copied)
'''
new = '''        refusal = None
'''

[[rows]]
id = "M2_every_open_refusal_classified"
description = "the canary reason gate is removed, so any refusal on the way in, a pin or a failed open, is also asked whether the copy is a library"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_paths_resolved.py"]
old = '''            if exc.cause.reason != "canary-read-failed":
                raise
            refusal = _not_a_library(Path(source), copied)'''
new = '''            refusal = _not_a_library(Path(source), copied)'''

[[rows]]
id = "M3_unlistable_read_as_empty"
description = "a copy whose tables could not be listed is no longer kept apart from one with none, so the None check is dropped"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_paths_resolved.py"]
old = '''        if tables is None or tables.intersection(CANARY_TABLES):'''
new = '''        if tables and tables.intersection(CANARY_TABLES):'''

[[rows]]
id = "M4_one_canary_table_not_enough"
description = "a copy holding one of the two canary tables is classified as not a library, so schema drift is sent to setup"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_paths_resolved.py"]
old = '''        if tables is None or tables.intersection(CANARY_TABLES):'''
new = '''        if tables is None or tables.issuperset(CANARY_TABLES):'''

[[rows]]
id = "M5_failed_listing_returns_empty_set"
description = "a table listing whose query fails answers an empty set rather than None, so a file that could not be read is reported as holding nothing"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_paths_resolved.py"]
old = '''        return {str(row[0]) for row in rows}
    except Exception:  # noqa: BLE001 - an unlistable file keeps the canary's refusal
        return None'''
new = '''        return {str(row[0]) for row in rows}
    except Exception:  # noqa: BLE001 - an unlistable file keeps the canary's refusal
        return set()'''

[[rows]]
