# ── Considered and not run ────────────────────────────────────────────────

[[dropped]]
id = "A12_str_of_none"
description = "is_library_debris(None) reads str(None) instead of str(name or '')"
reason = "would not die by construction: 'None' does not end with the suffix, so the guard against a missing name is defence over a shape the type forbids. Named rather than run so the zero is not read as a gap."

[[dropped]]
id = "A13_mark_verb_debris_after_the_job_state"
description = "The mark verb asks the job's state before the suffix, so a failed debris job is told job-unfinished"
reason = "the verb test drives a succeeded debris job only; the order between two skip reasons on one playlist is the report's wording, not a rename, and ranked below the cap."

[[dropped]]
id = "D5_drop_recorded"
description = "Existing: the cursor no longer excludes, so a recorded playlist is queued again"
reason = "the cursor guard is the subject of u64 and r359's tables already, and this unit did not touch it; ranked below the four sampled."
