[[rows]]
id = "G9_answered_last"
description = "Ask answered rows after missing ones, so a rejected row is listed out of its playlist order"
file = "src/cratekit/intake/missing_cli.py"
surface = "user"
old = '''    asking = [
        (job, report)
        for job, report in rows_in
        if report["state"] == "missing" or next(answered)
    ]'''
new = '''    asking = sorted(
        [
            (job, report)
            for job, report in rows_in
            if report["state"] == "missing" or next(answered)
        ],
        key=lambda pair: pair[1]["state"] == "offered",
    )'''

