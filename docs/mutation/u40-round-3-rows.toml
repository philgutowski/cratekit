# ROUND 3. Two rows round two could not settle, and neither was a coverage gap.
#
# S5 was a user facing zero and the answer was that the guard was DEAD CODE.
# `tags.read_tag` trims every value it returns at `core/tags.py:489`, so nothing
# can reach `select` padded and the strip could never have fired. It is deleted
# rather than reclassified, and `T1` below measures the normalization that
# actually does the work, on the module that owns it.
#
# R8 was a collect error twice, and the SECOND one was not the same as the first.
# Its guard lived in `tests/test_queued_resume_contract.py`, whose parametrisation
# derives from the very flag the mutation removes, so the collected count moved
# with the guard and no death was countable. The guard moved to
# `tests/test_cli_contract.py`, whose parametrisations key on `landed`, and this
# re-measures it there.

