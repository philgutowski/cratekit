description = "Stop trimming the genre read off the file in select()"
reason = "NOT A GUARD AND NO LONGER PRESENT. Two rounds measured it at zero, and the reason is that `tags.read_tag` already trims every value it returns, so no input can reach `select` padded. Driven directly on 2026-08-26: writing a genre of '  Electronica ' through the real writer and reading it back through the real reader returns 'Electronica'. The strip is deleted rather than paired with a composite, because a composite would have documented dead code instead of removing it. T1 above is the composite that matters, on the module that owns the normalization."
