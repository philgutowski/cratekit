id = "B4c_both_layers"
description = "What B4 holds without B3: no reopen and any verdict read as an answer, so a superseded row reads as rejected"
file = "src/cratekit/acquire/match_cli.py"
surface = "user"
pairs_with = "B4_machine_verdict_read_as_an_answer"
