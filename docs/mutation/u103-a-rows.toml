name = "u103-a"
pass_kind = "light"

[[rows]]
id = "A1_read_serves_only_answers"
description = "Drop the reader's rule that only a match or a miss is served from a cache document"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''            if classify(payload)[0] not in _KEPT_OUTCOMES:
                continue
            answers[offset] = payload'''
new = '''            answers[offset] = payload'''

[[rows]]
id = "A2_write_keeps_only_answers"
description = "Drop the writer's rule that only a match or a miss is kept, removed alone so the reader's copy of the rule is not what is measured"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''                    for offset in sorted(merged)
                    if classify(merged[offset])[0] in _KEPT_OUTCOMES'''
new = '''                    for offset in sorted(merged)'''

[[rows]]
id = "A3_document_must_carry_its_plan"
description = "Stop checking that a cache document carries the plan it was asked for"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''        if document.get("version") != CACHE_VERSION or document.get("plan") != plan.material():'''
new = '''        if document.get("version") != CACHE_VERSION:'''

[[rows]]
id = "A5_offset_must_be_planned"
description = "Serve a kept answer at an offset the plan never asked for"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''            if offset not in planned or not isinstance(payload, dict):'''
new = '''            if not isinstance(payload, dict):'''

[[rows]]
id = "A6_digest_in_the_key"
description = "Take the recording's content digest out of the key material, so a changed file keeps its old key"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''            "digest": self.digest,
            "offsets": list(self.offsets),'''
new = '''            "digest": "",
            "offsets": list(self.offsets),'''

[[rows]]
id = "A7_offsets_in_the_key"
description = "Take the offsets out of the key material, so a changed chunk plan keeps its old key"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''            "offsets": list(self.offsets),
            "chunk_s": self.chunk_s,'''
