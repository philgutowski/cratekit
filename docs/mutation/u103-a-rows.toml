[[dropped]]
id = "A4_cache_version"
description = "Stop checking the cache document's version"
reason = "ranked below the cap: same guard line as A3, and one version exists, so nothing reachable writes another"

[[dropped]]
id = "A13_cached_count"
description = "Report zero chunks served from the cache"
reason = "ranked below the cap: a count, and the note built from it is measured by C6 in table b"

[[dropped]]
id = "A14_unwritten_only_when_paid"
description = "Report the digest failure reason even when nothing was paid for"
reason = "ranked below the cap: a pass that paid nothing over an unreadable recording raises before it returns, so the input is not reachable"

[[dropped]]
id = "A17_write_lock"
description = "Write the cache document without its sibling lock"
reason = "ranked below the cap: the only test that could see it asserts the lock file exists, which pins the file and not the exclusion, so the row would measure the wrong thing; recorded as a residual instead"
