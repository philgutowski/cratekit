[[rows]]
id = "A9_refresh_reads_nothing_kept"
description = "Let a refreshing pass read the kept answers anyway"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''    kept = kept_in.read(plan) if plan is not None and not refresh else {}'''
new = '''    kept = kept_in.read(plan) if plan is not None else {}'''

[[rows]]
id = "A10_write_is_a_merge"
description = "Replace the cache document with this pass's answers instead of laying them over what is kept"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''            merged = {**self.read(plan), **answers}'''
new = '''            merged = dict(answers)'''

[[rows]]
id = "A11_monthly_bound_reads_what_is_owed"
description = "Check the monthly bound against the whole grid instead of the chunks still owed"
file = "src/cratekit/intake/acrcloud.py"
surface = "user"
old = '''        assert_within(spend, planned=len(owed), used_this_month=counter.used(month))'''
new = '''        assert_within(spend, planned=len(offsets), used_this_month=counter.used(month))'''

[[rows]]
id = "A12_no_credential_when_nothing_is_owed"
description = "Retrieve the credentials and check the bound even when every chunk is kept"
