# R-4, the extras guard in registry.Entry and the toggle round trip. Author's
# rows, UNRUN.
#
# The full suite is about six minutes and the driver's preflight is two full
# runs, so this table cannot finish inside a relay task's ten minute foreground
# call. That is R-329. Run it attended:
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r-4-rows.toml
#
# This is a static registry, so the table is scoped to the two new guards and
# a sample of the toggle path the new round trip test drives. M1 and M2 are
# maintainer facing: they refuse an entry at import. M3 to M5 are user facing,
# a verb reachable in a profile that should not have it. M6 is an existing guard
# sampled for comparison. Each row's expected kill is in its description.

name = "r-4"
pass_kind = "light"

[[rows]]
