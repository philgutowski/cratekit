[[dropped]]
id = "D1_rated_total_planned"
description = "totals rated=len(ratings) in place of the writer's count"
reason = "equivalent on every reachable input: _unrated admits only rows whose Rating attribute is present, and every planned id is a collection row of the same bytes, so the writer patches every planned row"

[[dropped]]
id = "D2_rate_before_membership"
description = "apply ratings before the membership write"
reason = "equivalent by construction: the writer re-locates every track in one pass over the current bytes, so order does not change which element is patched"
