# R-368, round 2. The four zero rows from round 1, re-measured against the
# tests those zeros asked for, plus one composite.
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r368-round-2-rows.toml
#
# Three of round 1's zeros were a missing test rather than a guard that holds
# nothing, and the tests are in. The fourth, the resolution, is a zero that
# stays a zero: with samefile asking the filesystem, resolving is no longer
# what makes a relative spelling comparable, so the composite below measures
# the pair rather than arguing about the part.

name = "r368-round-2"
pass_kind = "light"

[[rows]]
id = "G6_ancestors_not_walked"
description = "re-measured: ask samefile of the candidate alone, so a differently cased ancestor is missed"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    return any(_same_place(ancestor, root) for ancestor in (place, *place.parents))
'''
new = '''    return _same_place(place, root)
'''

[[rows]]
id = "G14_the_destination_check_is_equality_only"
description = "re-measured: drop the name-plus-parent half, so a landing path that is not on disk yet passes"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    if _same_place(landing, live) or (
        landing.name == live.name and _same_place(landing.parent, live.parent)
    ):
'''
new = '''    if _same_place(landing, live):
'''

[[rows]]
id = "R1_the_live_root_refusal_is_reworded"
description = "re-measured: reword the destination refusal rather than appending to it"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''            f"the database would land on {landing}, which is this library's live "
            f"database; the target is outside the library root and the database "
            f"is too, so naming its directory restores over it in place",
'''
new = '''            f"the chosen folder resolves to somewhere this installation already "
            f"reads from, so the copy would replace what is there",
'''

[[rows]]
id = "G7_target_not_resolved"
description = "re-measured: compare the raw argument, leaving samefile to answer for a relative spelling"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    resolved = Path(raw).expanduser().resolve()
'''
new = '''    resolved = Path(raw).expanduser()
'''

[[rows]]
id = "G7_composite"
description = "what the resolution does hold now that samefile answers the comparison: report the word somebody typed rather than the directory it named"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
pairs_with = "G7_target_not_resolved"
tests = ["tests/test_restore_cli.py"]
old = '''            target=str(resolved),
            library_root=str(root),
'''
new = '''            target=str(raw),
            library_root=str(root),
'''
