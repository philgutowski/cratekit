name = "u142"
pass_kind = "light"

# U142: a set is archived into Downloaded Sets <year>, and an INSPIRATION
# playlist of its name proves it downloaded. Rows target the guards this unit
# added. Dropped on purpose, each one line: the digest's folder_name field is a
# function of the year it sits beside within one build, so removing it is
# equivalent; the backfill's writer open (read_only False) is unchanged code;
# check_app_version on the read handle is held by the same patched seam the
# organize suite pins, so it is left to the require_closed row.

[[rows]]
id = "S1_folder_prefix"
description = "sets: drop the Downloaded Sets prefix, so a set is filed into the plain year folder the filing owns"
file = "src/cratekit/modules/outbound/sets.py"
surface = "user"
tests = ["tests/test_export_set.py", "tests/test_organize.py", "tests/test_set_inspiration_playlist.py"]
old = '''FOLDER_PREFIX = "Downloaded Sets "'''
new = '''FOLDER_PREFIX = ""'''

[[rows]]
id = "S2_plan_reads_the_year_key"
description = "plan_archive: read the ledger's folder record under the year, so the filing's plain year folder is reused for a set"
file = "src/cratekit/modules/outbound/sets.py"
surface = "user"
tests = ["tests/test_export_set.py", "tests/test_organize.py", "tests/test_set_inspiration_playlist.py"]
old = '''    recorded = ledger.set_folder(cfg, name)'''
new = '''    recorded = ledger.set_folder(cfg, year)'''

