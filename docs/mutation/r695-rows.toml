# R-695: the two no-native-tree remedies name what the export medium
# delivers, a review of the routing and, for the inbox sweep, the long track
# root playlist the taxonomy declares, rather than a filing. Scoped to the two
# remedy texts, the new export_remedy builder and its two callers. Author's
# table, no independent verifier (METHOD, 2026-09-07).

[[rows]]
id = "T1_inbox_remedy_says_it_files"
