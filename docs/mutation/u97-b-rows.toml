[[rows]]
id = "B1_doctor_routes_the_wrong_credential_token"
description = "doctor _CREDENTIAL_REMEDY: answer the provider check with SET_CREDENTIAL, the recognition token, so the report tells a person to paste a key they cannot have"
file = "src/cratekit/cli/doctor.py"
surface = "user"
tests = ["tests/test_cli_contract.py", "tests/test_doctor.py", "tests/test_label_tidal_catalogue.py"]
old = '''        "credential.provider": Remedy.AUTHENTICATE_PROVIDER,'''
new = '''        "credential.provider": Remedy.SET_CREDENTIAL,'''

[[rows]]
id = "B2_check_table_prints_no_fix"
description = "render_checks: print the check row and swallow its fix line, so the human report names every failure and no remedy"
file = "src/cratekit/cli/render.py"
surface = "user"
tests = ["tests/test_cli_contract.py", "tests/test_doctor.py", "tests/test_label_tidal_catalogue.py"]
old = '''        if words:
            lines.append(f"         fix: {words}")'''
new = '''        if False:
            lines.append(f"         fix: {words}")'''

