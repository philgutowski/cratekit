[[rows]]
id = "B5_remediation_line_prefers_a_step"
description = "remediation_line: read the first step before the token, so a cause carrying both prints one of its steps instead of the table's words"
file = "src/cratekit/cli/render.py"
surface = "user"
tests = ["tests/test_cli_contract.py", "tests/test_doctor.py", "tests/test_label_tidal_catalogue.py"]
old = '''    remedy = cause.remediation.remedy
    if remedy is not None:'''
new = '''    remedy = cause.remediation.remedy
    if cause.remediation.steps:
        return "  fix: " + cause.remediation.steps[0]
    if remedy is not None:'''
