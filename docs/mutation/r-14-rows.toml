# R-14, the analysis share join, the watch roots, and the share warning.
# Author's rows.
#
# The full suite is about six minutes and the driver's preflight is two full
# runs, so this table cannot finish inside a relay task's ten minute foreground
# call. That is R-329. Run it attended:
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r-14-rows.toml
#
# M1 and M2 were checked red first by hand on a subset before the record was
# written, which is not the driver's measurement: M1 killed 5 of 88 in
# tests/test_analysis_store.py, tests/test_adopt_apply_cli.py and
# tests/test_backup_cli.py, and M2 killed 3 of 11 in tests/test_analysis_store.py.
# Both were restored and checked against HEAD. The rest are unrun.
# M1, M2 and M9 are user facing, a grid moved in an outside share would report
# clean or a row's grid would resolve to nothing. M5 to M8 are user facing, a
# backup would report clean over the one tree it exists to protect. M3, M4 and
# M10 are maintainer facing. Each row's expected kill is in its description.

name = "r-14"
pass_kind = "light"

[[rows]]
id = "M1_watch_drops_the_outside_share"
