# U120 author's mutation table: a landed heart joins All Favorites and its quarter.
# Twenty five rows, the cap, over the quarter rule, the engine's home, plan and
# write, the frozen date, the claims, the landing's plan, commit, record and
# screen, the backfill's gathering and write, and the verb's order.
# Considered and dropped below the cap: parse_hearted on junk (a one line
# contract the engine test pins), the smart playlist of a quarter's name
# (same guard as P1), the screen's "made" word (a wording), the report's
# hearts placed total (a count the record row covers), and the verb's
# nothing to place branch (a NO_OP wording the second run test pins).
name = "u120"
pass_kind = "light"

