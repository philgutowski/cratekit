[[dropped]]
id = "D1_resume_argv_list"
description = "fetch_argv drops the frozen list path from the resume argv"
reason = "ranked below the cap: with --job the list is never read, so the path is cosmetic on the resume and a zero here would be maintainer facing"

[[dropped]]
id = "D2_stem_limit"
description = "Halve STEM_LIMIT"
reason = "ranked below the cap: a length coefficient on a name the naming stage rewrites; the test pins 120 exactly and the row would be a certain kill"

[[dropped]]
