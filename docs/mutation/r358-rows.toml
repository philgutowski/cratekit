name = "r358"
pass_kind = "light"

# The unit adds one member to the outbound account seam and one caller for it in
# the playlists source. NOTHING ON THE PRODUCTION PATH REACHES EITHER, which is
# the whole shape of the code half, so the blast radius today is zero live
# writes and the table is scoped to the round's own diff rather than run at full
# depth.
#
# The row the brief names by hand is P1, dropping rename_playlist from the frozen
# protocol set. Six rows come from the review's own findings, restored one at a
# time, because a fix whose guard kills nothing is a fix nobody can tell from the
# defect: A1 and A2 are the review's finding 3, S1 is finding 1, S6 is finding 2,
# T1 is finding 5 and T2 is finding 6.

# ---------------------------------------------------------------------------
# The adapter's rename, modules/outbound/tidal_account.py
# ---------------------------------------------------------------------------

[[rows]]
id = "A1_empty_title_refusal"
description = "Drop the empty-title refusal, so a blank title reaches the client"
file = "src/cratekit/modules/outbound/tidal_account.py"
surface = "user"
tests = ["tests/test_outbound_tidal_account.py"]
old = '''        if not wanted.strip():
            # NOT ``provider_failure``. The provider did not fail, and its
            # remedy is "resume the job to retry this item", which is advice
            # that cannot work: the same empty title fails the same way.
            raise refuse(
                "internal-error",
                f"a rename of the playlist {playlist_id} was asked for with no "
                f"title; the client reads a falsy title as keep the current one "
                f"and answers that it succeeded, so nothing was sent",
                scope=Scope.SOURCE,
                origin=("outbound", "account"),
                detail={"playlist_id": str(playlist_id)},
            )
'''
new = ""

