tests = ["tests/test_adopt_apply_cli.py", "tests/test_cli_contract.py"]
old = '''    return plan_engine.build_adoption_plan(census(cfg), declared, tree=declared.tree.id)'''
new = '''    return plan_engine.build_adoption_plan(census(cfg), declared, tree="genre_energy")'''

# THE ROW THAT WAS HERE WAS INERT AND WAS REPLACED RATHER THAN MEASURED. It
# swapped ``census(cfg)`` for a literal ``()``, and ``census`` returns ``()`` on
# this tree, so the two trees behave identically and no test could tell them
# apart. See docs/solutions/workflow-issues/a-zero-death-row-can-be-a-test-gap-
# or-an-inert-mutation.md: replacing the constant with an alias of itself is one
# of the three inert shapes, and an inert zero costs a full suite run to say
# nothing. The row below moves the value instead.
[[rows]]
id = "P2_census_returns_a_row"
description = "Give the census a row, so the plan the gate digests is no longer the empty plan"
file = "src/cratekit/adopt/apply_cli.py"
surface = "user"
tests = ["tests/test_adopt_apply_cli.py", "tests/test_cli_contract.py"]
old = '''    del cfg
    return ()'''
new = '''    del cfg
    return (None,)'''

