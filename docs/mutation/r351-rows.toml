[[rows]]
id = "G1_name_only_seed_lookup"
description = "the original defect: every seed is resolved by folded name, never by identifier"
file = "src/cratekit/label/tidal_catalogue.py"
surface = "user"
tests = ["tests/test_label_tidal_catalogue.py"]
old = '''            artist = self._artist_from_seed(seed)
'''
new = '''            artist = self._artist_named(seed)
'''

