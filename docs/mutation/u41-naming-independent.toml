description = "Pass an empty parent_dir into naming.build from the apply pass, so the budget is measured against the wrong directory"
reason = "ranked below the cap: the budget arithmetic is already covered by E3 through E7, and the plan pass carries the identical call"

[[dropped]]
id = "C9_plan_iteration_order_unsorted"
description = "Drop sorted() from the rglob in _plan_for"
reason = "ranked below the cap and deliberately not run: the result would be filesystem order dependent, so a death or a zero would not be reproducible, which METHOD's timing rule forbids in spirit"

[[dropped]]
id = "G1_pad_head_key_span_widened"
description = "Splice the whole leading match rather than the key's own span in naming.pad_head"
reason = "ranked below the cap: U39 owns pad_head, its independent table already measured it, and this unit does not touch the head"

[[dropped]]
id = "G2_camelot_end_anchor_dropped"
description = "Remove the trailing anchor from _CAMELOT_RE"
reason = "ranked below the cap: already measured at zero by the U39 independent pass and filed as R-167; re-running it buys a second copy of a known number"

[[dropped]]
id = "H1_sanitize_segment_slash_rule_dropped"
description = "Stop folding a slash to a dash in sanitize_segment"
reason = "ranked below the cap: it is a body helper this unit does not reach, since _spec_for never calls it and dedupe only uses it on the tag-confirmed branch that this verb cannot enter with album unset"
