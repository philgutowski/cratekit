name = "r879-b"
pass_kind = "light"

# R-879: export set matches a held row by its file's ISRC, and reads a full
# search page on to the next within a bound. Every row is a guard this branch
# added, plus C11, a sample of the existing exact test the walk now feeds.

[[rows]]
id = "S1_no_library_route"
description = "match_rows: skip the library route, so a held row is searched for"
file = "src/cratekit/export/set_cli.py"
surface = "user"
tests = ["tests/test_export_set.py"]
old = '''            if not one.isrc:
                code, said = library.file_isrc(one)'''
new = '''            if False:
                code, said = library.file_isrc(one)'''

[[rows]]
id = "S2_library_route_without_agreement"
description = "match_rows: ask the account for a file's code without agree, so a file's tag is trusted alone"
file = "src/cratekit/export/set_cli.py"
surface = "user"
tests = ["tests/test_export_set.py"]
old = '''                    remote, said = _isrc_match(account, identity, one, code, agree=True)'''
new = '''                    remote, said = _isrc_match(account, identity, one, code, agree=False)'''

