name = "r187-a"
pass_kind = "light"

# Batch A of two for issue 175, the matcher and the named form. Seventeen rows.
# Batch B is the cache, eight rows, which makes the cap of 25 exactly.
#
# DROPPED FOR THE CAP, ranked below it and logged so the truncation is visible:
# the refusal's first step listing displays instead of paths (the dispatcher
# test asserts the paths, and the row is a reword of one join), the stamp built
# without sorting (a one in twenty four chance of surviving by luck makes the
# row a timing row in disguise), the cached text fields left unvalidated (the
# number validation row beside it exercises the same return), the modification
# time dropped from the identity (an existing guard that the size row's
# neighbour already samples), the resolve_anchor branch inverted (A9 removes the
# half of it this unit added), and two copies under one comparison key resolving
# to the first (a branch build_index cannot reach, maintainer facing).

[[rows]]
id = "A1_exact_first"
description = "match_in_index: never find an exact hit, so an exact name falls to the fuzzy score that cannot separate it from a longer title"
file = "src/cratekit/modules/tools/setbuilder.py"
surface = "user"
old = '''    exact = [t for t in index if t.match == wanted]'''
new = '''    exact = []'''

[[rows]]
id = "A3_holds_dropped"
