# The two zeros from batch B, re-measured against the guards they bought. Same
# mutations, same ids with an r suffix, so the pair reads as a before and after
# rather than as two different measurements.

[[rows]]
id = "B2r_reclaim_reports_a_failure_as_a_removal"
description = "Report a directory that could not be removed as one that was"
file = "src/cratekit/acquire/cli.py"
surface = "maintainer"
old = '''    try:
        directory.rmdir()
    except OSError:
        return
    removed.append(directory)'''
new = '''    try:
        directory.rmdir()
    except OSError:
        pass
    removed.append(directory)'''

