[[rows]]
id = "N1_fix_reverted"
description = "the check leaves the order unread once ordering is marked, as before R-1420, so a person's reorder after an order that moved nothing is written over"
file = "src/cratekit/sync/pair_cli.py"
surface = "user"
old = '''    return steps.has(STEP_ORDERING) and (steps.has(STEP_MOVING) or one.finishing_order)'''
new = '''    return steps.has(STEP_ORDERING)'''

[[rows]]
id = "N2_moves_begun_ignored"
description = "a pair whose moves began has its order read, so a continue of a stop part way through the moves refuses the moves' own order as moved"
file = "src/cratekit/sync/pair_cli.py"
surface = "user"
old = '''    return steps.has(STEP_ORDERING) and (steps.has(STEP_MOVING) or one.finishing_order)'''
new = '''    return steps.has(STEP_ORDERING) and one.finishing_order'''

[[rows]]
id = "N3_finish_read_too"
description = "a finish of a stopped order has its order read by the check, so a continue of a refused finish whose check lists the lag is held as moved rather than refused at the adapter"
file = "src/cratekit/sync/pair_cli.py"
surface = "user"
old = '''    return steps.has(STEP_ORDERING) and (steps.has(STEP_MOVING) or one.finishing_order)'''
new = '''    return steps.has(STEP_ORDERING) and steps.has(STEP_MOVING)'''

[[rows]]
id = "N4_ordering_mark_ignored"
description = "the order is left unread for any pair whose moves began or that finishes, ordering marked or not"
file = "src/cratekit/sync/pair_cli.py"
surface = "maintainer"
old = '''    return steps.has(STEP_ORDERING) and (steps.has(STEP_MOVING) or one.finishing_order)'''
new = '''    return steps.has(STEP_MOVING) or one.finishing_order'''

[[rows]]
id = "N5_order_always_read"
description = "every part written pair has its order read, the moves' own included"
file = "src/cratekit/sync/pair_cli.py"
surface = "user"
old = '''    return steps.has(STEP_ORDERING) and (steps.has(STEP_MOVING) or one.finishing_order)'''
new = '''    return False and steps.has(STEP_ORDERING)'''

[[rows]]
id = "N6_call_site_never_reads_order"
description = "the check passes ordering as true for every part written pair, so no order is read once an account write began"
file = "src/cratekit/sync/pair_cli.py"
surface = "user"
old = '''                why = _beyond(one, now, ordering=_ordered_by_this_run(one, of(one)))'''
new = '''                why = _beyond(one, now, ordering=True)'''

