name = "r290-author"
pass_kind = "light"

# Scoped to this round's own diff: the one mapping, the dispatcher's reading of
# it, the one owner of a reworded refusal and the two hops that go through it,
# and the call in the shells. No fixed sample of older guards, because the older
# guard in every one of these shells WAS the predicate this unit replaced.
#
# Every row has a user facing surface: each one, reverted, puts exit 0 or the
# wrong outcome word over a job that did not finish.
#
# The subset is named on the shell rows and derived on the rest. A shell's
# derived subset is the files importing that shell, which does not include
# tests/test_job_outcome.py, the population test written for exactly these
# calls, so every shell row would read zero on its subset and cost a full run.
#
# 27 rows were wanted and the light cap is 25. The two dropped are at the foot.

# ── The mapping ──────────────────────────────────────────────────────────────

[[rows]]
id = "J1_blocked_branch_removed"
description = "Skip the blocked branch of raise_for_state, so a parked job falls through to the closed predicate that cannot see it, which is R-290 itself"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """    if job.state is JobState.BLOCKED:
        # ``transition`` refuses"""
new = """    if False and job.state is JobState.BLOCKED:
        # ``transition`` refuses"""

[[rows]]
id = "J2_blocked_raises_the_plain_type"
description = "Raise a plain CratekitError for a parked job, so the verb exits non zero and the outcome word says failed"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """        raise JobBlocked(job.cause)"""
new = """        raise CratekitError(job.cause)"""

[[rows]]
id = "J3_closed_branch_removed"
description = "Drop the closed and carrying a cause branch, so a half failed or cancelled job is reported, which is R-225 in every verb at once"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """    if not job.is_open() and job.cause is not None:
        if job.state is JobState.CANCELLED:"""
new = """    if False and not job.is_open() and job.cause is not None:
        if job.state is JobState.CANCELLED:"""

[[rows]]
id = "J4_predicate_narrowed_to_failed"
description = "Narrow the closed predicate to FAILED alone, so a run stopped by a signal is reported through a normal envelope"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """    if not job.is_open() and job.cause is not None:
        if job.state is JobState.CANCELLED:"""
new = """    if job.state is JobState.FAILED and job.cause is not None:
        if job.state is JobState.CANCELLED:"""

[[rows]]
id = "J5_causeless_block_returns"
description = "Return for a blocked job that records no reason, reading a missing reason as a missing problem"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """        if job.cause is None:
            raise JobBlocked(
                refuse("""
new = """        if job.cause is None:
            return
            raise JobBlocked(
                refuse("""

[[rows]]
id = "J6_causeless_block_raises_the_plain_type"
description = "Refuse a blocked job that records no reason as a plain error, so the envelope says failed over a row the job listing calls blocked"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """        if job.cause is None:
            raise JobBlocked(
                refuse("""
new = """        if job.cause is None:
            raise CratekitError(
                refuse("""

[[rows]]
id = "J7_cancelled_raises_the_plain_type"
description = "Raise a plain CratekitError for a cancelled job, so a person who stopped a run is told it failed"
file = "src/cratekit/core/jobs.py"
surface = "user"
old = """            raise JobCancelled(job.cause)"""
new = """            raise CratekitError(job.cause)"""

# ── The dispatcher ───────────────────────────────────────────────────────────

[[rows]]
id = "D1_dispatcher_ignores_the_type"
description = "Make the dispatcher blind to JobBlocked, so a parked job exits non zero and says failed"
file = "src/cratekit/cli/__init__.py"
surface = "user"
old = """        parked = isinstance(exc, JobBlocked)"""
new = """        parked = False"""

[[rows]]
id = "D2_parked_marked_resumable"
description = "Mark a parked job's envelope resumable, which sends a wrapper to crate run for work only the verb can continue"
file = "src/cratekit/cli/__init__.py"
surface = "user"
old = """            resumable=resumable,
            outcome=outcome,"""
new = """            resumable=resumable or parked,
            outcome=outcome,"""

[[rows]]
id = "D3_resumable_read_off_the_code_alone"
description = "Derive resumable from the cause's code alone again, so a worker parking on a gate coded cause tells a wrapper the gate run can continue the job"
file = "src/cratekit/cli/__init__.py"
surface = "user"
old = """        resumable = cause.code in gates.GATE_CODES and not parked"""
new = """        resumable = cause.code in gates.GATE_CODES"""

[[rows]]
id = "D4_cancelled_reads_failed"
description = "Read the cancelled type as the failed outcome, which is what the dispatcher said before Outcome.CANCELLED had a producer"
file = "src/cratekit/cli/__init__.py"
surface = "user"
old = """            outcome = Outcome.CANCELLED"""
new = """            outcome = Outcome.FAILED"""

# ── The reworded refusal, its one owner and the two hops through it ──────────

[[rows]]
id = "R1_retag_rebuild_drops_the_type"
description = "Rebuild the retag refusal as a plain CratekitError again, so a retag parked after correcting a file says failed"
file = "src/cratekit/tagging/retag_cli.py"
surface = "user"
tests = ["tests/test_job_outcome.py", "tests/test_tag_workers.py"]
old = """    return rebuilt(
        error,
        replace("""
new = """    return CratekitError(
        replace("""

[[rows]]
id = "R2_backup_rebuild_drops_the_type"
description = "Rebuild the backup rehearsal refusal as a plain CratekitError again, so a rehearsal the worker parked says failed"
file = "src/cratekit/backup/cli.py"
surface = "user"
tests = ["tests/test_job_outcome.py", "tests/test_backup_cli.py"]
old = """    return rebuilt(
        error,
        replace("""
new = """    return CratekitError(
        replace("""

[[rows]]
id = "R3_the_owner_drops_the_type"
description = "Make cause.rebuilt return the plain type for every input, so both hops drop the blocked bit at once with no hand written rebuild for the static guard to find"
file = "src/cratekit/core/cause.py"
surface = "user"
tests = ["tests/test_job_outcome.py", "tests/test_tag_workers.py", "tests/test_backup_cli.py"]
old = """            return kind(cause)"""
new = """            return CratekitError(cause)"""

