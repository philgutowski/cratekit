id = "r375-a.S2_record_inside_the_watch"
source = { table = "r375-a.json", id = "S2_record_inside_the_watch" }
description = "assert_gates: open the record INSIDE the analysis watch, the ordering fault the review found, so it closes CLOSED before the watch judges"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_tree_writer.py", "tests/test_metadata_cli.py", "tests/test_restore.py"]
old = '''
        try:
            with analysis_files_unmoved(watched) if watched else nullcontext():
                yield Gates(
                    workflow=workflow,
                    lock=held,
                    acknowledgment=acknowledgment,
                    volume=volume,
                    intent=intent,
                    record=record,
                )
            if record is not None:
                close_session(
                    record,
                    resolved,
                    state=SessionState.CLOSED,
                    intent=intent,
                    identity_provider=identity_provider,
                    mount_enumerator=mount_enumerator,
                    now=now,
                )
        except BaseException:
            if record is not None:
                try:
                    close_session(record, resolved, state=SessionState.ABANDONED, now=now)
                except Exception:  # noqa: BLE001 - the session's own error is the one to surface
                    logger.warning(
                        "session %s could not be recorded as abandoned",
                        record.session_id,
                        exc_info=True,
                    )
            raise
'''
new = '''
        with analysis_files_unmoved(watched) if watched else nullcontext():
            try:
                yield Gates(
                    workflow=workflow,
                    lock=held,
                    acknowledgment=acknowledgment,
                    volume=volume,
                    intent=intent,
                    record=record,
                )
                if record is not None:
                    close_session(
                        record,
                        resolved,
                        state=SessionState.CLOSED,
                        intent=intent,
                        identity_provider=identity_provider,
                        mount_enumerator=mount_enumerator,
                        now=now,
                    )
            except BaseException:
                if record is not None:
                    try:
                        close_session(record, resolved, state=SessionState.ABANDONED, now=now)
                    except Exception:  # noqa: BLE001 - the session's own error is the one to surface
                        logger.warning(
                            "session %s could not be recorded as abandoned",
                            record.session_id,
                            exc_info=True,
                        )
                raise
'''

