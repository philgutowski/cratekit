# ── The searcher: fallback order and the four way outcome ─────────────────────

[[rows]]
id = "R1_fallback_order"
description = "Reverse the fallback order, so Bandcamp answers before Beatport"
file = "src/cratekit/tagging/searchers.py"
surface = "user"
old = '''_SEARCHES = (_search_beatport, _search_traxsource, _search_bandcamp)'''
new = '''_SEARCHES = (_search_bandcamp, _search_traxsource, _search_beatport)'''

[[rows]]
id = "R2_unreachable_counts_as_an_answer"
description = "METHOD's first pattern: an unreachable source reads as a miss, so a catalogue that was down reports as a catalogue that has never heard of the track"
file = "src/cratekit/tagging/searchers.py"
surface = "user"
old = '''    if any(outcome.answer is Answer.MISS for outcome in outcomes):
        return None'''
new = '''    if any(
        outcome.answer in {Answer.MISS, Answer.UNREACHABLE} for outcome in outcomes
    ):
        return None'''

[[rows]]
id = "R3_parse_break_folds_into_unreachable"
description = "The same mistake one layer along: a moved page shape reports as a network problem, which is a permanent state wearing a transient remedy"
file = "src/cratekit/tagging/searchers.py"
surface = "user"
old = '''    broken = [outcome for outcome in outcomes if outcome.answer is Answer.PARSE_BREAK]
    if broken:'''
new = '''    broken: list[SourceOutcome] = []
    if broken:'''

[[rows]]
id = "R4_nothing_answered_declines"
description = "A searcher no source answered returns None, so every item of a job reports done over answers nobody got"
file = "src/cratekit/tagging/searchers.py"
surface = "user"
old = '''    if any(outcome.answer is Answer.MISS for outcome in outcomes):
        return None

    broken'''
new = '''    return None

    broken'''

