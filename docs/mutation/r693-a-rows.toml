surface = "user"
tests = ["tests/test_gate_shown_plan.py", "tests/test_cli_contract.py"]
old = '''    return {**named, "digest": plan["digest"], "count": len(items), "items": items}'''
new = '''    return {**named, "digest": "", "count": len(items), "items": items}'''

