[[rows]]
id = "G1_require_drops_the_plans_context"
description = "Gates.require: bind the digest off the plan but show nothing, the defect R-693 recorded, one layer down"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_shown_plan.py", "tests/test_cli_contract.py"]
old = '''            context = shown_plan(plan, context)'''
new = '''            context = context'''

[[rows]]
id = "G2_items_cut_to_the_first"
description = "shown_plan: list only the first item, a bound the ledger forbids"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_shown_plan.py", "tests/test_cli_contract.py"]
old = '''    items = list(plan["items"])
    return {**named, "digest": plan["digest"], "count": len(items), "items": items}'''
new = '''    items = list(plan["items"])
    return {**named, "digest": plan["digest"], "count": len(items), "items": items[:1]}'''

[[rows]]
id = "G3_digest_not_shown"
