[[rows]]
id = "M6_reason_counted_outside_state_guard"
description = "a reason is counted before the state word is checked, so a row in a state the counts do not know is counted under it"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py"]
old = '''        if word in counts:
            counts[word] += 1
            why = report.get("why")
            if isinstance(why, str) and why:
                by_reason[word][why] = by_reason[word].get(why, 0) + 1'''
new = '''        why = report.get("why")
        if isinstance(why, str) and why:
            by_reason.setdefault(word, {})[why] = by_reason.get(word, {}).get(why, 0) + 1
        if word in counts:
            counts[word] += 1'''

