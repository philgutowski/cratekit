name = "u51-item-derivation"
pass_kind = "light"

# U51's mutation table. The plan's Verification Contract names the item
# derivation and the two handlers, because those are where this unit's own
# decisions live: what a job's items ARE, and that a job cannot queue none.
#
# The provider engines are deliberately NOT mutated. This unit is their first
# caller and owns defects it makes reachable, but a table over lines it did not
# write measures the engine's suite rather than this binding.

