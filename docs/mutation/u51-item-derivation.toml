[[rows]]
id = "L1_reserve_lock_last"
description = "Take the ledger lock AFTER the create, which is the ordering that duplicated"
file = "src/cratekit/modules/outbound/ledger.py"
surface = "user"
old = '''    lock = _locked(cfg)
    try:
        record = _load(cfg)["playlists"].get(playlist_key) or {}
        recorded = record.get("remote_id")
        if recorded:
            return str(recorded), False
        remote_id = create()
        _record_playlist_locked(cfg, playlist_key, remote_id)
        return remote_id, True
    finally:
        lock.__exit__(None, None, None)'''
new = '''    recorded = playlist_remote_id(cfg, playlist_key)
    if recorded:
        return str(recorded), False
    remote_id = create()
    record_playlist(cfg, playlist_key, remote_id)
    return remote_id, True'''

