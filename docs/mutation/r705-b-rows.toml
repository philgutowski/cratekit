name = "r705-b"
pass_kind = "light"

# R-705: the provider gate. Part B of two, twelve rows on the seams: the
# client opener's ask and attach, the vendored adapter's ask before the login,
# its attach to the tool's session, its two asks after the tool returns, the
# two pass throughs in acquire_one, the catalogue's playlist read, the
# configuration's finiteness check, and the dispatcher's spend line at both
# ends. Part A is the gate module. Author's table, no independent verifier
# (METHOD, 2026-09-07).

[[rows]]
id = "S1_client_session_never_asks"
description = "the catalogue and account opener builds a client inside the cooldown"
file = "src/cratekit/acquire/provider_session.py"
surface = "user"
tests = ["tests/test_provider_gate.py"]
old = '''
    gate.assert_open()
    with materialised_session(name) as scope:
'''
new = '''
    with materialised_session(name) as scope:
'''

