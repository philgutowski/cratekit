id = "A3_budget_off_by_one"
description = "paginate_cursor: let the budget guard allow one request past the cap, so a cursor that never changes spends more than its budget"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_label_playlists.py"]
old = '''        if pages >= max_pages:
            raise ListingTruncated(
                f"{shape or 'listing'} spent its whole budget of {max_pages} requests "
                f"at {page_size} per page without reaching the end, having collected "
                f"{len(items)} item(s). The budget is sized far above any real "
                f"collection, so reaching it means the provider is not advancing its "
                f"cursor. Returning'''
new = '''        if pages > max_pages:
            raise ListingTruncated(
                f"{shape or 'listing'} spent its whole budget of {max_pages} requests "
                f"at {page_size} per page without reaching the end, having collected "
                f"{len(items)} item(s). The budget is sized far above any real "
                f"collection, so reaching it means the provider is not advancing its "
                f"cursor. Returning'''

