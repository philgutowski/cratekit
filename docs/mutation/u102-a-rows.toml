name = "u102-a"
pass_kind = "light"

# Batch A of two for issue 147, U102. Thirteen rows: the queue reader, the
# checks on a proposed name, the root filter and the plan's classes. Batch B is
# the collection guard, the gate, the incomplete report and the claim, twelve
# rows, which makes the cap of 25 exactly.
#
# Every row names its subset, because no test file imports the verb's module:
# the tests drive it through the real dispatcher, so the derived subset would be
# empty and every row would promote to a full suite run.

[[rows]]
id = "D1_keep_is_not_accept"
description = "decided(): read the accepted verdict alone, so an item answered keep is treated as a rename to apply"
file = "src/cratekit/intake/repair.py"
surface = "user"
tests = ["tests/intake/test_repair_apply.py", "tests/intake/test_repair.py"]
old = '''        elif item.option != ACCEPT:
            kept += 1'''
new = '''        elif item.option is None:
            kept += 1'''

