[[rows]]
id = "B9_queue_again"
description = "The retired verb queues a sweep again: the refusal is replaced by a legacy enqueue over the registry"
file = "src/cratekit/label/cli.py"
surface = "user"
tests = ["tests/test_label_workers.py", "tests/test_cli_contract.py"]
old = '''    if ctx.args.job:
        return _resume(ctx, ctx.args.job)
    raise refuse(
        "verb-retired",'''
new = '''    if ctx.args.job:
        return _resume(ctx, ctx.args.job)
    held = labels.RegistryStore().load()
    if held.labels:
        return _queue(
            ctx,
            payload={"source_id": "labels", "run_id": ctx.run.run_id},
            item_ids=tuple(entry.label_id for entry in held.labels.values()),
        )
    raise refuse(
        "verb-retired",'''

