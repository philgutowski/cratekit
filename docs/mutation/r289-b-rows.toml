# The staging sweep, its three call sites and the reader it asks through.
# The tagging walk's rows are the first batch, docs/mutation/r289-a-rows.toml,
# split only because one batch of 21 rows can pass the harness time ceiling.

# ---------------------------------------------------------------------------
# B. The staging sweep, R-291
# ---------------------------------------------------------------------------

[[rows]]
id = "B1_reclaim_rmtree"
description = "Reclaim with rmtree, so a refused landing kept as evidence is deleted"
file = "src/cratekit/acquire/cli.py"
surface = "user"
old = '''    try:
        directory.rmdir()
    except OSError:
        return
    removed.append(directory)'''
new = '''    try:
        shutil.rmtree(directory)
    except OSError:
        return
    removed.append(directory)'''

[[rows]]
id = "B2_reclaim_reports_a_failure_as_a_removal"
description = "Report a directory that could not be removed as one that was"
file = "src/cratekit/acquire/cli.py"
surface = "maintainer"
old = '''    try:
        directory.rmdir()
    except OSError:
        return
    removed.append(directory)'''
new = '''    try:
        directory.rmdir()
    except OSError:
        pass
    removed.append(directory)'''

[[rows]]
id = "B3_terminal_filter_gone"
