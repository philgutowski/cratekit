[[rows]]
id = "B5_job_directory_before_its_items"
description = "Reclaim the job directory first, so its item directories never go"
file = "src/cratekit/acquire/cli.py"
surface = "user"
old = '''        for item_dir in _children(job_dir):
            if item_dir.is_dir():
                _reclaim(item_dir, removed)
        _reclaim(job_dir, removed)'''
new = '''        _reclaim(job_dir, removed)
        for item_dir in _children(job_dir):
            if item_dir.is_dir():
                _reclaim(item_dir, removed)'''

[[rows]]
id = "B6_job_directory_never_reclaimed"
description = "Reclaim the item directories and leave the job directory behind"
file = "src/cratekit/acquire/cli.py"
surface = "user"
old = '''                _reclaim(item_dir, removed)
        _reclaim(job_dir, removed)'''
new = '''                _reclaim(item_dir, removed)'''

