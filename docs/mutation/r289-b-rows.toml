new = '''        if False:'''

[[rows]]
id = "B4_unknown_job_read_as_terminal"
description = "Read a directory naming a job this queue does not hold as finished"
file = "src/cratekit/acquire/cli.py"
surface = "user"
old = '''        if states.get(job_dir.name) not in jobs.TERMINAL_STATES:'''
