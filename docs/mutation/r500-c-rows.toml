new = '''        "collection-row-unmapped": ExitCode.LIBRARY_UNREADABLE,'''

[[rows]]
id = "G14_located_skips_the_decode"
description = "trees.located resolves the raw recorded value without decoding it, the shared locate step both writers and this verb now call"
file = "src/cratekit/write/trees.py"
surface = "user"
old = '''    decoded = locations.location_to_path(str(recorded))
    return decoded,'''
new = '''    decoded = str(recorded)
    return decoded,'''

[[rows]]
id = "G15_other_host_refuses"
description = "Existing U67 guard, sampled: a row naming another host raises out of the verb rather than being passed over"
file = "src/cratekit/write/naming_cli.py"
surface = "user"
old = '''        except locations.LocationDecodeError:
            continue'''
new = '''        except locations.LocationDecodeError:
            raise'''

[[dropped]]
id = "D1_prefix_none_filter"
description = "Drop the `if prefix` filter on the grouped prefixes"
reason = "unreachable by construction rather than untested: leading_prefix answers None only for a path with no leading slash, and such a path resolves NOT_A_PATH and is never dark. It stays as the type's guard, since sorted over None and str raises"

[[dropped]]
id = "D2_prefixes_unsorted"
description = "Replace sorted over the prefix set with list"
reason = "a set's order is per process, so the row would measure hash seeding rather than the suite, and a death would not repeat"

[[dropped]]
id = "D3_empty_value_skip"
description = "Drop the skip over a row with no recorded path, an existing U67 line"
reason = "outside the round's diff and below the sample: an empty value resolves NOT_A_PATH, adds the key of the empty string, and can neither refuse nor match a candidate"
