new = '''        remedy=Remedy.RUN_DOCTOR,'''

[[rows]]
id = "G13_exit_code"
description = "Map the new reason to LIBRARY_UNREADABLE, the code of the verb's other refusal, though the library read cleanly"
file = "src/cratekit/core/cause.py"
surface = "user"
tests = ["tests/test_naming_apply_cli.py", "tests/test_reserved_causes.py"]
