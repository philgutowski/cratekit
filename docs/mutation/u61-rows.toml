name = "u61"
pass_kind = "light"

# U61 turns `crate sync all` into a composer. The brief scopes the table to the
# source loop, the gate branch and the nothing queued branch. It adds the review
# fix's queue time branch, `Gates.hand_off`'s guards, because the gate branch
# rests on them, and one row on the favourites factoring. 21 rows against a cap
# of 25, nothing dropped.
#
# ONE SUBSET FOR EVERY ROW, `tests/test_sync_all.py`, and the first row targets
# `src/cratekit/sync/cli.py` so the null control runs on a subset too. R-329
# measured that the driver's unconditional full baseline takes about six minutes
# of a ten minute foreground call, so the rows have to be cheap to fit behind it.
# A death on the subset is a real death. A zero cannot be promoted inside the
# same call, and the notes say which rows that leaves.

# ---------------------------------------------------------------------------
# The source loop
# ---------------------------------------------------------------------------

[[rows]]
id = "P1_not_built_reads_as_would_queue"
description = "A source with no worker is planned as though it could queue, so playlists reads as ok instead of not built"
file = "src/cratekit/sync/cli.py"
tests = ["tests/test_sync_all.py"]
surface = "user"
old = '''        return _Plan(spec=spec, not_queued=NOT_BUILT)'''
new = '''        return _Plan(spec=spec)'''

[[rows]]
id = "P2_a_source_refusal_ends_the_pass"
description = "A source's own precondition refusal is raised instead of recorded, so an empty registry stops favourites"
file = "src/cratekit/sync/cli.py"
tests = ["tests/test_sync_all.py"]
surface = "user"
old = '''        return _Plan(spec=spec, refused=exc.cause, not_queued=exc.cause.reason)'''
new = '''        raise'''

[[rows]]
id = "P3_profile_ignored"
description = "Every declared source is planned whatever the profile enables"
file = "src/cratekit/sync/cli.py"
tests = ["tests/test_sync_all.py"]
surface = "user"
old = '''    plans = [_plan(spec, ctx) for spec in sources.enabled_specs(membership)]'''
new = '''    plans = [_plan(spec, ctx) for spec in sources.SPECS]'''

[[rows]]
id = "P4_one_intake_run_per_source"
description = "Each source is queued under its own intake run rather than the pass's one run, breaking R29"
file = "src/cratekit/sync/cli.py"
tests = ["tests/test_sync_all.py"]
surface = "user"
old = '''                    plan.job = queue(store, cfg, run_id)'''
new = '''                    plan.job = queue(store, cfg, plan.spec.source_id)'''

[[rows]]
id = "P5_labels_under_sync_all"
description = "The labels sweep is queued under sync.all, the key nothing runs"
file = "src/cratekit/sync/cli.py"
tests = ["tests/test_sync_all.py"]
surface = "user"
old = '''            store, cfg, handler_key=str(spec.handler_key), run_id=run_id, item_ids=items'''
new = '''            store, cfg, handler_key="sync.all", run_id=run_id, item_ids=items'''

[[rows]]
id = "P6_favorites_under_sync_all"
description = "The favourites sweep is queued under sync.all, the key nothing runs"
file = "src/cratekit/sync/cli.py"
tests = ["tests/test_sync_all.py"]
surface = "user"
old = '''                handler_key=str(spec.handler_key),'''
new = '''                handler_key="sync.all",'''

