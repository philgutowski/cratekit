[[rows]]
id = "P6_id_anywhere_in_path"
description = "Take the identifier from anywhere in the path rather than the last segment"
file = "src/cratekit/label/tidal_catalogue.py"
tests = ["tests/test_label_tidal_catalogue.py"]
surface = "user"
old = '''        if (
            len(segments) >= 2
            and segments[-2] == "playlist"
            and _UUID.fullmatch(segments[-1])
        ):
            return segments[-1].lower()'''
new = '''        for segment in segments:
            if _UUID.fullmatch(segment):
                return segment.lower()'''

