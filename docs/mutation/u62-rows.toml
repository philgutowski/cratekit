name = "u62"
pass_kind = "light"

# U62 adds a catalogue adapter that reads and never writes. The brief scopes the
# table to the reference parser, the absence contract and the paging, and the
# review round added the login classification and the ambiguity refusal, so those
# are here too. Subsets are the files importing the mutated module; a zero on a
# subset is promoted to the full suite before it is reported.

# ---------------------------------------------------------------------------
# The reference parser
# ---------------------------------------------------------------------------

[[rows]]
id = "P1_bare_id_accepts_anything"
description = "Accept any bare text as an identifier: fullmatch weakened to match"
file = "src/cratekit/label/tidal_catalogue.py"
tests = ["tests/test_label_tidal_catalogue.py"]
surface = "user"
old = '''    if _UUID.fullmatch(text):
        return text.lower()'''
new = '''    if _UUID.match(text):
        return text.lower()'''

