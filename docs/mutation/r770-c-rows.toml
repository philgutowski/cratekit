name = "r770-c"
pass_kind = "light"

# The second half of the file verb's native path: what refuses before the gate
# and what a failure past it says. Five rows, since a zero promoted to the full
# suite has to fit under the foreground ceiling with the two preflight runs.

[[rows]]
id = "C1_unplaceable_file_reaches_the_gate"
description = "_file_native: do not ask whether a declared sub would take the file"
file = "src/cratekit/intake/file_cli.py"
surface = "user"
tests = ["tests/test_intake_writers_native.py"]
old = '''    if ingest.decide_placement(meta, declared) is None:'''
new = '''    if False:'''

[[rows]]
id = "C2_untyped_suffix_reaches_the_gate"
description = "_file_native: do not refuse a suffix the database has no file type for"
file = "src/cratekit/intake/file_cli.py"
surface = "user"
tests = ["tests/test_intake_writers_native.py"]
old = '''    if native.file_type_of(target) is None:'''
new = '''    if False:'''

[[rows]]
id = "C3_failure_past_the_gate_loses_its_reason"
description = "write: report every failure past the gate as internal-error, whatever refused"
file = "src/cratekit/intake/file_cli.py"
surface = "user"
tests = ["tests/test_intake_writers_native.py"]
old = '''                inner.reason if inner is not None else "internal-error",'''
new = '''                "internal-error",'''

[[rows]]
id = "C4_failure_past_the_gate_loses_its_remedy"
description = "write: drop the inner refusal's remedy, so the reason's default answers"
file = "src/cratekit/intake/file_cli.py"
surface = "user"
tests = ["tests/test_intake_writers_native.py"]
old = '''                remedy=inner.remediation.remedy if inner is not None else None,'''
new = '''                remedy=None,'''

[[rows]]
id = "C5_playlist_named_for_the_whole_file_name"
description = "_file_native: name the batch playlist with the suffix on, a nearby name"
file = "src/cratekit/intake/file_cli.py"
surface = "user"
tests = ["tests/test_intake_writers_native.py"]
old = '''            batch=path.stem,'''
new = '''            batch=path.name,'''
