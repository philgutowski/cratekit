name = "r688"
pass_kind = "full"

# R-688: route inbox --export stops writing star ratings into an export, since
# an import keeps the database's rating on every row an export carries, and
# counts the owed ratings into one rating-not-landable warning instead. The
# unit removes a write, so the table takes the full pass: every new guard, the
# regression the residual recorded, and a sample of the unit's existing guards.
# Author's table, no independent verifier (METHOD, 2026-09-07).

[[rows]]
id = "W1_rating_written_again"
description = "the export writer patches a rating onto every routed row again, the defect R-688 recorded: a write the import never lands"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_routing_workers.py"]
old = '''
    report = trees.apply_playlist_changes(plan, buffer, tree=tree)
    lengthened, long_warning = 0, None
'''
new = '''
    report = trees.apply_playlist_changes(plan, buffer, tree=tree)
    trees.apply_rating_changes({key: 255 for keys in plan.values() for key in keys}, buffer)
    lengthened, long_warning = 0, None
'''

