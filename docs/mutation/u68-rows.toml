name = "u68"
pass_kind = "light"

# U68 adds the one writer of the list document, acquire/listdoc.py. It writes
# files, so every new guard is removed alone. The unit is new, so there are no
# existing guards of its own to sample. Subset: tests/test_listdoc.py, the only
# file importing the module; a zero is promoted to the full suite.

# ---------------------------------------------------------------------------
# Which rows reach the document
# ---------------------------------------------------------------------------

[[rows]]
id = "D1_unlisted_on_blank_ref"
description = "A row with no provider id is written to the document instead of being returned unlisted"
file = "src/cratekit/acquire/listdoc.py"
surface = "user"
tests = ["tests/test_listdoc.py"]
old = '''        if not ref:
            unlisted.append(row)
            continue'''
new = '''        if False:
            unlisted.append(row)
            continue'''

