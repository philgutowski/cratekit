[[rows]]
id = "F3_checks_before_writes"
description = "Write each file as it is checked, so a refused manifest can leave a written list and the reverse"
file = "src/cratekit/acquire/listdoc.py"
surface = "user"
tests = ["tests/test_listdoc.py"]
old = '''    pending = [
        (path, payload)
        for path, payload in ((manifest_path, manifest_bytes), (list_path, list_bytes))
        if not _unchanged(path, payload)
    ]
    for path, payload in pending:
        config.atomic_write_bytes(payload, path)'''
new = '''    for path, payload in ((list_path, list_bytes), (manifest_path, manifest_bytes)):
        if not _unchanged(path, payload):
            config.atomic_write_bytes(payload, path)'''

