[[rows]]
id = "A14_backfill_apply_hides_made"
description = "Drop the naming of already made playlists when a later backfill apply fails"
file = "src/cratekit/export/set_cli.py"
surface = "user"
tests = ["tests/test_u129_set_account_playlist.py"]
old = '''    except CratekitError as exc:
        # Name what already landed so a mid-loop failure does not hide it (U129).
        if applied:
            made = ", ".join(applied)
            raise refuse(
                exc.cause.reason,
                f"before this failed the backfill already made {made}. {exc.cause.message}",
                remedy=exc.cause.remediation.remedy,
                steps=(
                    *exc.cause.remediation.steps,
                    "the playlists named above are on the account; resume or "
                    "run crate export set again for the rest",
                ),
                scope=Scope.RUN,
                retryable=exc.cause.retryable,
                origin=_SET,
                detail={**dict(exc.cause.detail), "applied": list(applied)},
                inner=exc.cause,
            ) from exc
        raise
'''
new = '''    except CratekitError:
        raise
'''

