name = "u962"
pass_kind = "full"

# U962, a large card: an app answers a gate bound to the digest it showed, and
# mints the backup acknowledgment under the age rule. Rows M are the unit's own
# guards, each reverted alone; rows E are a fixed sample of the existing guards
# the brief says must still fire under the app.

