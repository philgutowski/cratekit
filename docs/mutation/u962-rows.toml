tests = ["tests/test_app_answers_a_gate.py", "tests/test_gate_not_reached.py", "tests/test_gate_stale_screen.py", "tests/test_gate_siblings.py", "tests/test_run_decide_continue.py", "tests/test_run_show_gate.py", "tests/test_session_ack_by_app.py"]
old = '''    if expect is not None and state.offers.get(spec.name) != expect:
        raise DigestMismatch(state, spec, expect, actor)
    state.decisions[spec.name] = Decision(
        option=option,
        actor=actor,
        recorded=output.timestamp(),
        digest=state.offers.get(spec.name),
    )'''
new = '''    state.decisions[spec.name] = Decision(
        option=option,
        actor=actor,
        recorded=output.timestamp(),
        digest=state.offers.get(spec.name),
    )
