# R-338, batch B of three: the restore. Planned from a listing, never under the watch.

[[rows]]
id = "R1_missing_directory_refuses"
description = "share_is_held: stop reading rclone's missing directory exit as no mirror, so every backup older than this fix refuses its restore"
file = "src/cratekit/modules/tools/backup.py"
surface = "user"
old = '''    if result.returncode == RCLONE_DIRECTORY_NOT_FOUND:
        return False'''
new = '''    if False:
        return False'''

[[rows]]
id = "R2_missing_directory_exit_moved"
description = "RCLONE_DIRECTORY_NOT_FOUND: move the exit to 4, rclone's file not found, a nearby value, so a missing mirror refuses"
file = "src/cratekit/modules/tools/backup.py"
surface = "user"
old = '''RCLONE_DIRECTORY_NOT_FOUND = 3'''
new = '''RCLONE_DIRECTORY_NOT_FOUND = 4'''

[[rows]]
id = "R3_unanswered_listing_read_as_absent"
description = "share_is_held: never refuse a listing that failed, so a remote that did not answer plans a restore that reports the share absent"
file = "src/cratekit/modules/tools/backup.py"
surface = "user"
old = '''    if result.returncode != 0:
        raise BackupRefused(
            Refusal.NO_SNAPSHOT_AVAILABLE,
            f"the analysis share mirror under'''
new = '''    if False:
        raise BackupRefused(
            Refusal.NO_SNAPSHOT_AVAILABLE,
            f"the analysis share mirror under'''

[[rows]]
id = "R4_empty_listing_read_as_held"
description = "share_is_held: read a listing that names nothing as a mirror, so a copy from an empty folder is planned and reported as pulled"
file = "src/cratekit/modules/tools/backup.py"
surface = "user"
old = '''    return bool(result.stdout.strip())'''
new = '''    return True'''

