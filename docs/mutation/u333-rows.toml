[[rows]]
id = "H2_raising_returns"
description = "test_deletion _raising: the stand in returns None instead of refusing, so every seam it replaces answers quietly"
file = "tests/test_deletion.py"
surface = "maintainer"
tests = ["tests/test_deletion.py"]
