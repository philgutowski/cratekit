[[rows]]
id = "N1_any_404_not_nearest"
description = "nearest_status: return the first 404 on any link rather than the first status, so a server error met while handling a not found is read as the not found and kept"
file = "src/cratekit/core/cause.py"
surface = "user"
tests = ["tests/test_provider_not_found_bodies.py", "tests/test_isrc_cache.py", "tests/test_label_tidal_catalogue.py", "tests/test_adapter_contract.py", "tests/test_outbound_tidal_account.py"]
old = '''        status = answered_status(link)
        if status is not None:
            return status
    return None'''
new = '''        status = answered_status(link)
        if status == NOT_FOUND_STATUS:
            return status
    return None'''

