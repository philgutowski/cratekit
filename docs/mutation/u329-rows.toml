name = "u329"
pass_kind = "light"

# The card's own table over what U329 wrote: one call time accessor per split
# module family that every part binds, config.Remedy as the canonical
# vocabulary, watched_roots in one home, the soft delete guard reading the
# accessor's new home, and the identical body check. Each row puts back the
# shape the change replaced or a realistic slip in it. The guards the change
# moved unchanged are held by the kill set replay under u329-replay/.
#
# W1 and W2 leave tests/test_repair_rows.py out of their subsets: its inode
# bound test fails alone on this container's disk 4 of 4 on the base, every
# temporary directory here giving inodes under its bound, so the subset
# baseline is red (the solutions entry on the inode bound test). The rotate
# suite holds both rows.

