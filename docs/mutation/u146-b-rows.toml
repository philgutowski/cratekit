# U146 author's mutation table, batch b of four: the landing's owned hearts
# found and planned, and what files a heart as dated.
name = "u146-b"
pass_kind = "light"

[[rows]]
id = "B13_first_of_two_rows"
description = "owned_in_library: a file two active rows claim answers with the first, so a duplicate import joins All Favorites by a guess"
file = "src/cratekit/favorites/backfill.py"
surface = "user"
tests = ["tests/test_intake_land_owned_hearts_native.py"]
old = '''    by_path = native.single_rows_for(db, cfg, paths)'''
new = '''    by_path = native.content_ids_for(db, cfg, paths)'''

[[rows]]
id = "B14_plan_owned_keeps_held_hearts"
description = "plan_owned: an owned heart All Favorites holds is planned too, so an empty landing gives it a month"
file = "src/cratekit/favorites/backfill.py"
surface = "user"
tests = ["tests/test_intake_land_owned_hearts_native.py"]
old = '''        one for one in owned_in_library(cfg, db, rows) if one.content_id not in in_source'''
new = '''        one for one in owned_in_library(cfg, db, rows)'''

[[rows]]
id = "B15_any_playlist_files"
description = "filed: any playlist beside the source files a heart, so one at the root beside another playlist never takes its month"
file = "src/cratekit/favorites/placement.py"
surface = "user"
tests = ["tests/test_favorites_backfill.py"]
old = '''        if row != home.source_id and placeholders.is_filing(name):'''
new = '''        if row != home.source_id:'''

[[rows]]
id = "B16_undated_is_no_filing"
description = "is_filing: Undated is not a filing playlist, so a heart the split filed there is given a second month"
file = "src/cratekit/favorites/placeholders.py"
surface = "user"
tests = ["tests/test_favorites_backfill.py"]
old = '''        text == UNDATED
        or MONTH_LABEL'''
new = '''        False
        or MONTH_LABEL'''

[[rows]]
id = "B17_month_label_wrong"
description = "MONTH_LABEL: a month playlist does not read as a month, so every placed heart is planned again with nothing to add"
file = "src/cratekit/favorites/placeholders.py"
surface = "user"
tests = ["tests/test_favorites_backfill.py"]
old = '''MONTH_LABEL = re.compile(r"\\d{4}-(?:0[1-9]|1[0-2])")'''
new = '''MONTH_LABEL = re.compile(r"\\d{4}-(?:0[1-9]|1[0-2])-")'''

[[rows]]
id = "A1_superseded_ignored"
