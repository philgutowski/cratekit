new = '''    if not _whole(missed) or missed < 0:'''

[[rows]]
id = "E8_warning_total"
description = "export.concluded: total only written and unmatched, so the warning names a smaller export than the one run"
file = "src/cratekit/export/cli.py"
surface = "user"
tests = ["tests/test_outbound_workers.py"]
old = '''    total = sum(n for n in counts.values() if _whole(n))'''
new = '''    total = sum(n for k, n in counts.items() if _whole(n) and k != "already")'''

[[rows]]
