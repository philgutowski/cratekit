name = "u52-item-derivation"
pass_kind = "full"

# U52's mutation table. The plan's Verification Contract names the item
# derivation, the zero item refusals at both ends, the acquires branch, the
# LookupFailure translations, the shortfall to cause mapping, the frozen
# configuration path and the four harvest branches. Those are where this unit's
# own decisions live: what a label job's items ARE, what an empty answer MEANS,
# and which of three provider failures a person is told about.
#
# WHAT IS DELIBERATELY NOT MUTATED, and why. `acquire/listing.py`,
# `core/jobs.py`, `core/review.py` and `label/harvest.py` are engines this unit
# is a caller of rather than an author of. A table over lines it did not write
# measures those modules' suites rather than this binding, which is the rule
# U51's row spec header states and this one follows. The one exception is
# `sync/run.py`'s `increment`, whose `acquires` branch this unit added and whose
# guard therefore belongs here.
#
# Forty rows against a cap of forty five. The five held back are for composites
# a user facing zero row owes.

# ---------------------------------------------------------------------------
# 1. Item derivation. One item per registered label, keyed on label_id.
# ---------------------------------------------------------------------------

