# U121 author's mutation table: the set's permanent playlist under INSPIRATION.
# Scoped to the unit's own diff. Twenty five rows, the cap. Rows considered and
# dropped below the cap, each ranked below because a neighbour measures the
# same surface or the mutation dies on a traceback rather than on a rule:
#   the --set-date regex refusal (a traceback follows the dropped refusal);
#   the [inspiration] undeclared refusal (the same, node.display on None);
#   the suppressed row's own left word (no test queues a suppressed row);
#   page_of's string check (the page tests pin it, same family as S23);
#   the [inspiration] must be a table problem (S24 pins the declared node).
name = "u121"
pass_kind = "light"

