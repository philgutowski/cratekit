name = "u258"
pass_kind = "light"

# U258 adds no source. What it adds is a parse memo shared inside one test
# (tests/_parse_memo.py), a tree form of one guard question in
# tests/_source_guards.py, and the two reserved cause population tests reading
# the package once and sharing their parses. A test only change to static guards, so the table is sized as a
# static registry's, eleven rows: each promise of the memo broken alone
# (one parse per text, never stale, nothing held outside a scope, nested scopes,
# never written), the decorator, the tree form, and each restructured sweep
# narrowed or pointed back at a second reading. Rows on the memo run its tests;
# a row on a sweep runs its own file and the memo's tests. A zero is promoted to
# the full suite by the driver.

[[rows]]
id = "M1_key_on_length"
description = "parsed: key the memo on the text's length, not the text, so an equal length edit is served the old tree"
file = "tests/_parse_memo.py"
surface = "maintainer"
tests = ["tests/test_parse_memo.py"]
old = '''    tree = _TREES.get(source)
    if tree is None:
        tree = ast.parse(source)
        _TREES[source] = tree'''
new = '''    tree = _TREES.get(len(source))
    if tree is None:
        tree = ast.parse(source)
        _TREES[len(source)] = tree'''

[[rows]]
id = "M2_scope_shares_nothing"
description = "parsed: parse on every call inside a scope too, so a test's sweeps parse each file again"
file = "tests/_parse_memo.py"
surface = "maintainer"
tests = ["tests/test_parse_memo.py"]
old = '''    tree = _TREES.get(source)
    if tree is None:'''
new = '''    tree = _TREES.get(source)
    if True:'''

[[rows]]
id = "M3_scope_never_ends"
description = "sharing_parses: leave the trees in place when the scope ends, so a test's trees outlive it"
file = "tests/_parse_memo.py"
surface = "maintainer"
tests = ["tests/test_parse_memo.py"]
old = '''    try:
        yield
    finally:
        _TREES = None'''
new = '''    try:
        yield
    finally:
        pass'''

[[rows]]
id = "M4_inner_scope_ends_the_outer"
description = "sharing_parses: open a fresh memo for a scope inside a scope, so the inner one drops the outer one's trees"
file = "tests/_parse_memo.py"
surface = "maintainer"
tests = ["tests/test_parse_memo.py"]
old = '''    if _TREES is not None:
        yield
        return
    _TREES = {}'''
new = '''    _TREES = {}'''

[[rows]]
id = "M5_decorator_opens_no_scope"
description = "shares_parses: call the test without opening a scope, so a decorated test shares nothing"
file = "tests/_parse_memo.py"
surface = "maintainer"
tests = ["tests/test_parse_memo.py"]
old = '''        with sharing_parses():
            return test(*args, **kwargs)'''
new = '''        return test(*args, **kwargs)'''

[[rows]]
