[[rows]]
id = "M10_check_after_reconcile"
description = "the list check runs after the sweep and the reconcile, so a refused command has already changed the queue"
file = "src/cratekit/acquire/cli.py"
surface = "user"
tests = ["tests/test_acquire_workers.py", "tests/test_acquire_cli.py"]
old = '''        if ctx.args.job:
            # CHECKED BEFORE THE SWEEP AND THE RECONCILE, so a refused command
            # leaves the queue exactly as it found it.
            _same_list_or_refuse(
                ctx.args.list, jobs.get(store, ctx.args.job), ctx.entry.handler_key
            )
        sweep_staging(Path(cfg.paths.download_staging), store)
        if ctx.args.job:
            # RECONCILE FIRST. A resume arrives after something stopped, and a
            # claim left behind by a driver that died is state the queue cannot
            # see for itself.
            job = jobs.reconcile(store, ctx.args.job)
'''
new = '''        sweep_staging(Path(cfg.paths.download_staging), store)
        if ctx.args.job:
            job = jobs.reconcile(store, ctx.args.job)
            _same_list_or_refuse(
                ctx.args.list, jobs.get(store, ctx.args.job), ctx.entry.handler_key
            )
'''

