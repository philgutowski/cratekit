[[rows]]
id = "M5_missing_list_guard_after_load"
description = "the missing list refusal runs after the configuration is read, so a command naming nothing has side effects first"
file = "src/cratekit/acquire/cli.py"
surface = "user"
tests = ["tests/test_acquire_workers.py", "tests/test_acquire_cli.py"]
old = '''    if ctx.args.list is None and ctx.args.job is None:
        raise _unusable(
            "no list was named and no job was given, so there is nothing to acquire",
            "name the list of tracks to acquire",
            "or continue an acquisition already queued with --job JOB_ID",
        )
    cfg = _load()
'''
new = '''    cfg = _load()
    if ctx.args.list is None and ctx.args.job is None:
        raise _unusable(
            "no list was named and no job was given, so there is nothing to acquire",
            "name the list of tracks to acquire",
            "or continue an acquisition already queued with --job JOB_ID",
        )
'''

