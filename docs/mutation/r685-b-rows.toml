name = "r685-b"
pass_kind = "light"

# R-685: the one loader for a library's active taxonomy, the verbs that read
# through it, and the guard that keeps them there. Scoped to the branch's own
# guards. Author's table, no independent verifier (METHOD, 2026-09-07).

[[rows]]
id = "C1_converge_opens_before_it_reads"
description = "Converge opens the database before reading the declaration, the order the review found"
file = "src/cratekit/cli/converge.py"
surface = "user"
tests = ["tests/test_rebuild.py"]
old = '''
            declared = active_taxonomy.load(cfg)
            handle = rb_writer.open_db(cfg=cfg)
'''
new = '''
            handle = rb_writer.open_db(cfg=cfg)
            declared = active_taxonomy.load(cfg)
'''

[[rows]]
id = "C2_converge_lets_the_refusal_escape"
description = "The declaration is read outside the try, so a refusal escapes instead of reading NOT COMPARED"
file = "src/cratekit/cli/converge.py"
surface = "user"
tests = ["tests/test_rebuild.py"]
old = '''
        handle = declared = None
        try:
            declared = active_taxonomy.load(cfg)
            handle = rb_writer.open_db(cfg=cfg)
'''
new = '''
        handle = declared = None
        declared = active_taxonomy.load(cfg)
        try:
            handle = rb_writer.open_db(cfg=cfg)
'''

