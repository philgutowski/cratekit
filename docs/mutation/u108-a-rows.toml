name = "u108-a"
pass_kind = "light"

# U108, the guided label sync's go, after its first review round. Twenty five
# rows over the guards the unit and that round added, the cap for a unit that
# writes files. Ranked below the cap and dropped: resumable's "not left" clause
# (a closed job with nothing left to run is SUCCEEDED in every path the engine
# writes), go._gate's refusal (a registry edit, maintainer facing), and the
# held_by_goes SKIPPED exclusion (no worker of acquire download skips an item).

[[rows]]
id = "G01_unsettled_skips_settled"
description = "sync_cli.unsettled: read every saved answer as unsettled, so a go summarises answers an earlier go already took"
file = "src/cratekit/label/sync_cli.py"
surface = "user"
old = '''        if isinstance(entry, Mapping) and not entry.get(SETTLED)
    ]'''
new = '''        if isinstance(entry, Mapping)
    ]'''

