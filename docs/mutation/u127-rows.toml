name = "u127"
pass_kind = "light"

# U127, every native landing writes the vox My Tag from the file's score.
# The new guards in native.py (the plan, the digest, the write, the record,
# the read back), the shared screen line and warnings in land_cli.py, the
# second route in file_cli.py, and the writer's own question in rb_writer.py.
# The landing writes into the live library, so every row is user facing.

[[rows]]
id = "N1_cut_strict"
description = "Compare the score strictly above the cut, so a file exactly at the cut is not tagged"
file = "src/cratekit/intake/native.py"
surface = "user"
old = '''        values = metadata_cli.vocal_tag_values(level, None, cut)
        scored.append(replace(row, voxlevel=level, vox=metadata_cli.VALUE_VOX in values))'''
new = '''        values = metadata_cli.vocal_tag_values(level, None, cut + 0.5)
        scored.append(replace(row, voxlevel=level, vox=metadata_cli.VALUE_VOX in values))'''

[[rows]]
id = "N2_every_add_tagged"
description = "Tag every added row whatever its score, the guess the brief forbids"
file = "src/cratekit/intake/native.py"
surface = "user"
old = '''        scored.append(replace(row, voxlevel=level, vox=metadata_cli.VALUE_VOX in values))'''
new = '''        scored.append(replace(row, voxlevel=level, vox=True))'''

