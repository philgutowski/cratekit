name = "u196"
pass_kind = "light"

[[rows]]
id = "C1_no_run_is_green"
description = "verdict: read no pull request run yet as green, so a session merges before CI has started"
file = "scripts/wait_ci.py"
surface = "maintainer"
tests = ["tests/test_wait_ci.py"]
old = '''    if not runs:
        return PENDING, "no pull request run on this head yet"'''
new = '''    if not runs:
        return PASSED, "no pull request run on this head yet"'''

[[rows]]
id = "C2_unfinished_ignored"
description = "verdict: drop the unfinished check, so a run still going reads as its null conclusion"
file = "scripts/wait_ci.py"
surface = "maintainer"
tests = ["tests/test_wait_ci.py"]
old = '''    if unfinished:
        names'''
new = '''    if False:
        names'''

[[rows]]
id = "C3_neutral_red"
description = "GREEN: drop neutral, so a neutral run makes a green head red"
file = "scripts/wait_ci.py"
surface = "maintainer"
tests = ["tests/test_wait_ci.py"]
old = '''GREEN = ("success", "neutral", "skipped")'''
new = '''GREEN = ("success", "skipped")'''

[[rows]]
id = "C4_deadline_overrun"
description = "wait: sleep past the deadline before giving up"
file = "scripts/wait_ci.py"
surface = "maintainer"
tests = ["tests/test_wait_ci.py"]
old = '''        if clock() + every > deadline:'''
new = '''        if clock() > deadline:'''

[[rows]]
id = "C5_unread_exits_pending"
description = "main: drop the unread exit, so a wait that could not read the runs exits 2 as if it timed out"
file = "scripts/wait_ci.py"
surface = "maintainer"
tests = ["tests/test_wait_ci.py"]
old = '''    return {PASSED: 0, FAILED: 1, UNREAD: 3}.get(state, 2)'''
new = '''    return {PASSED: 0, FAILED: 1}.get(state, 2)'''

