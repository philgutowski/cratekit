# R-44 and R-51, batch a: the session level assertion and the config shape.
# Author run. Every zero below reads as "the author could not kill it".

[[rows]]
id = "S1_empty_slot"
description = "Never refuse an empty mount slot, so an identity read through an ejected drive's leftover directory is compared and can match"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''        source = preflight.identity_source(probe)
        if source is None:'''
new = '''        source = preflight.identity_source(probe)
        if False:'''

[[rows]]
id = "S2_proved_widened"
description = "Let NOT_MOUNTED count as a proved identity, which is the pass set widening by one verdict"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''    {preflight.MountState.OK, preflight.MountState.LIBRARY_PATH_MISSING}
)'''
new = '''    {
        preflight.MountState.OK,
        preflight.MountState.LIBRARY_PATH_MISSING,
        preflight.MountState.NOT_MOUNTED,
    }
)'''

[[rows]]
id = "S3_default_to_library"
description = "Hold a rule outside the library root with nothing recorded to the LIBRARY'S identity instead of refusing it"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''    if inside.resolution is locations.Resolution.UNDER_ROOT:
        return cfg.library.volume_id
    return None'''
new = '''    if inside.resolution is locations.Resolution.UNDER_ROOT:
        return cfg.library.volume_id
    return cfg.library.volume_id'''

[[rows]]
id = "S4_inside_root_unheld"
description = "Hold a rule inside the library root to nothing of the library's, so a nested foreign volume is judged as unrecorded rather than foreign"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''    if inside.resolution is locations.Resolution.UNDER_ROOT:
        return cfg.library.volume_id
    return None'''
new = '''    return None'''

[[rows]]
id = "S5_not_destructive"
description = "Assert a rule target at read strength, where an unreadable or unrecorded identity is tolerated"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''                expected_rule_identity(cfg, rule),
                destructive=True,'''
new = '''                expected_rule_identity(cfg, rule),
                destructive=False,'''

[[rows]]
id = "S6_oserror_escapes"
description = "Let an OSError from the walk or the identity read escape the gate instead of becoming a refusal"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''    except OSError as exc:
        # "I COULD NOT LOOK" IS ITS OWN ANSWER.'''
new = '''    except KeyboardInterrupt as exc:
        # "I COULD NOT LOOK" IS ITS OWN ANSWER.'''

[[rows]]
id = "S7_probe_the_target"
description = "Probe the rule's target for a file instead of the file's own directory, so a volume nested under the target is never seen"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''        rules[index],
        Path(path).parent,'''
new = '''        rules[index],
        Path(rules[index].target or "/"),'''

[[rows]]
id = "S8_wording_held_to"
description = "Say the volume was recorded on the rule when the identity compared was the library's"
file = "src/cratekit/core/session.py"
surface = "user"
tests = ["tests/test_write_session.py", "tests/test_deletion.py"]
old = '''    return "the library's volume, which a target inside the library root is held to"'''
new = '''    return "the volume recorded on that rule"'''

