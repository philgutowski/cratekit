'''

[[rows]]
id = "M7_load_keyed_on_path_size_time"
description = "active_taxonomy.load: remember the answer by the copy's path, size and modification time, the identity METHOD's second pattern warns of"
file = "src/cratekit/core/active_taxonomy.py"
surface = "user"
tests = ["tests/test_taxonomy.py", "tests/test_active_taxonomy.py", "tests/test_adopt_workers.py", "tests/test_tag_workers.py"]
old = '''    path, text = read_text(cfg)
    if text is None:
        return _shipped(cfg.taxonomy.template)
    try:
        return taxonomy.load_taxonomy(text)'''
new = '''    memo = load.__dict__.setdefault("by_file", {})
    where = config.state_path("taxonomy_active", cfg)
    try:
        held = where.stat()
        key = (str(where), held.st_size, held.st_mtime_ns)
    except OSError:
        key = None
    if key is not None and key in memo:
        return memo[key]
    path, text = read_text(cfg)
    if text is None:
        return _shipped(cfg.taxonomy.template)
    try:
        if key is not None:
            memo[key] = taxonomy.load_taxonomy(text)
        return taxonomy.load_taxonomy(text)'''

