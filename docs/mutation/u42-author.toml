name = "u42-author"
pass_kind = "light"

# U42, author's own table. METHOD is explicit that this is a DRAFT rather than a
# result: every fix agent on this project has run its table honestly and still
# missed guards its own round created, because it mutates what it believes it
# changed. Scoped to this round's diff, which is one new module, one registry
# edit, and one rewritten conformance guard.

# ── the walk, and the finding this unit was held on ──────────────────────────

