    warning = _write_catalog('''

[[rows]]
id = "W2_commit_on_success"
description = "insert_catalog_folder: copy the working bytes back even on a refusal"
file = "src/cratekit/write/rbxml.py"
surface = "user"
tests = ["tests/test_rbxml.py", "tests/test_xml_splice_golden.py", "tests/test_tree_writer.py", "tests/test_tree_registry.py"]
