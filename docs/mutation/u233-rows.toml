name = "u233"
pass_kind = "light"

# U233 adds one guard, tests/test_docs_current.py, which reads the guide and the
# README against the parser and the config schema. A guard over docs is broken
# two ways: the code moves and the doc does not, or the doc moves and the code
# does not. Rows C1 and C2 move the code; rows D1 to D7 move the doc.

[[rows]]
id = "C1_schema_default_moves"
description = "config: labels.offer_per_sweep's default goes from 10 to 12, so the guide's settings table states an old default"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_docs_current.py"]
old = '''DEFAULT_LABEL_OFFER = 10'''
new = '''DEFAULT_LABEL_OFFER = 12'''

[[rows]]
id = "C2_schema_gains_a_key"
description = "config: LabelsConfig gains a key a person can set, which the guide's settings table has no row for"
file = "src/cratekit/core/config.py"
surface = "user"
tests = ["tests/test_docs_current.py"]
old = '''    new_playlist_age_days: int = DEFAULT_NEW_PLAYLIST_AGE_DAYS
'''
new = '''    new_playlist_age_days: int = DEFAULT_NEW_PLAYLIST_AGE_DAYS
    sweep_note_days: int = 3
'''

[[rows]]
