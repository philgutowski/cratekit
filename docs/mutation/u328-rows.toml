name = "u328"
pass_kind = "light"

# Rows on the guards U328 added: the two script readers following the table's parts, and the
# assembly of the parts in cli/registry.py. The rows the table already held are the replay's.

[[rows]]
id = "R1_starred_name_not_followed"
description = "verbs_from: never follow a starred name into its part, so the split table's parts are not read"
file = "scripts/refactor_measure.py"
surface = "maintainer"
tests = ["tests/test_duplication.py", "tests/test_import_rules.py", "tests/test_refactor_measure.py"]
old = '''            starred = isinstance(member, ast.Starred) and isinstance(member.value, ast.Name)'''
new = '''            starred = False'''

[[rows]]
id = "R2_missing_part_read_as_empty"
description = "verbs_from: a starred name no source holds yields nothing instead of raising, so a part the loader missed reads as no verbs"
file = "scripts/refactor_measure.py"
surface = "maintainer"
tests = ["tests/test_duplication.py", "tests/test_import_rules.py", "tests/test_refactor_measure.py"]
old = '''            raise ValueError(f"the registry holds no {name} tuple")'''
new = '''            return'''

[[rows]]
id = "R3_starred_attribute_crashes"
description = "verbs_from: follow any starred member, so a starred attribute crashes on its missing id instead of being refused as unreadable"
file = "scripts/refactor_measure.py"
surface = "maintainer"
tests = ["tests/test_duplication.py", "tests/test_import_rules.py", "tests/test_refactor_measure.py"]
old = '''            starred = isinstance(member, ast.Starred) and isinstance(member.value, ast.Name)'''
new = '''            starred = isinstance(member, ast.Starred)'''

[[rows]]
id = "R4_loader_reads_the_registry_alone"
description = "_load: hand verbs_from the registry's own file and none of its parts"
file = "scripts/refactor_measure.py"
surface = "maintainer"
tests = ["tests/test_duplication.py", "tests/test_import_rules.py", "tests/test_refactor_measure.py"]
old = '''    verbs = verbs_from(*(text for path, text in sources.items() if path.startswith(table)))'''
new = '''    verbs = verbs_from(*(text for path, text in sources.items() if path == REGISTRY))'''

