name = "r343"
pass_kind = "light"

# R-343: the driver's children start in a sandboxed installation state, and a
# fingerprint of the real one is checked after every child. Every row reverts
# one guard alone. The subset is the driver's own test file, which loads
# scripts/mutate.py by path in a fresh interpreter, so the mutation reaches the
# copy under test and never the driver doing the measuring.

[[rows]]
id = "S1_no_home_redirect"
description = "the child keeps the caller's HOME, so platformdirs resolves the real config directory"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''    "HOME": "home",'''
new = '''    "HOME_UNSET": "home",'''

[[rows]]
id = "S2_no_config_dir_override"
description = "the child keeps the caller's CRATEKIT_CONFIG_DIR"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''    "CRATEKIT_CONFIG_DIR": f"config/{APP_NAME}",'''
new = '''    "CRATEKIT_CONFIG_DIR_UNSET": f"config/{APP_NAME}",'''

[[rows]]
id = "S3_no_state_dir_override"
description = "the child keeps the caller's CRATEKIT_STATE_DIR"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''    "CRATEKIT_STATE_DIR": f"state/{APP_NAME}",'''
new = '''    "CRATEKIT_STATE_DIR_UNSET": f"state/{APP_NAME}",'''

[[rows]]
id = "S4_no_xdg_config_redirect"
description = "the child keeps the caller's XDG_CONFIG_HOME; platformdirs ignores XDG on macOS, so this row measures the Linux half of the redirect from a Mac"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''    "XDG_CONFIG_HOME": "config",'''
new = '''    "XDG_CONFIG_HOME_UNSET": "config",'''

[[rows]]
id = "S5_sandbox_directories_not_created"
description = "the variables point into the sandbox but nothing creates the directories"
file = "scripts/mutate.py"
surface = "maintainer"
tests = ["tests/test_mutation_driver.py"]
old = '''            path.mkdir(parents=True, exist_ok=True)
            env[name] = str(path)'''
new = '''            env[name] = str(path)'''

[[rows]]
id = "G1_guard_never_fires"
description = "check_state_guard treats every digest as unchanged"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''        if now == before:
            continue'''
new = '''        if True:
            continue'''

[[rows]]
id = "G2_fingerprint_ignores_mtime"
description = "an in place rewrite that keeps the size is invisible, which is the shape of the 2026-09-20 overwrite"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''                f"\t{info.st_mtime_ns}\t{info.st_ctime_ns}"'''
new = '''                f"\t{info.st_ctime_ns}"'''

[[rows]]
id = "G3_fingerprint_ignores_size"
description = "only path and mtime are fingerprinted"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''                f"{relative}\t{info.st_size}\t{info.st_ino}"'''
new = '''                f"{relative}\t{info.st_ino}"'''

[[rows]]
id = "G4_existence_not_fingerprinted"
description = "a child that creates the real directory is not a change"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''    entries: list[str] = [f"exists={root.is_dir()}"]'''
new = '''    entries: list[str] = ["exists=True"]'''

[[rows]]
id = "G5_row_loop_swallows_the_leak"
description = "the row loop's StateLeak handler stops re-raising, so the blanket handler files it as an error row and the batch continues"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''            # spending children against a machine it had just damaged.
            raise'''
new = '''            # spending children against a machine it had just damaged.
            pass'''

[[rows]]
id = "G6_run_pytest_skips_the_check"
description = "run_pytest never calls check_state_guard"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''            if guard is not None:
                check_state_guard(guard, label=label)'''
new = '''            if False:
                check_state_guard(guard, label=label)'''

[[rows]]
id = "G7_label_not_carried"
description = "every leak is reported as a generic child run rather than the row or phase that caused it"
file = "scripts/mutate.py"
surface = "user"
tests = ["tests/test_mutation_driver.py"]
old = '''            check_state_guard(guard, label=label)'''
new = '''            check_state_guard(guard, label="a child run")'''

[[rows]]
id = "R1_config_override_ignored"
