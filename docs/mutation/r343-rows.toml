old = '''        for name in dirnames:
            entries.append(f"{(here / name).relative_to(root).as_posix()}\tdir")'''
new = '''        for name in ():
            entries.append(f"{(here / name).relative_to(root).as_posix()}\tdir")'''

[[rows]]
