tests = ["tests/test_mutation_driver.py"]
old = '''        if config_override
        else Path(platformdirs.user_config_dir(APP_NAME)),'''
new = '''        if False
        else Path(platformdirs.user_config_dir(APP_NAME)),'''

[[rows]]
