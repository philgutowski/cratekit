name = "r221-a"
pass_kind = "light"

# Scoped to this round's own diff: the flag the engine now records, the word the
# shell now carries on all four of the verb's endings, and the two exits the
# code review added. The unit changes no write surface, it changes what a person
# is TOLD about a run, so "user" here means a surface a person reads.

# -- The engine, where the two runs first became indistinguishable ------------

[[rows]]
id = "E1_outcome_forgets_the_run"
description = "The outcome records False whatever the run was, which is the state before this unit: a rehearsal and a real run render identically"
file = "src/cratekit/modules/tools/backup.py"
surface = "user"
old = '''    return BackupOutcome(stamp=plan.stamp, portions=tuple(outcomes), dry_run=dry_run)'''
new = '''    return BackupOutcome(stamp=plan.stamp, portions=tuple(outcomes), dry_run=False)'''

[[rows]]
id = "E2_outcome_payload_drops_the_key"
description = "The renderer stops carrying the flag, so every reader of a rendered run is back to guessing"
file = "src/cratekit/modules/tools/backup.py"
surface = "user"
old = '''        "dry_run": outcome.dry_run,
        "portions": ['''
new = '''        "portions": ['''

[[rows]]
id = "E3_outcome_reads_publish_instead"
description = "Record `not publish` rather than the flag the body branched on. PREDICTED EQUIVALENT today: no caller in src passes publish=False, so the two agree on every reachable path, and the row is here to measure that prediction rather than to be killed"
file = "src/cratekit/modules/tools/backup.py"
surface = "maintainer"
old = '''portions=tuple(outcomes), dry_run=dry_run)'''
new = '''portions=tuple(outcomes), dry_run=not publish)'''

# -- The machine readable half, on the declared surface ----------------------

