file = "src/cratekit/backup/cli.py"
surface = "user"
old = '''    progress = dict(jobs.progress(store, job.job_id))
    progress[DRY_RUN] = _is_rehearsal(job)
    return {'''
new = '''    progress = dict(jobs.progress(store, job.job_id))
    return {'''

[[rows]]
id = "S2_reported_key_at_the_top_level"
description = "Put the detail beside the four declared fields instead of under progress, which is the undeclared field the conformance guard refused"
file = "src/cratekit/backup/cli.py"
surface = "user"
old = '''    progress = dict(jobs.progress(store, job.job_id))
    progress[DRY_RUN] = _is_rehearsal(job)
    return {
        "job_id": job.job_id,'''
new = '''    progress = dict(jobs.progress(store, job.job_id))
    return {
        DRY_RUN: _is_rehearsal(job),
        "job_id": job.job_id,'''

[[rows]]
id = "S3_flag_reads_a_key_nothing_freezes"
description = "Read the rehearsal flag under a name the build does not freeze, so every job reads as a real backup"
file = "src/cratekit/backup/cli.py"
surface = "user"
old = '''    return bool((job.payload or {}).get(DRY_RUN))'''
new = '''    return bool((job.payload or {}).get("rehearsal"))'''

