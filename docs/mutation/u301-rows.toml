name = "u301"
pass_kind = "light"

# The card's own table over the helpers U301 added or rewrote while shrinking
# the rest of core. The guards each helper took over from its copies are held
# by the kill set replay, u301-replay-after, and these rows are the new code.

[[rows]]
id = "P1_initargs_refused_without_an_initializer"
description = "_refuse_unsendable: check the initializer's arguments only when there is an initializer, so map_workers and WorkStream pass a lambda argument on an in process plan"
file = "src/cratekit/core/pool.py"
surface = "user"
tests = ["tests/test_pool_sizing.py", "tests/test_pool_stream.py"]
old = '''    for position, argument in enumerate(initargs):
        _refuse_what_no_child_could_receive(argument, f"initializer argument {position}")
'''
new = '''    for position, argument in enumerate(initargs if initializer is not None else ()):
        _refuse_what_no_child_could_receive(argument, f"initializer argument {position}")
'''

