name = "r375-c"
pass_kind = "light"

# R-375 and R-12, batch C of three: the commit witness, and T6 measured again
# after the test the first measurement asked for. A 11 rows, B 12, C 2 new ones
# makes the cap of 25. T6 here is a second reading of a row already counted.

[[rows]]
id = "W1_listener_left_on_the_handle"
description = "commit_witness: never remove the listener, so a handle that outlives the write keeps marking a witness nobody reads"
file = "src/cratekit/core/rb_writer.py"
surface = "maintainer"
tests = ["tests/test_tree_writer.py", "tests/test_metadata_cli.py"]
old = '''        event.remove(target, "after_commit", witness._mark)'''
new = '''        pass'''

[[rows]]
id = "W2_witness_listens_one_event_early"
description = "commit_witness: listen for before_commit, so a transaction refused on its way in is witnessed as landed"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_tree_writer.py", "tests/test_metadata_cli.py"]
old = '''    event.listen(target, "after_commit", witness._mark)
    try:
        yield witness
    finally:
        event.remove(target, "after_commit", witness._mark)'''
new = '''    event.listen(target, "before_commit", witness._mark)
    try:
        yield witness
    finally:
        event.remove(target, "before_commit", witness._mark)'''

[[rows]]
id = "T6_every_raise_read_as_a_commit_again"
description = "write_tree_membership: record a commit on every raise. Batch B read this as ZERO; measured again after test_a_write_that_fails_after_counting_a_membership_still_claims_no_commit"
file = "src/cratekit/write/trees.py"
surface = "user"
tests = ["tests/test_tree_writer.py", "tests/test_rebuild.py", "tests/test_adopt_apply_cli.py"]
old = '''            if witness.landed:
                _record_membership_commit(record, tree_id, added, cfg)'''
new = '''            if True:
                _record_membership_commit(record, tree_id, added, cfg)'''

