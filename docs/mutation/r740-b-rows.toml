description = "existing guard sample: the intake row's AverageBpm literal becomes a tempo"
file = "src/cratekit/intake/collection_xml.py"
surface = "user"
tests = ["tests/test_landing_head.py", "tests/test_landing.py", "tests/intake/test_pipeline.py", "tests/intake/test_collection_xml.py", "tests/test_no_beatgrid_ever.py"]
old = '''Year="0" AverageBpm="0.00"'''
