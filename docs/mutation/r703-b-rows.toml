[[rows]]
id = "L2_last_exception_wins"
description = "a later exception overwrites the first, so a consequence stands as the cause"
file = "src/cratekit/acquire/vendored.py"
surface = "user"
old = '''        if self._exception is None:
            self._exception = exc'''
new = '''        self._exception = exc'''

[[rows]]
id = "L3_message_outranks_exception"
