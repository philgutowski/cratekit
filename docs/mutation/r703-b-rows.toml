file = "src/cratekit/acquire/vendored.py"
surface = "user"
old = '''        return self._exception if self._exception is not None else self._message'''
new = '''        return self._message if self._message is not None else self._exception'''

[[rows]]
id = "L4_error_notes_nothing"
description = "error() goes back to discarding, so a message only failure has no cause"
file = "src/cratekit/acquire/vendored.py"
surface = "user"
old = '''    def error(self, *args: object, **_kwargs: object) -> None:
        self._failure(args)'''
new = '''    def error(self, *args: object, **_kwargs: object) -> None:
        return None'''

