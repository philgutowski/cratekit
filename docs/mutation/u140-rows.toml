name = "u140"
pass_kind = "light"

# Author table for U140, the set rename that follows the library. Cap 25.
# Measured on macOS by the author's own session, three batches with --resume
# so no foreground call passes the harness ceiling.

[[rows]]
id = "A1_twin_never_named"
description = "plan_rename never names a twin, so a record under the new name beside the old one is adopted silently"
file = "src/cratekit/modules/outbound/sets.py"
surface = "user"
tests = ["tests/test_export_set_rename.py"]
old = '''
    twin = (
        older
        if recorded_to is not None and older is not None and older.remote_id != recorded_to.remote_id
        else None
    )
'''
new = '''
    twin = None
'''

