# U25, vocal restamp and My Tags shells. Author's rows.
#
# The full suite is about six minutes and the driver's preflight is two full
# runs, so this table cannot finish inside a ten minute foreground call. That
# is R-329. Run it attended:
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/u25-rows.toml
#
# Every row names its subset so a death on the new tests is a real death. A
# zero on that subset is not yet a zero and must be promoted.

name = "u25"
pass_kind = "light"

