[[rows]]
id = "G11_gender_without_vox"
description = "Gender tags are applied even when the track is below the cut"
file = "src/cratekit/write/metadata_cli.py"
surface = "user"
tests = ["tests/test_metadata_cli.py"]
old = '''    if voxlevel is None or voxlevel < cut:
        return []
    values = [VALUE_VOX]
    if voxgender == "M":
        values.append(VALUE_MALE)
    elif voxgender == "F":
        values.append(VALUE_FEMALE)
    return values
'''
new = '''    values = []
    if voxlevel is not None and voxlevel >= cut:
        values.append(VALUE_VOX)
    if voxgender == "M":
        values.append(VALUE_MALE)
    elif voxgender == "F":
        values.append(VALUE_FEMALE)
    return values
'''

