name = "r689"
pass_kind = "light"

# R-689: setup records which shipped text the active taxonomy copy was made
# from, and doctor tells a copy that fell behind the shipped template from one
# a person edited. Twelve rows over the three files the unit touched. Every
# row's subset is the doctor suite, which holds the branch tests, and the
# active taxonomy suite, which holds the guard and the shared helpers.

[[rows]]
id = "D1_stale_is_ok"
description = "doctor: report the stale copy as OK instead of INFO, so the one finding this unit exists for is never raised"
file = "src/cratekit/cli/doctor.py"
surface = "user"
tests = ["tests/test_doctor.py", "tests/test_active_taxonomy.py"]
old = '''    return Status.INFO, (
        f"the copy is the one setup made from the shipped {record.template!r}, "'''
new = '''    return Status.OK, (
        f"the copy is the one setup made from the shipped {record.template!r}, "'''

[[rows]]
id = "D2_edited_against_current"
description = "doctor: decide edited by comparing the copy with the shipped text as it ships now instead of with the record, so a stale unedited copy reads as edited"
file = "src/cratekit/cli/doctor.py"
surface = "user"
tests = ["tests/test_doctor.py", "tests/test_active_taxonomy.py"]
old = '''    if active.digest != record.digest:
        return Status.OK, f"edited since setup copied the shipped {record.template!r}"'''
new = '''    if active.digest != current.digest:
        return Status.OK, f"edited since setup copied the shipped {record.template!r}"'''

