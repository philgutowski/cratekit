[[rows]]
id = "S1_no_record_written"
description = "setup: skip the record write and still report the origin as recorded"
file = "src/cratekit/cli/setup.py"
surface = "user"
tests = ["tests/test_doctor.py", "tests/test_active_taxonomy.py"]
old = '''        config.atomic_write_bytes(taxonomy.origin_record_text(name, text).encode("utf-8"), origin)'''
new = '''        origin = origin'''

[[rows]]
id = "S3_wrong_digest_recorded"
description = "setup: record a digest of text other than what was copied, so every fresh copy reads as edited"
file = "src/cratekit/cli/setup.py"
surface = "user"
tests = ["tests/test_doctor.py", "tests/test_active_taxonomy.py"]
old = '''        config.atomic_write_bytes(taxonomy.origin_record_text(name, text).encode("utf-8"), origin)'''
new = '''        config.atomic_write_bytes(taxonomy.origin_record_text(name, text + "\\n").encode("utf-8"), origin)'''

[[rows]]
id = "T1_digest_ignores_text"
description = "taxonomy: digest a constant instead of the text, so every template has one fingerprint and nothing is ever stale"
file = "src/cratekit/core/taxonomy.py"
surface = "user"
tests = ["tests/test_doctor.py", "tests/test_active_taxonomy.py"]
old = '''    return hashlib.sha256(text.encode("utf-8")).hexdigest()'''
new = '''    return hashlib.sha256(b"").hexdigest()'''

