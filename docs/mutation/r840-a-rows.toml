            # THE RUN STOPS'''

[[rows]]
id = "A9_an_answer_resets_the_count"
description = "_walk: never reset the count of failed reads, so three scattered failures stop the run as an outage"
file = "src/cratekit/label/artists_cli.py"
surface = "user"
tests = ["tests/test_label_artists.py"]
old = '''failed_in_a_row = failed_in_a_row + 1 if failed else 0'''
new = '''failed_in_a_row = failed_in_a_row + (1 if failed else 0)'''
