id = "A1_address_is_the_whole_field"
description = "is_address: search for the address shape anywhere in the field, so a name that merely contains one is asked about and overwritten"
file = "src/cratekit/label/artists_cli.py"
surface = "user"
tests = ["tests/test_label_artists.py"]
old = '''ADDRESS.fullmatch(value.strip()) is not None'''
new = '''ADDRESS.search(value.strip()) is not None'''

