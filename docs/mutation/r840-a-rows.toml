[[rows]]
id = "A7_catalogue_opened_on_demand"
description = "_walk: open the catalogue before the walk, so a queue with no address in it logs in and can refuse on the credential"
file = "src/cratekit/label/artists_cli.py"
surface = "user"
tests = ["tests/test_label_artists.py"]
old = '''    found: catalogue.Catalogue | None = None
    failed_in_a_row = 0'''
new = '''    found: catalogue.Catalogue | None = catalogue.resolve(cfg)
    failed_in_a_row = 0'''

