[[rows]]
id = "T8_private_copy_per_call"
description = "_build_disposable_database: hand every caller the first caller's file by a hard link instead of a copy, the shared mutable state the unit must not introduce"
file = "tests/test_rb_writer_db.py"
surface = "maintainer"
tests = ["tests/test_fixture_database_template.py", "tests/test_rb_writer_db.py"]
old = '''    descriptor = os.open(db_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, _SQLITE_FILE_MODE)'''
new = '''    first = _TEMPLATES.setdefault(("first", key), db_path)
    if first != db_path and os.path.exists(first):
        os.link(first, db_path)
        return
    descriptor = os.open(db_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, _SQLITE_FILE_MODE)'''

[[rows]]
id = "T9_copy_mode"
description = "_SQLITE_FILE_MODE: create a copy at 0666 before the umask, a plain create, so under a loose umask a copy is group writable where a build from nothing is not"
file = "tests/test_rb_writer_db.py"
surface = "maintainer"
tests = ["tests/test_fixture_database_template.py", "tests/test_rb_writer_db.py"]
old = '''_SQLITE_FILE_MODE = 0o644'''
new = '''_SQLITE_FILE_MODE = 0o666'''
