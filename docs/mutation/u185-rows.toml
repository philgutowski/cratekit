[[dropped]]
id = "pending_objects_sources"
description = "Drop the buffer move branch or the session dirty loop in pending_objects"
reason = "The buffer move branch and the session dirty loop were measured at zero by the review's own pass and are filed as a residual; a row each would spend the cap restating it."

[[dropped]]
id = "remember_unread"
description = "Keep an empty reading when the read at open fails"
reason = "remember's failing read is pinned directly by test_a_reading_that_failed_at_open_is_kept_as_unread_and_refuses, which asserts the held value; G2 covers the refusal it feeds."
