[[rows]]
id = "A9_pin_ignored"
description = "plan_for_backfill ignores on= and re-resolves from today when posted is absent"
file = "src/cratekit/intake/set_playlist.py"
surface = "user"
tests = ["tests/test_set_inspiration_playlist.py"]
old = '''
    if on is not None and posted is None:
        made = on
        _resolved, fallback = naming_day_for(job, landing=on)
        if _resolved != on:
            fallback = None
    else:
        made, fallback = naming_day_for(job, posted=posted, landing=today())
    folder_id, node = folder_for(db, declared)
    recorded = recorded_playlist(cfg, db, job.job_id, folder_id)
    library = _LibraryView(cfg)
'''
new = '''
    if on is not None and posted is None:
        made, fallback = naming_day_for(job, landing=today())
    else:
        made, fallback = naming_day_for(job, posted=posted, landing=today())
    folder_id, node = folder_for(db, declared)
    recorded = recorded_playlist(cfg, db, job.job_id, folder_id)
    library = _LibraryView(cfg)
'''

