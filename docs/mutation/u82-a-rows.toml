[[rows]]
id = "A1_stat_oserror_is_the_refusal"
description = "require_output: stop turning an OSError out of the one stat into sync-marks-blocked, so a file gone at that moment is a bare FileNotFoundError again, which is R-398"
file = "src/cratekit/sync/marks.py"
surface = "user"
tests = ["tests/test_sync_mark.py", "tests/test_sync_all.py"]
old = '''    except OSError as exc:
        raise _blocked(local_output, exc.strerror or type(exc).__name__) from exc'''
new = '''    except ZeroDivisionError as exc:
        raise _blocked(local_output, exc.strerror or type(exc).__name__) from exc'''

