[[rows]]
id = "M11_ffmpeg_left_channel"
description = "decode.load: mix the ffmpeg path's samples by keeping the left channel"
file = "src/cratekit/analysis/decode.py"
surface = "user"
tests = ["tests/test_analysis_decode.py", "tests/test_analysis_decode_librosa.py"]
old = '''    native = _window(native, native_rate, offset=offset, duration=duration)
    return _mono_at(librosa, native, native_rate, rate), rate'''
new = '''    native = _window(native, native_rate, offset=offset, duration=duration)
    native = native[0] if native.ndim == 2 else native
    return _mono_at(librosa, native, native_rate, rate), rate'''

[[rows]]
id = "M12_resampler"
description = "_mono_at: resample with soxr_mq rather than librosa.load's soxr_hq"
file = "src/cratekit/analysis/decode.py"
surface = "user"
tests = ["tests/test_analysis_decode.py", "tests/test_analysis_decode_librosa.py"]
old = '''    return librosa.resample(mono(native), orig_sr=native_rate, target_sr=rate, res_type="soxr_hq")'''
new = '''    return librosa.resample(mono(native), orig_sr=native_rate, target_sr=rate, res_type="soxr_mq")'''

[[rows]]
id = "M13_float64_halving"
description = "_mean_of_two: add and halve in float64 and round once, so a finite pair whose float32 sum overflows mixes to a finite value"
file = "src/cratekit/analysis/decode.py"
surface = "user"
tests = ["tests/test_analysis_decode.py", "tests/test_analysis_decode_librosa.py"]
old = '''    out = np.add(stereo[0], stereo[1])
    # numpy's reduction starts from plus zero: minus zero plus minus zero is
    # minus zero here and plus zero in the mean, and no other sum changes.
    out += out.dtype.type(0)
    out /= out.dtype.type(2)'''
new = '''    out = ((stereo[0].astype(np.float64) + stereo[1]) / 2).astype(stereo.dtype)
    out += out.dtype.type(0)'''

[[rows]]
id = "M14_ffmpeg_numpy_mean"
description = "decode.load: mix the ffmpeg path's samples with numpy's mean, the arithmetic before librosa 1.0, rather than the shared mix"
file = "src/cratekit/analysis/decode.py"
surface = "user"
tests = ["tests/test_analysis_decode.py", "tests/test_analysis_decode_librosa.py"]
old = '''    native = _window(native, native_rate, offset=offset, duration=duration)
    return _mono_at(librosa, native, native_rate, rate), rate'''
new = '''    native = _window(native, native_rate, offset=offset, duration=duration)
    samples = native.mean(axis=0) if native.ndim == 2 else native
    return librosa.resample(samples, orig_sr=native_rate, target_sr=rate, res_type="soxr_hq"), rate'''
