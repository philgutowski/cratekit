[[rows]]
id = "M2_leading_zero_dropped"
description = "_mean_of_two: drop the plus zero numpy's reduction starts from, so two minus zero channels mix to minus zero"
file = "src/cratekit/analysis/decode.py"
surface = "user"
tests = ["tests/test_analysis_decode.py", "tests/test_analysis_decode_librosa.py"]
old = '''    out = np.add(stereo[0], stereo[1])
    # numpy's reduction starts from plus zero: minus zero plus minus zero is
    # minus zero here and plus zero in the mean, and no other sum changes.
    out += out.dtype.type(0)'''
new = '''    out = np.add(stereo[0], stereo[1])'''

[[rows]]
id = "M3_trailing_zero_dropped"
description = "_mean_of_two: drop librosa 1.0's buffer of zeros, so a half sum that rounds to minus zero stays minus zero on 1.0"
file = "src/cratekit/analysis/decode.py"
surface = "user"
tests = ["tests/test_analysis_decode.py", "tests/test_analysis_decode_librosa.py"]
old = '''    if zero_after:
        # librosa 1.0 adds the mean into zeros: a half sum that rounds to
        # minus zero, minus the smallest subnormal and zero, is plus zero.
        out += out.dtype.type(0)'''
new = '''    if zero_after:
        pass'''

