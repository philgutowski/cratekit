name = "u133-b"
pass_kind = "light"

# Batch b: the shipped template's declarations for Jazz, and one existing
# guard of the move it relies on. The template is data, so each row names its
# subset: the files that read the shipped Jazz declaration.

[[rows]]
id = "T1_keyword_back"
description = "The jazz keyword rule sends a partial match to NonElectronic again, as before U133"
file = "src/cratekit/templates/taxonomy.default.toml"
surface = "user"
tests = ["tests/test_adopt_jazz_folder.py", "tests/test_routing_parity.py", "tests/test_taxonomy_upgrade.py"]
old = '''
keyword = "jazz"
bucket = "jazz"
'''
new = '''
keyword = "jazz"
bucket = "non_electronic"
'''

