name = "u271"
pass_kind = "light"

# The driver's reader: each key the battery's verdict must share with this
# run, removed one at a time, and the green or refuse rule over a read record.

[[rows]]
id = "D1_commit_unchecked"
description = "read_battery_verdict: drop the commit key, so a verdict for another commit is read"
file = "scripts/mutate.py"
surface = "maintainer"
tests = ["tests/test_mutation_driver.py"]
old = '''            bool(commit) and recorded == commit,'''
new = '''            True,'''

[[rows]]
id = "D2_run_cleanliness_unchecked"
description = "read_battery_verdict: drop the key saying the tree was clean throughout the battery's run"
file = "scripts/mutate.py"
surface = "maintainer"
tests = ["tests/test_mutation_driver.py"]
old = '''        (record.get("clean_tree") is True, "the tree was not clean throughout the battery's run"),'''
new = '''        (True, "the tree was not clean throughout the battery's run"),'''

