# The battery's writer: what it records for each key.

[[rows]]
id = "B1_run_cleanliness_at_the_end_only"
description = "measured_tree: read cleanliness after the run only, so a change made before it and a moved HEAD are missed"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py"]
old = '''    clean = before.clean and after.clean and before.commit == after.commit'''
new = '''    clean = after.clean'''

[[rows]]
id = "B2_commit_read_after_the_run"
description = "measured_tree: name the commit read after the run, as last-compare.txt did before U271"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py"]
old = '''    return TreeState(commit=before.commit, clean=clean)'''
new = '''    return TreeState(commit=after.commit, clean=clean)'''

[[rows]]
id = "B3_status_unread"
description = "tree_state in the battery: read only git's exit, so a tree with changes reads clean"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py"]
old = '''    clean = bool(commit) and status.returncode == 0 and not status.stdout.strip()
    return TreeState(commit=commit, clean=clean)'''
new = '''    clean = bool(commit) and status.returncode == 0
    return TreeState(commit=commit, clean=clean)'''

[[rows]]
id = "B4_release_line_never_dirty"
description = "record_verdict: never write dirty, so the release reads a moved tree as clean"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py", "tests/test_release.py"]
old = '''    if not tree.clean:
        verdict = "dirty"'''
new = '''    if False:
        verdict = "dirty"'''

[[rows]]
id = "B5_collection_errors_unlisted"
description = "the reporting plugin: list no collection errors"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py"]
old = '''            if getattr(report, "when", None) == "collect"'''
new = '''            if getattr(report, "when", None) == "never"'''

[[rows]]
id = "B6_count_unread_under_workers"
description = "the reporting plugin: drop the xdist hook, so a run with workers records no collected count"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py"]
old = '''def pytest_xdist_node_collection_finished(node, ids):
    _COLLECTED["count"] = len(ids)'''
new = '''def pytest_xdist_node_collection_finished(node, ids):
    pass'''

[[rows]]
id = "B7_boot_unrecorded"
description = "record_run: record no boot id, which the driver then reads as another machine"
file = "scripts/cloud_battery.py"
surface = "maintainer"
tests = ["tests/test_cloud_battery.py", "tests/test_mutation_driver.py"]
old = '''        "boot_id": boot_id(),'''
new = '''        "boot_id": "",'''

# From review round one: the run must have run what it collected, unedited.

[[rows]]
id = "D15_early_stop_read"
