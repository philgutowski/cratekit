# Item 4 of the five-places residual finding. The table is scoped to the round's
# own diff, the three-state reader in core/secrets.py, the slug it registers in
# core/cause.py and the two wizard legs that catch it, plus a fixed sample of the
# guards already around the credential cycle. 17 rows against a cap of 25.

# ── The reader's three states ────────────────────────────────────────────────

[[rows]]
id = "A1_blanket_returns_empty"
description = "The whole three-state reader reverts to the old blanket, so OSError and ValueError alike answer nothing recorded"
file = "src/cratekit/core/secrets.py"
surface = "user"
old = '''    path = _index_path()
    try:
        raw = path.read_text()
    except FileNotFoundError:
        return frozenset()
    except OSError as exc:
        raise refuse(
            "credential-index-unreadable",
            f"the credential presence index at {path} is present and could not "
            f"be read ({type(exc).__name__}), so this installation cannot say "
            f"which credentials it has recorded. {left}",
            remedy=ProductRemedy.REPAIR_CREDENTIAL_STORE,
            origin=("core", "secrets"),
            detail={"path": str(path), "index": "unreadable"},
        ) from exc
    try:
        payload = json.loads(raw)
    except ValueError as exc:
        raise _damaged(
            path, f"is not readable as JSON ({type(exc).__name__})", left
        ) from exc
    names = payload.get("recorded") if isinstance(payload, dict) else None
    if not isinstance(names, Iterable) or isinstance(names, str):
        raise _damaged(path, "does not carry a list of recorded credential names", left)
    return frozenset(str(n) for n in names)'''
new = '''    del left
    path = _index_path()
    try:
        payload = json.loads(path.read_text())
    except (OSError, ValueError):
        return frozenset()
    names = payload.get("recorded") if isinstance(payload, dict) else None
    if not isinstance(names, Iterable) or isinstance(names, str):
        return frozenset()
    return frozenset(str(n) for n in names)'''

