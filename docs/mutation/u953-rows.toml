name = "u953"
pass_kind = "light"

# The card's own table over what the cut wrote: the helpers that now build a
# refusal several call sites used to spell out (its scope, origin, remedy and
# detail), the loops that replaced parallel branches, and the shared checks
# two callers used to hold word for word. Each row breaks one such helper the
# way a fold gets wrong, so every caller that leans on it is held at once. The
# guards that only moved or were folded unchanged are held by the kill set
# replay, u953-replay-after-*.

[[rows]]
