                raise
            except Exception as exc:'''
new = '''            except Exception as exc:'''

[[rows]]
id = "A5_outage_read_as_none"
description = "A provider that could not answer is read as filing no track, so the row is handed on and the verb writes"
file = "src/cratekit/intake/missing_cli.py"
surface = "user"
tests = ["tests/test_intake_missing_isrc.py", "tests/test_intake_missing.py"]
old = '''            except Exception as exc:  # noqa: BLE001 - refused whole, never swallowed
                raise refuse('''
new = '''            except Exception as exc:  # noqa: BLE001 - refused whole, never swallowed
                answers[code] = ()
                continue
                raise refuse('''

