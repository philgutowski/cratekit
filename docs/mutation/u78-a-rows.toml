surface = "user"
tests = ["tests/test_intake_missing_isrc.py", "tests/test_intake_missing.py"]
old = '''    if any(not one for one in ids):'''
new = '''    ids = [one for one in ids if one]
    if False:'''

[[rows]]
id = "A7_resolve_always"
description = "The catalogue is resolved whenever a row lacks an id, spending a login with nothing to ask"
file = "src/cratekit/intake/missing_cli.py"
surface = "user"
tests = ["tests/test_intake_missing_isrc.py", "tests/test_intake_missing.py"]
old = '''    if askable:
        found = catalogue.resolve(intake_cli._load())'''
new = '''    if askable or wanted:
        found = catalogue.resolve(intake_cli._load())'''
