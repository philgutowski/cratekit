name = "u78-a"
pass_kind = "light"

[[rows]]
id = "A1_malformed_asked"
description = "A malformed ISRC is sent to the provider rather than handed on unasked"
file = "src/cratekit/intake/missing_cli.py"
surface = "user"
tests = ["tests/test_intake_missing_isrc.py", "tests/test_intake_missing.py"]
old = '''    askable = list(dict.fromkeys(code for code in codes if _ISRC.fullmatch(code)))'''
new = '''    askable = list(dict.fromkeys(code for code in codes if code))'''

[[rows]]
id = "A2_no_fold"
description = "The ISRC is no longer folded of hyphens and spaces, so a presented code reads as malformed"
file = "src/cratekit/intake/missing_cli.py"
surface = "user"
tests = ["tests/test_intake_missing_isrc.py", "tests/test_intake_missing.py"]
old = '''    return re.sub(r"[\s-]", "", str(wanted.isrc or "")).upper()'''
new = '''    return str(wanted.isrc or "").strip().upper()'''

[[rows]]
