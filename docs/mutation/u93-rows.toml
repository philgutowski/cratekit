name = "u93-recursive-analysis"
pass_kind = "light"

# U93. The new guards are the walker in core/discovery.py, the checked join that
# replaced a path operator, the two warning builders, and the wiring in the two
# queued verbs. A fixed sample of the walker's pre-existing guards is included
# because they moved modules in this unit and a move is where a guard goes quiet.

[[rows]]
id = "D1_dotfile"
description = "Drop the dotfile clause from _is_audio, which is what lets an AppleDouble sidecar become an item"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''        path.is_file()
        and not path.name.startswith(".")
        and path.suffix.lower() in AUDIO_EXTS'''
new = '''        path.is_file()
        and path.suffix.lower() in AUDIO_EXTS'''

[[rows]]
id = "D2_is_file"
description = "is_file becomes exists, so a directory named track.flac becomes an item"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''        path.is_file()
        and not path.name.startswith(".")'''
new = '''        path.exists()
        and not path.name.startswith(".")'''

[[rows]]
id = "D3_suffix"
description = "Drop the audio suffix clause, so cover art and text files become items"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''        and not path.name.startswith(".")
        and path.suffix.lower() in AUDIO_EXTS
    )'''
new = '''        and not path.name.startswith(".")
    )'''

[[rows]]
id = "D4_default_mode"
description = "Drop the one level early return, so every caller walks the tree whether it asked or not"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''    if not recursive:
        return Scan(
            items=tuple(sorted(path.name for path in folder.iterdir() if _is_audio(path))),
            skipped_links=(),
            unreadable=(),
        )
'''
new = ""

[[rows]]
id = "D5_dot_directory"
description = "Stop pruning dot directories, so .Trashes and .Spotlight-V100 are walked"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''            if name.startswith("."):
                continue
            if (here / name).is_symlink():'''
new = '''            if (here / name).is_symlink():'''

[[rows]]
id = "D6_link_declined"
description = "Walk a directory symlink and report nothing, which is the loop hazard and the silent skip at once"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''            if (here / name).is_symlink():
                skipped.append(_relative(folder, here / name))
                continue
            kept.append(name)'''
new = '''            kept.append(name)'''

[[rows]]
id = "D7_prune_in_place"
description = "Assign the filtered list to a new name instead of the slice, which leaves os.walk descending everything"
file = "src/cratekit/core/discovery.py"
surface = "user"
old = '''        dirnames[:] = kept'''
new = '''        dirnames = kept  # noqa: F841'''

[[rows]]
