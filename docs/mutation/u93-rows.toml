[[dropped]]
id = "D26_as_posix"
description = "_relative returns str(relative_to(...)) instead of as_posix()"
reason = "ranked below the cap because it is INERT on this platform: on darwin PurePath.__str__ already joins with '/', so the mutation is a null control wearing a guard's name and would report a zero that means nothing. The separator claim is a statement about a Windows checkout and this suite cannot measure it here."

[[dropped]]
id = "D27_shown_cap"
description = "SHOWN drops from 5 to 3"
reason = "ranked below the cap because the coefficient carries no correctness claim: the count in the sentence is measured by D13's neighbour test and the 'and N more' tail by D17, so the only thing 5 decides is how long a line is."

[[dropped]]
id = "D28_unreadable_dedupe"
description = "Drop the set() around unreadable, so one folder erroring twice is named twice"
reason = "ranked below the cap because os.walk calls onerror at most once per unlistable directory, so the dedupe is belt and braces over a producer that was driven and does not produce the duplicate."
