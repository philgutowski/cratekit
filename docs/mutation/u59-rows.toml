# U59 lands a parked branch. The table is scoped to the rule the branch exists
# for, the soft-delete reader, plus the guards this merge re-armed or repaired
# and the five findings the review round fixed. Everything else on the branch
# was already measured on `main`: the conformance 3 work had been cherry-picked
# across before this merge, so `tests/test_cli_contract.py` is byte identical to
# `main` and there is nothing here for a table to say about it.

# ---------------------------------------------------------------------------
