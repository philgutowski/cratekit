name = "u77-c"
pass_kind = "light"

[[rows]]
id = "C1_manifest_version"
description = "manifest_rows: refuse only a version below this build's, so a manifest of a later version is read on the hope its keys still mean what they meant"
file = "src/cratekit/acquire/listdoc.py"
surface = "user"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''if isinstance(version, bool) or version != MANIFEST_VERSION:'''
new = '''if isinstance(version, bool) or version < MANIFEST_VERSION:'''

[[rows]]
id = "C2_manifest_version_bool"
description = "manifest_rows: drop the boolean test on the version, so true, which Python holds equal to 1, reads as version 1"
file = "src/cratekit/acquire/listdoc.py"
surface = "maintainer"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''if isinstance(version, bool) or version != MANIFEST_VERSION:'''
new = '''if version != MANIFEST_VERSION:'''

[[rows]]
id = "C3_not_a_manifest"
description = "manifest_rows: stop asking whether the document names a manifest version at all, so a list document passed by mistake is not refused by name"
file = "src/cratekit/acquire/listdoc.py"
surface = "user"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''if not isinstance(body, Mapping) or "manifest" not in body:'''
new = '''if not isinstance(body, Mapping):'''

[[rows]]
id = "C4_year_bool"
description = "_manifest_row: drop the boolean test on the year, so a year of true is read as the year 1"
file = "src/cratekit/acquire/listdoc.py"
surface = "maintainer"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''if year is not None and (isinstance(year, bool) or not isinstance(year, int)):'''
