'''

[[rows]]
id = "C6_gate_manifest_bytes"
description = "_payload: leave the manifest's bytes out of the plan identity, so the gate accepts an answer given against other rows (the gate layer alone, the engine's own check left in place)"
file = "src/cratekit/intake/land_cli.py"
surface = "user"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''identity["manifest_bytes"] = manifest.digest'''
new = '''identity["manifest_bytes"] = ""'''

[[rows]]
id = "C7_digest_handed_to_engine"
description = "intake_land: hand the engine no fingerprint, so a manifest rewritten between the gate and the first move is filed"
file = "src/cratekit/intake/land_cli.py"
surface = "user"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''manifest_digest=manifest.digest if manifest is not None else None,'''
new = '''manifest_digest=None,'''

[[rows]]
id = "C8_unfiled_rows_warned"
description = "intake_land: warn about refused files only, so a label row filed under nothing is named nowhere a person reads"
file = "src/cratekit/intake/land_cli.py"
surface = "user"
tests = ["tests/test_landing_labels.py", "tests/test_landing.py", "tests/test_intake_land.py", "tests/test_tree_writer.py", "tests/test_listdoc.py", "tests/test_xml_splice_golden.py"]
old = '''for entry in (*landed.refused, *landed.unlabelled)'''
new = '''for entry in (*landed.refused,)'''

