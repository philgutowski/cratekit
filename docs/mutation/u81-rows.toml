# R-322's task adds a driver and no guard. So the table is not scoped to new
# guards, it is scoped to the two rows that MEASURED the absence, re-run to see
# whether they now kill, plus the two terms of the function that the new tests
# reach and the previous table never asked about.
#
# The first two rows are copied VERBATIM from `docs/mutation/u59-rows.toml`,
# including their test subsets, because the brief asks for the second half of the
# verification to be proved by re-running the row rather than by asserting it. A
# row rewritten for the occasion proves something about the rewrite.

# ---------------------------------------------------------------------------
# The two rows R-322 is made of. Both killed zero on U59's full suite.
# ---------------------------------------------------------------------------

[[rows]]
id = "B5_contradictions_by_number"
description = "Index the graph by unit number again in contradictions()"
file = "scripts/board.py"
tests = ["tests/test_pending_units.py"]
surface = "user"
old = '''        number = issues_by_unit.get(uid)
        node = graph.get(number) if number is not None else None'''
new = '''        node = graph.get(uid)'''

[[rows]]
id = "B5_composite"
description = "What B5 does hold: report a contradiction over an OPEN issue as well"
file = "scripts/board.py"
tests = ["tests/test_pending_units.py", "tests/test_adoption.py", "tests/test_cli_contract.py", "tests/test_deferred_routing.py", "tests/test_mutation_driver.py", "tests/test_pool_sizing.py", "tests/test_restore.py"]
