# R-3, the archive tier in scripts/scan_repo.py. Author's rows, UNRUN.
#
# The full suite is about six minutes and the driver's preflight is two full
# runs, so this table cannot finish inside a relay task's ten minute foreground
# call. That is R-329, and the learning filed for it says to commit the rows
# and record the gap rather than spend ceiling length calls. Run it attended:
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r-3-rows.toml
#
# Every row is maintainer facing: the scan guards the repository, not a verb.
# Each row's expected kill is written in its description so a run can be read
# against a prediction. M10 is the one expected zero and is last on purpose.

name = "r-3"
pass_kind = "light"

