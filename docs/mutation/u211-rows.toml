name = "u211"
pass_kind = "light"

# U211: the rekordbox process scan meets a process it cannot read. Every row
# reverts one guard this unit added. The subsets name the suites that drive
# the guard; a zero there is promoted to the full suite by the driver.

[[rows]]
id = "P1_denied_is_skipped"
description = "running_processes: drop AccessDenied from the skip tuple, so a denied process is re-checked and refuses as unreadable"
file = "src/cratekit/core/processes.py"
surface = "user"
tests = ["tests/test_process_scan.py", "tests/test_process_guard.py"]
old = '''        except (table.NoSuchProcess, table.ZombieProcess, table.AccessDenied):'''
new = '''        except (table.NoSuchProcess, table.ZombieProcess):'''

[[rows]]
id = "P2_gone_is_skipped"
