name = "u63-driver"
pass_kind = "light"

# U63 binds the outbound account adapter, which WRITES to a person's streaming
# account, so the table is the full 25 rows. The brief scopes it to matching,
# idempotence and the one read rule; the review round added the add answer check,
# the 400 reading and the dropped account, so those are here too. Every row names
# its subset. The batch name is `u63-driver` so an attended driver run writes
# `u63-driver.md` beside the hand record `u63.md` rather than over it.

