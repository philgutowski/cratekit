surface = "user"
tests = ["tests/test_rbxml.py", "tests/test_xml_splice_golden.py", "tests/test_tree_writer.py", "tests/test_tree_registry.py"]
old = '''    if playlist.self_closing:
        content[playlist.tag_end - 1 : playlist.tag_end + 1] = bytearray(
            b">" + CRLF + lines + b" " * playlist.indent + _NODE_CLOSE'''
new = '''    if playlist.self_closing and not playlist.self_closing:
        content[playlist.tag_end - 1 : playlist.tag_end + 1] = bytearray(
            b">" + CRLF + lines + b" " * playlist.indent + _NODE_CLOSE'''

