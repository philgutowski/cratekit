[[rows]]
id = "W6_unwritten_current_swapped"
description = "retag_one: the unwritten result reports the answer as the genre the file still carries"
file = "src/cratekit/tagging/retag.py"
surface = "user"
tests = ["tests/test_genre_retag.py", "tests/test_tag_workers.py", "tests/test_tagging_engine.py"]
old = '''    if not tags.write_genre(candidate.path, answer):
        # THE WRITER'S FALSE IS AN UNWRITTEN FILE, NEVER A CORRECTION (R-1103).
        # ``written`` stays None, so :attr:`RetagOutcome.written` leaves the file
        # out and :func:`plan_library` plans no row for it, and the answer it
        # could not take rides as ``proposed`` so the report can name it. A
        # verdict the answer came from stays as it is: the next run reads it
        # again and tries the write again, rather than asking a person twice.
        return RetagResult(
            path=candidate.path,
            current=candidate.current,'''
new = '''    if not tags.write_genre(candidate.path, answer):
        # THE WRITER'S FALSE IS AN UNWRITTEN FILE, NEVER A CORRECTION (R-1103).
        # ``written`` stays None, so :attr:`RetagOutcome.written` leaves the file
        # out and :func:`plan_library` plans no row for it, and the answer it
        # could not take rides as ``proposed`` so the report can name it. A
        # verdict the answer came from stays as it is: the next run reads it
        # again and tries the write again, rather than asking a person twice.
        return RetagResult(
            path=candidate.path,
            current=answer,'''

