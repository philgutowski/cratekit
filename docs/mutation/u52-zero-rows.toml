[[rows]]
id = "P1_revoked_tombstones_suppress"
description = "Snapshot revoked tombstones too, so a lifted suppression silently keeps a release out of the review queue"
file = "src/cratekit/label/sweep.py"
surface = "user"
old = '''            snapshot = {record.suppression_id for record in store.suppressions()}'''
new = '''            snapshot = {
                record.suppression_id
                for record in store.suppressions(include_revoked=True)
            }'''

[[rows]]
id = "P2_snapshot_read_eagerly"
description = "THE LAZY READ: take the snapshot when the reader is built, which fires the unreadable store refusal on a label that has no confirmed release to ask about"
file = "src/cratekit/label/sweep.py"
surface = "user"
old = '''    snapshot: set[str] | None = None'''
new = '''    snapshot: set[str] | None = {
        record.suppression_id
        for record in DecisionStore(tombstone.STORE_KEY, cfg).suppressions()
    }'''
