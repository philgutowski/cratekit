# The fix round's pin: each layer removed alone.

[[rows]]
id = "G1_pin_never_compared"
description = "Gates.require: skip the pin comparison, so an answer given over one file is used by a run that opened another"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_pins.py", "tests/test_intake_land_native.py", "tests/test_gate_shown_plan.py"]
old = '''        if recorded is not None and inline is None:
            held = self.state.pins.get(spec.name, {})'''
new = '''        if False:
            held = self.state.pins.get(spec.name, {})'''

[[rows]]
id = "G2_pin_overwritten_before_compare"
description = "Gates.require: record the pin on every call, so the continuation replaces the answered pin before comparing it"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_pins.py", "tests/test_intake_land_native.py", "tests/test_gate_shown_plan.py"]
old = '''        if recorded is None and pins:'''
new = '''        if pins:'''

[[rows]]
id = "G3_absence_read_as_agreement"
description = "Gates.require: compare only keys both sides pinned, so a run that pinned nothing passes a gate that now pins"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_pins.py", "tests/test_intake_land_native.py", "tests/test_gate_shown_plan.py"]
old = '''                if held.get(key) != pins.get(key):'''
new = '''                if key in held and key in pins and held[key] != pins[key]:'''

[[rows]]
id = "G4_pins_not_written"
description = "RunState.to_json: never write the pins, so the answer's file is lost when the first act exits"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_pins.py", "tests/test_intake_land_native.py", "tests/test_gate_shown_plan.py"]
old = '''        if self.pins:
            record["pins"]'''
new = '''        if False:
            record["pins"]'''

[[rows]]
id = "G5_pins_not_read"
description = "RunState.from_json: read no pins back, so a continuation sees none"
file = "src/cratekit/cli/gates.py"
surface = "user"
tests = ["tests/test_gate_pins.py", "tests/test_intake_land_native.py", "tests/test_gate_shown_plan.py"]
old = '''                for name, one in (data.get("pins") or {}).items()'''
new = '''                for name, one in {}.items()'''

[[rows]]
id = "L1_landing_pins_nothing"
description = "ask_then_write: pin nothing, so every native write's answer is free of the file again"
file = "src/cratekit/intake/land_cli.py"
surface = "user"
tests = ["tests/test_intake_land_native.py"]
old = '''            spec, plan=data, context=shown(rows), pinned={DATABASE_PIN: str(opened)}'''
new = '''            spec, plan=data, context=shown(rows), pinned={}'''
