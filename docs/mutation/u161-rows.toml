name = "u161"
pass_kind = "light"

# The unit's one change is an absence: the database path left out of the
# native digest. Rows 1 to 3 put a path back in three spellings, rows 4 and
# 5 take out the library identity that replaces it, row 6 takes the path off
# the screen, and the rest sample the identity's existing guards that the
# unit's tests now also assert on.

[[rows]]
id = "P1_path_back_in_digest"
description = "native.identity: digest str(plan.database) again, the line U161 removed, so a copy rehearsal can never match"
file = "src/cratekit/intake/native.py"
surface = "user"
tests = ["tests/test_intake_land_native.py"]
old = '''        "device": plan.device_id,
        "master_db_id": plan.master_db_id,'''
new = '''        "database": str(plan.database),
        "device": plan.device_id,
        "master_db_id": plan.master_db_id,'''

[[rows]]
id = "P2_parent_in_digest"
description = "native.identity: digest the database's folder under another key, a path the old key's name check would not see"
file = "src/cratekit/intake/native.py"
surface = "user"
tests = ["tests/test_intake_land_native.py"]
old = '''        "device": plan.device_id,
        "master_db_id": plan.master_db_id,'''
new = '''        "where": str(plan.database.parent),
        "device": plan.device_id,
        "master_db_id": plan.master_db_id,'''

[[rows]]
id = "P3_file_name_in_digest"
description = "native.identity: digest the database's file name alone, which a copy named differently from master.db would not share"
file = "src/cratekit/intake/native.py"
surface = "user"
tests = ["tests/test_intake_land_native.py"]
old = '''        "device": plan.device_id,
        "master_db_id": plan.master_db_id,'''
new = '''        "file": plan.database.name,
        "device": plan.device_id,
        "master_db_id": plan.master_db_id,'''

[[rows]]
