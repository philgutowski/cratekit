        output_schema="plan/1",
        planned_in="U35",
        # U43 LANDED IT.'''

[[rows]]
id = "R2_undeclared_refusal_slug"
description = "setbuild-anchor-not-indexed leaves cause.REASONS, so refuse raises UnknownReason at the boundary instead of refusing"
file = "src/cratekit/core/cause.py"
