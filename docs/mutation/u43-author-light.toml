# ── considered and not run ────────────────────────────────────────────────────

[[dropped]]
id = "A5_relative_against_the_process"
description = "A relative anchor is taken against the working directory instead of the library root"
reason = "THE TWENTY-SIXTH ROW, cut to the light pass cap, and cut on information value rather than on importance. It is a certain kill: test_a_relative_anchor_is_taken_against_the_library_and_not_the_process asserts exactly that resolution, was written in the same sitting as the guard, and would have reported a number nobody could be surprised by. The rows kept in its place are ones whose outcome was genuinely unknown, P2 above especially."

[[dropped]]
id = "D1_find_in_index_threshold"
description = "Lower MATCH_THRESHOLD in the engine's fuzzy anchor lookup"
reason = "RANKED BELOW THE CAP BECAUSE NOTHING IN src REACHES IT. find_in_index is called only from resolve_anchor, which is called only from build_set, and no module under src calls either: this shell resolves by path. A row here would measure the engine's own suite and say nothing about the shipped verb. The mis-resolution it would probe is filed as a residual with its reachability stated."

[[dropped]]
id = "D2_energy_order_unknown_first"
description = "Sort unknown energy first rather than last in _energy_order"
reason = "Ranked below the cap: same guard family as E1 and E2, which are measured, and the sequence-ordering property it touches is already exercised by P3 and P4 from the shell's side. A light pass caps at 25 and this was the twenty-sixth."

[[dropped]]
id = "D3_weights_do_not_sum"
description = "Move a Weights coefficient so the five no longer sum to one"
reason = "Ranked below the cap: Weights.__post_init__ raises on construction, so the mutation is a collect error rather than a death, and mutate.py would report drift instead of a number. The coefficient-mutation rule METHOD asks for is served by C2 instead, which moves a bound by one rather than removing it."

[[dropped]]
id = "D4_second_template_copy"
description = "Change the lossy marker literal in write/naming_cli.py rather than in this shell"
reason = "Ranked below the cap and it belongs to a different unit. H4 measures this shell's own copy. That six sites in src construct the same template independently is filed as a residual rather than measured here, because a row proving the sixth copy drifts would be a row about naming_cli's guards."
