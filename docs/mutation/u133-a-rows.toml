'''

[[rows]]
id = "P5_vocabulary_owner"
description = "A vocabulary row is named by its tag alone, whichever bucket files that tag"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "user"
old = '''
            if (row.bucket, row.tag.casefold().strip()) in clashing:
'''
new = '''
            if row.tag.casefold().strip() in {word for _owner, word in clashing}:
'''

[[rows]]
id = "P6_spelling_once"
description = "A spelling a place files twice is listed twice in its sentence"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "maintainer"
old = '''
            if spelling not in clash.setdefault(where, []):
                clash[where].append(spelling)
'''
new = '''
            clash.setdefault(where, []).append(spelling)
'''

[[rows]]
id = "P7_designed_sharing"
description = "A word the shipped template files in both places counts as a clash (U132's P2, re-measured in its rewritten form)"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "user"
old = '''
            if word in designed.get(owner, set()):
                continue
'''
new = ""

[[rows]]
id = "P8_held_by_whole_copy"
description = "Only the copy's first bucket filing a word is asked about, as the setdefault before U133 did across buckets"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "user"
old = '''
            filed.setdefault(word, []).extend((bucket.id, s, w) for s, w in places)
'''
new = '''
            filed.setdefault(word, list((bucket.id, s, w) for s, w in places))
'''

