name = "u133-a"
pass_kind = "light"

# Batch a: the upgrade planner's hold, the one code change of U133.

[[rows]]
id = "P1_first_place_only"
description = "A word filed in several places of one bucket names only the first, as before U133"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "user"
old = '''
        places = found.setdefault(word.casefold().strip(), [])
        if (word, where) not in places:
            places.append((word, where))
'''
new = '''
        places = found.setdefault(word.casefold().strip(), [])
        if not places:
            places.append((word, where))
'''

[[rows]]
id = "P2_one_spelling_per_place"
description = "One place filing a word under two spellings names only the first, the review's finding 3"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "user"
old = '''
        if (word, where) not in places:
            places.append((word, where))
'''
new = '''
        if all(known != where for _spelling, known in places):
            places.append((word, where))
'''

[[rows]]
id = "P3_map_row_label"
description = "A source map row is labelled as the sub it files into, merging two hand edits into one sentence"
file = "src/cratekit/core/taxonomy_upgrade.py"
surface = "user"
old = '''add(source, f"{bucket.id}, its source map row to {sub_id}")'''
new = '''add(source, f"{bucket.id}, its sub {sub_id}")'''

