name = "u175"
pass_kind = "light"

# U175: each account playlist a landing writes into INBOX carries the landing's
# date at the end of the account's own name. The rows revert the naming rule
# one piece at a time, then sample the record guards the rotation and the
# INBOX mirror rest on, which the unit claims they follow unchanged.

[[rows]]
id = "N1_date_first"
description = "dated: put the date before the account's name, the order Phillip declined"
file = "src/cratekit/intake/batch_name.py"
surface = "user"
tests = ["tests/test_intake_land_account_playlists.py", "tests/test_intake_land_account_playlists_native.py", "tests/test_inbox_analyzed.py", "tests/test_inbox_refill.py"]
old = '''    return f"{account_name} {day.isoformat()}"'''
new = '''    return f"{day.isoformat()} {account_name}"'''

[[rows]]
id = "N2_no_date"
description = "dated: return the account's name alone, undated as before U175"
file = "src/cratekit/intake/batch_name.py"
surface = "user"
tests = ["tests/test_intake_land_account_playlists.py", "tests/test_intake_land_account_playlists_native.py", "tests/test_inbox_analyzed.py", "tests/test_inbox_refill.py"]
old = '''    return f"{account_name} {day.isoformat()}"'''
new = '''    return account_name'''

[[rows]]
id = "N3_date_form"
description = "dated: write the date as the account's own month_day_year form rather than ISO"
file = "src/cratekit/intake/batch_name.py"
surface = "user"
tests = ["tests/test_intake_land_account_playlists.py", "tests/test_intake_land_account_playlists_native.py", "tests/test_inbox_analyzed.py", "tests/test_inbox_refill.py"]
old = '''    return f"{account_name} {day.isoformat()}"'''
new = '''    return f"{account_name} {day.month}_{day.day:02d}_{day.year % 100:02d}"'''

