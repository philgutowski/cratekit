file = "src/cratekit/core/tree_registry.py"
surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
old = '''    parsed, unreadable = session.scan_log(cfg)
    if unreadable:'''
new = '''    parsed, unreadable = session.scan_log(cfg)
    if False:'''

[[rows]]
id = "M2_margin_zero"
description = "the native write margin is no days, so a write whose universal time date is the day before the cutover day is left out"
file = "src/cratekit/core/tree_registry.py"
surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
old = '''NATIVE_WRITE_MARGIN = timedelta(days=1)'''
new = '''NATIVE_WRITE_MARGIN = timedelta(days=0)'''

[[rows]]
id = "M3_margin_two_days"
description = "the native write margin is two days, so a write two days before the cutover day still counts"
file = "src/cratekit/core/tree_registry.py"
surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
old = '''NATIVE_WRITE_MARGIN = timedelta(days=1)'''
new = '''NATIVE_WRITE_MARGIN = timedelta(days=2)'''

[[rows]]
id = "M4_unparseable_start_predates"
description = "a session start nothing can parse is read as before the cutover, so its write does not count"
file = "src/cratekit/core/tree_registry.py"
surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
old = '''    except ValueError:
        return False
    return began < cutover_on - NATIVE_WRITE_MARGIN'''
new = '''    except ValueError:
        return True
    return began < cutover_on - NATIVE_WRITE_MARGIN'''

[[rows]]
id = "M5_updates_not_counted"
description = "only a creation counts as a native write, an update does not"
