surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
old = '''            change.tree == tree_id and (change.created > 0 or change.updated > 0)'''
new = '''            change.tree == tree_id and change.created > 0'''

[[rows]]
id = "M6_any_tree_counts"
description = "a write to any tree counts as a write to this one"
file = "src/cratekit/core/tree_registry.py"
surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
old = '''            change.tree == tree_id and (change.created > 0 or change.updated > 0)'''
new = '''            (change.created > 0 or change.updated > 0)'''

[[rows]]
id = "M7_zero_count_counts"
description = "a record naming the tree with nothing added counts as a native write"
file = "src/cratekit/core/tree_registry.py"
surface = "user"
tests = ["tests/test_cutover_precheck.py", "tests/test_cutover_cli.py"]
