name = "r691"
pass_kind = "light"

# R-691: the database route inbox gate plans its placements before the gate
# and shows each file's destination, the digest binds the placements, and the
# write consumes the plan it showed. A rendering plus a seam move: the write
# is unchanged, so the table is scoped to the new guards, the regression the
# residual recorded, and the review round's fixes. Author's table, no
# independent verifier (METHOD, 2026-09-07).

[[rows]]
id = "P1_destination_left_off_the_item"
description = "each item is listed with no destination, the defect R-691 recorded: a person answers a placement they cannot read"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_routing_workers.py"]
old = '''
            "destination": destined.get(str(path), ""),
            "vocal": vocal.get(str(path), ""),
'''
new = '''
            "destination": "",
            "vocal": vocal.get(str(path), ""),
'''

