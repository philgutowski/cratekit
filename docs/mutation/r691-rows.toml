[[rows]]
id = "P3_vocal_named_as_the_destination"
description = "the vocal placement is written into the destination column instead of its own, so a vocal track shows one sub where it files into two"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_routing_workers.py"]
old = '''
            named = vocal if placement.sub == trees.VOX_SUB_CLASS else destined
            named.setdefault(placement.location, f"{folder_name}/{sub}")
'''
new = '''
            named = destined
            named.setdefault(placement.location, f"{folder_name}/{sub}")
'''

[[rows]]
id = "P4_digest_over_the_file_list"
description = "the digest is taken over the file list alone, the other half of the defect: a decision recorded against it stays valid while the routing under it changes"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_routing_workers.py"]
old = '''
    digest = digest_of({"kind": kind, "items": items})
'''
new = '''
    digest = digest_of({
        "kind": kind,
        "items": [
            {k: v for k, v in item.items() if k in ("path", "name", "track_id")}
            for item in items
        ],
    })
'''

