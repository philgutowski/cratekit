# ── the walk ────────────────────────────────────────────────────────────────

[[rows]]
id = "C1_the_declared_total_is_ignored"
description = "the total is read and then never consulted, so every walk falls back to a page shape"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''        if total is not None:'''
new = '''        if False and total is not None:'''

[[rows]]
id = "C2_an_empty_page_ends_a_declared_total_walk"
description = "the empty middle window ends the walk again, the exact defect the review found"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''            if offset >= total and len(page) < page_size:
                break
        elif not page:
            break'''
new = '''            if offset >= total and len(page) < page_size:
                break
        if not page:
            break'''

[[rows]]
id = "C3_a_full_page_at_the_declared_end_stops_anyway"
description = "a total that under reports now truncates, because the walk trusts it over what it sees"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''            if offset >= total and len(page) < page_size:'''
new = '''            if offset >= total:'''

[[rows]]
id = "C4_the_short_page_rule_stops_every_walk"
description = "the rule argument is dropped from the short page test, so every shape stops short"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''        if stop is StopRule.SHORT_PAGE and len(page) < page_size:'''
new = '''        if len(page) < page_size:'''


[[rows]]
id = "C6_offset_advances_by_what_was_served"
description = "the plausible wrong fix: advance by the page's length, not the window width, re-serving items"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''        offset += page_size

        if total is not None:'''
new = '''        offset += len(page)

        if total is not None:'''

[[rows]]
id = "C7_a_zero_total_is_trusted_as_an_end"
description = "the sentinel check goes, so an unparsed num_tracks of -1 ends the walk at once"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''        if total is not None and total <= 0:
            total = None'''
new = '''        if total is not None and total < -1:
            total = None'''

# ── the budget and its ending ───────────────────────────────────────────────

[[rows]]
id = "D1_the_budget_truncates_quietly"
description = "spending the budget returns what it collected, the pre U65 behaviour"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py"]
old = '''        if pages >= max_pages:
            raise ListingTruncated('''
new = '''        if pages >= max_pages:
            break
        if False:
            raise ListingTruncated('''


[[rows]]
id = "D3_the_empty_page_is_not_counted_against_the_budget"
description = "pages counts only pages with items, so the budget means something other than requests"
file = "src/cratekit/acquire/listing.py"
surface = "maintainer"
tests = ["tests/test_adapter_listing.py"]
old = '''        page = list(page or [])
        pages += 1
        for item in page:'''
new = '''        page = list(page or [])
        if page:
            pages += 1
        for item in page:'''

[[rows]]
id = "D4_the_refusal_stops_naming_the_listing"
description = "the message loses the shape, so an operator cannot tell which listing ran away"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py"]
old = '''                f"{shape or 'listing'} spent its whole budget of {max_pages} requests "'''
new = '''                f"a listing spent its whole budget of {max_pages} requests "'''

[[rows]]
id = "D5_the_favourites_budget_is_tightened_onto_real_data"
description = "a budget that can fire on a real account, which turns a correctness fix into an outage"
file = "src/cratekit/acquire/listing.py"
surface = "user"
tests = ["tests/test_adapter_listing.py"]
old = '''    "favorite_tracks": 200,  # reaches 19,900 tracks. Largest measured: 197.'''
new = '''    "favorite_tracks": 3,  # reaches 19,900 tracks. Largest measured: 197.'''

