# U65, author's table. Every listing declares its own stop rule and page budget.
#
# Scoped to this unit's own diff plus a fixed sample of U14's existing guards in
# the same module, per METHOD. Read only unit, so the table is scoped to the new
# guards rather than run at full depth, and every row names its subset so a death
# on the subset is a real death and a zero on it is not yet a zero.
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/u65-rows.toml

name = "u65"
pass_kind = "light"

# ── the required declarations ───────────────────────────────────────────────

[[rows]]
id = "A1_stop_gets_a_default"
description = "stop becomes optional, so a new wrapper inherits an assumption instead of choosing"
file = "src/cratekit/acquire/listing.py"
surface = "maintainer"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''    stop: StopRule,
    max_pages: int,'''
new = '''    stop: StopRule = StopRule.SHORT_PAGE,
    max_pages: int,'''

[[rows]]
id = "A2_max_pages_gets_a_default"
description = "the request budget becomes optional and effectively unbounded"
file = "src/cratekit/acquire/listing.py"
surface = "maintainer"
tests = ["tests/test_adapter_listing.py", "tests/test_outbound_tidal_account.py"]
old = '''    stop: StopRule,
    max_pages: int,
    declared_total'''
new = '''    stop: StopRule,
    max_pages: int = 1_000_000,
    declared_total'''

