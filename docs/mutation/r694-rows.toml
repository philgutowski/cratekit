name = "r694"
pass_kind = "light"

# R-694: the export sweeps owe a rekordbox import only for a root playlist
# they added to. route inbox --export ends pending only when the long track
# playlist gained tracks, route unplaced --export never does, and both carry a
# routing-not-landable review warning for the nested membership their file
# cannot land. Scoped to the new branch, the new warning and the new pending
# text. Author's table, no independent verifier (METHOD, 2026-09-07).

[[rows]]
id = "B1_inbox_pending_on_every_write"
description = "the inbox sweep ends pending whenever it writes a file, the defect R-694 recorded: the check run after the import ends pending again"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_routing_workers.py"]
old = '''
    if not lengthened or declared.long_tracks is None:
        return ctx.envelope(data=data, outcome=Outcome.OK, warnings=warnings)
'''
new = '''
    if declared.long_tracks is None:
        return ctx.envelope(data=data, outcome=Outcome.OK, warnings=warnings)
'''

