name = "r356-b"
pass_kind = "light"

# Batch b of the r356 table: the source, the two engines and the two workers
# that carry the row's names in and the reason out. See batch a for the split.

[[rows]]
id = "B1_naming_head_left_on_the_release_title"
description = "The release title is the display title, key and tempo head and all, which agrees with no provider title"
file = "src/cratekit/modules/outbound/source.py"
surface = "user"
old = '''    return naming.strip_heads(entry.name, template=template)'''
new = '''    return entry.name'''

[[rows]]
id = "B2_template_declares_no_lossy_marker"
description = "The template never declares the marker, so a marked lossy copy keeps it in its release title"
file = "src/cratekit/modules/outbound/source.py"
surface = "user"
old = '''    if not marker:
        return naming.NameTemplate()'''
new = '''    if True:
        return naming.NameTemplate()'''

[[rows]]
id = "B3_empty_marker_no_longer_guarded"
description = "A configuration with no marker text builds a marker rule with an empty literal, which is refused at construction, so every item fails over a naming policy"
file = "src/cratekit/modules/outbound/source.py"
surface = "user"
old = '''    if not marker:
        return naming.NameTemplate()'''
new = '''    if False:
        return naming.NameTemplate()'''

