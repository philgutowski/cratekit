name = "u27-restore-cli-independent"
pass_kind = "full"

# Independent verifier's table for U27, commit e2dd532. Scoped to this commit's
# diff plus a fixed sample of the guards the unit leans on. The author's table is
# docs/mutation/u27-restore-cli-author.toml, 28 rows; it was read first and no row
# here repeats one of its rows. Where a family overlaps, this table attacks the
# half the author did not: the plumbing from the parsed arguments rather than the
# body of the function, the argument declarations themselves, the fields the
# listing derives rather than the list it returns, and the four test-side
# registers this commit edited.

