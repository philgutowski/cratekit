name = "u300"
pass_kind = "light"

# The card's own table over what the split wrote: each part reads the facade's
# seams through the facade at call time, so a patch on rb_writer, session or
# restore still bites inside the part. Each row reverts one such lookup to the
# part's own name (the shape a split gets wrong), plus the three refusals a part
# raises on the writer's behalf. The guards that moved unchanged are held by the
# kill set replay, u300-replay-after-*.

[[rows]]
id = "S1_probe_resolved_in_the_part"
description = "rekordbox_processes_running asks the part's own probes, so a probe patched on rb_writer is not asked"
file = "src/cratekit/core/rb_probes.py"
surface = "user"
tests = ["tests/test_rb_writer_guard.py", "tests/test_process_guard.py", "tests/test_rb_writer_db.py"]
old = "            if getattr(_writer(), probe_name)():"
new = "            if globals()[probe_name]():"

