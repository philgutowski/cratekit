name = "u104-e"
pass_kind = "light"

[[rows]]
id = "E1_gate_before_fetch"
description = "Drop intake set's recognition gate ahead of the fetch, so a machine with no keys downloads a whole mix before it is told"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_set_fetch.py", "tests/intake/test_workers.py"]
old = '''        local = _local_or_none(source)
        recognize.assert_recognition_ready()
        job = None'''
new = '''        local = _local_or_none(source)
        job = None'''

[[rows]]
id = "E2_timeout_is_retryable"
description = "Stop calling a timed out download retryable, the one fetch failure known to be worth running again"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_set_fetch.py", "tests/intake/test_workers.py"]
old = '''            remedy=Remedy.RETRY_LATER,
            retryable=True,
            steps=(
                "run it again later",'''
new = '''            remedy=Remedy.RETRY_LATER,
            retryable=False,
            steps=(
                "run it again later",'''

[[rows]]
id = "E3_honest_zero_names_the_address"
description = "Report the scratch file's path as the source of a mix nobody recognised"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_set_fetch.py", "tests/intake/test_workers.py"]
old = '''                    chunks=result.chunks,
                    source=held.ref,'''
new = '''                    chunks=result.chunks,
                    source=str(held.path),'''

