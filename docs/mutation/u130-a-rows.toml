# U130, a playlist pair kept one list on both sides. Batch A: the merge rules
# in sync/pair_merge.py. Every row is user facing: the merge decides what is
# added to and taken off both the rekordbox library and the account.

[[rows]]
id = "A1_removal_beats_addition"
description = "A removal wins over an addition, so a track removed on one side and re-added on the other is dropped"
file = "src/cratekit/sync/pair_merge.py"
surface = "user"
tests = ["tests/test_sync_pair_merge.py", "tests/test_sync_pair.py"]
old = '''        if added or not removed:'''
new = '''        if not removed:'''

[[rows]]
id = "A2_readded_ignored"
description = "A rekordbox membership on a new row no longer counts as added"
file = "src/cratekit/sync/pair_merge.py"
surface = "user"
tests = ["tests/test_sync_pair_merge.py", "tests/test_sync_pair.py"]
old = '''            and (key not in then_rekordbox or key in rekordbox.readded)'''
new = '''            and key not in then_rekordbox'''

[[rows]]
id = "A3_rekordbox_never_leads"
