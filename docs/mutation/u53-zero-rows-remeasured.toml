name = "u53-zero-rows-remeasured"
pass_kind = "light"

# The five zeros from ``u53-rows.toml``, re-measured after the guards that were
# missing were written, plus the composite METHOD asks for on the one that
# stays. Not a second pass over the unit's diff: the same five rows, re-run.

# ---------------------------------------------------------------------------
# The four that were zero because of the FIXTURES rather than the guard
# ---------------------------------------------------------------------------

[[rows]]
id = "A2_abort_instead_of_not_apply"
description = "The branch tests for abort rather than for apply, so an option nobody classified acquires the write"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
old = '''    if option != "apply":
        return ctx.envelope(data=_plan(items, kind="inbox", applied=False), outcome=Outcome.NO_OP)'''
new = '''    if option == "abort":
        return ctx.envelope(data=_plan(items, kind="inbox", applied=False), outcome=Outcome.NO_OP)'''

[[rows]]
id = "I1_native_filter_dropped"
description = "A resort queues an item for a tree still on the bridge, which no rebuild can write"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
old = '''    return tuple(sorted(t for t in entries.tree_ids() if entries.is_database_native(t)))'''
new = '''    return tuple(sorted(entries.tree_ids()))'''

[[rows]]
id = "I6_tree_items_ignores_native"
description = "The rebuild's items include trees the registry says are still on the bridge"
file = "src/cratekit/cli/rebuild.py"
surface = "user"
old = '''    native = tuple(sorted(t for t in entries.tree_ids() if entries.is_database_native(t)))'''
new = '''    native = tuple(sorted(entries.tree_ids()))'''

[[rows]]
id = "I7_tree_items_ignores_the_named_tree"
description = "A rebuild of one named tree quietly rebuilds every tree in the library"
file = "src/cratekit/cli/rebuild.py"
surface = "user"
old = '''    if tree_id is None:
        return native
    return tuple(t for t in native if t == tree_id)'''
new = '''    return native'''

