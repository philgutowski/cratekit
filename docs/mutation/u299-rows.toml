name = "u299"
pass_kind = "light"

# The card's own table over the code U299 added or rewrote while it split the
# foundation modules: the state inventory's two entry constructors, the
# taxonomy build's folder readers, and the two places the config split moved a
# guard across a module seam. The guards that only moved are held by the kill
# set replay, u299-replay-after-*.

[[rows]]
id = "U1_installation_never_restored"
description = "_installation: an installation entry is captured with the library, coupled to a restore"
file = "src/cratekit/core/state_files.py"
surface = "user"
tests = ["tests/test_config.py", "tests/test_snapshot.py", "tests/test_restore.py"]
old = '''        snapshot=SnapshotRole.NEVER_RESTORED,
        installation_area=area,'''
new = '''        snapshot=SnapshotRole.COUPLED,
        installation_area=area,'''

