[[rows]]
id = "B1_type_error_translated"
description = "_folder_endpoint: stop translating a TypeError from the client's request object, so a signature change climbs the retry ladder"
file = "src/cratekit/acquire/listing.py"
surface = "maintainer"
tests = ["tests/test_adapter_listing.py", "tests/test_label_playlists.py"]
old = '''        except TypeError as exc:
            raise ListingNotPaginated(
                f"{type(request).__name__}.request'''
new = '''        except KeyError as exc:
            raise ListingNotPaginated(
                f"{type(request).__name__}.request'''

[[rows]]
id = "B2_client_part_refusal"
description = "_client_part: drop the refusal of a missing client part, so a moved request object is retried and slept on"
file = "src/cratekit/acquire/listing.py"
surface = "maintainer"
tests = ["tests/test_adapter_listing.py", "tests/test_label_playlists.py"]
old = '''        if value is None:
            raise ListingNotPaginated(
                f"{type(owner).__name__} has no'''
new = '''        if False:
            raise ListingNotPaginated(
                f"{type(owner).__name__} has no'''

