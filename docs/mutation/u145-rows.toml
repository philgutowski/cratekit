# U145 author's mutation table: hearts file by month, and the quarters split into months and retired.
# Twenty five rows, the cap, over the month rule and its callers, the split's
# reading of the quarters, its dating, its taken back rule, its digest, the
# guards on each of its two commits, the confinement rule, and the verb's order.
# Considered and dropped below the cap: as_utc inside month_of (the quarter era
# test of a naive moment still pins it through month_of's parametrization), the
# gone membership branch of the confinement rule (the changed membership row
# exercises the same reading), _tied's first mention rule (the job rows reach it
# already deduplicated by provider identifier, so only two identifiers
# resolving to one row could reach it), the read back of a quarter still live
# (the node confinement before the commit refuses the same state first), and
# the commit of the additions only when something was added (a run with a made
# month and nothing to add cannot be built, since a month is made for a member).
name = "u145"
pass_kind = "light"

[[rows]]
id = "M1_month_off_by_one"
description = "month_of: the month is off by one, October named 2026-09"
file = "src/cratekit/favorites/placeholders.py"
surface = "user"
tests = ["tests/test_favorites_placement.py", "tests/test_favorites_split.py", "tests/test_intake_land_hearts_native.py"]
old = '''    return f"{utc.year:04d}-{utc.month:02d}"'''
new = '''    return f"{utc.year:04d}-{utc.month - 1:02d}"'''

