id = "E3_skipped_dirnames_empty"
description = "Empty SKIPPED_DIRNAMES whole"
reason = "ranked below the cap: A3 removes the same guard at its use and A4 measures the set's membership, so this row would re-measure both at once"

[[dropped]]
