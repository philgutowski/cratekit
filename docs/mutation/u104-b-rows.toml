[[rows]]
id = "F6_clear_before_attempt"
description = "Stop clearing the scratch folder before an attempt: reuse whatever a killed process left in it"
file = "src/cratekit/intake/fetch.py"
surface = "user"
tests = ["tests/intake/test_set_fetch.py"]
old = '''            if scratch.exists():
                shutil.rmtree(scratch)
            scratch.mkdir(parents=True)'''
new = '''            scratch.mkdir(parents=True, exist_ok=True)'''

[[rows]]
id = "F7_remove_on_exit"
description = "Drop the removal of the scratch folder when the pass ends, so a fetched mix stays on disk"
file = "src/cratekit/intake/fetch.py"
surface = "user"
tests = ["tests/intake/test_set_fetch.py"]
old = '''    finally:
        shutil.rmtree(scratch, ignore_errors=True)
        if scratch.exists():'''
new = '''    finally:
        if scratch.exists():'''

