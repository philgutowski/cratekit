name = "u39-naming-independent"
pass_kind = "full"

# Independent U39 review table. Derived without reading the author table's
# zero-death claims. Scope is the round's own diff (naming.py's write-time
# padding, naming_cli.py's shared spec builder, the registry correction) plus
# a small fixed sample of existing guards this diff leans on. Several rows
# here target branches the shipped suite exercises only in a form where both
# operands of an `or` are simultaneously true, which a driven scratch fixture
# (drive_u39.py, scenario G) shows is a live gap, not a theoretical one.

