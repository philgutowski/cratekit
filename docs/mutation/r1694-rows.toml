[[rows]]
id = "L5_hold_the_refresh"
description = "_login: return the refresh as what the keychain holds after a store failure, so every later resolve logs in again and fails to store again"
file = "src/cratekit/acquire/provider_session.py"
surface = "user"
tests = ["tests/test_provider_session_unstored.py", "tests/test_provider_session_hold.py", "tests/test_provider_gate.py"]
old = '''        return client, stored
    return client, refreshed'''
new = '''        return client, refreshed
    return client, refreshed'''

[[rows]]
id = "L6_no_note"
description = "_login: note nothing on a store failure, so the verb never says the session was not stored"
file = "src/cratekit/acquire/provider_session.py"
