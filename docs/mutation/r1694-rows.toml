name = "r1694"
pass_kind = "light"

# Rows target the guards R-1694 added: the login scope's tolerance of a
# write back the keychain, its index or a file could not take, the login's
# return of what the keychain holds, the note, and the dispatcher's warning.

[[rows]]
id = "S1_tolerance_reraises"
description = "materialised_session: re-raise a store failure handed to the tolerance, so a refreshed login on the opt in fails the verb again"
file = "src/cratekit/acquire/provider_session.py"
surface = "user"
tests = ["tests/test_provider_session_unstored.py", "tests/test_provider_session_hold.py", "tests/test_vendored_drive.py", "tests/test_provider_gate.py"]
old = '''            except STORE_FAILURES as exc:
                unstored(exc)
'''
new = '''            except STORE_FAILURES as exc:
                raise
'''

[[rows]]
id = "S2_tolerance_always"
description = "materialised_session: tolerate a store failure even when no callback was given, so the drive's own catch and streamrip's scope lose their failure"
file = "src/cratekit/acquire/provider_session.py"
surface = "user"
tests = ["tests/test_provider_session_unstored.py", "tests/test_provider_session_hold.py", "tests/test_vendored_drive.py", "tests/test_provider_gate.py"]
old = '''        if unstored is None:
            write_back(name, path, codec=codec, stored=payload)
        else:
'''
new = '''        if False:
            write_back(name, path, codec=codec, stored=payload)
        else:
            unstored = unstored or (lambda exc: None)
'''

[[rows]]
id = "S3_catch_everything"
description = "materialised_session: catch every exception at the write back, so a defect in the write is a warning rather than a raise"
file = "src/cratekit/acquire/provider_session.py"
surface = "user"
tests = ["tests/test_provider_session_unstored.py", "tests/test_provider_session_hold.py", "tests/test_vendored_drive.py", "tests/test_provider_gate.py"]
old = '''            except STORE_FAILURES as exc:
                unstored(exc)
'''
new = '''            except Exception as exc:
                unstored(exc)
'''

