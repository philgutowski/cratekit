[[rows]]
id = "M2_token"
description = "Change the machine token to a nearby word that no longer says not acquired"
file = "src/cratekit/sync/playlists.py"
surface = "user"
old = '''SWEPT_MEANS = "resolved-not-acquired"'''
new = '''SWEPT_MEANS = "resolved"'''

[[rows]]
id = "M3_said_silent"
description = "said returns nothing, so the check carries no sentence while the json field stays"
file = "src/cratekit/sync/playlists.py"
surface = "user"
old = '''    return SWEPT_MEANS_SAID.get(str(block.get("swept_means") or ""))'''
new = '''    return None'''

[[rows]]
id = "M4_said_unconditional"
description = "said answers whatever the block carries, decoupling the sentence from the field"
file = "src/cratekit/sync/playlists.py"
old = '''    return SWEPT_MEANS_SAID.get(str(block.get("swept_means") or ""))'''
new = '''    return SWEPT_MEANS_SAID[SWEPT_MEANS]'''

[[rows]]
id = "M5_unwired"
description = "The playlists planner no longer hands its note to the plan"
file = "src/cratekit/sync/cli.py"
surface = "user"
old = '''    plan = _Plan(spec=spec, describe=describe, detail=describe([]), note=playlists.said)'''
new = '''    plan = _Plan(spec=spec, describe=describe, detail=describe([]))'''

[[rows]]
id = "M6_no_append"
description = "The check computes the note and never appends it to the detail a person reads"
file = "src/cratekit/sync/cli.py"
surface = "user"
old = '''        check["detail"] += f"; {noted}"'''
new = '''        pass'''

[[rows]]
id = "M7_note_before_describe"
description = "The note reads an empty block instead of the source's own, so it says nothing"
file = "src/cratekit/sync/cli.py"
surface = "user"
old = '''    noted = plan.note(plan.detail or {}) if plan.note is not None else None'''
new = '''    noted = plan.note({}) if plan.note is not None else None'''

