# ── Choosing what to restore ─────────────────────────────────────────────────

[[rows]]
id = "N1_the_default_takes_the_newest_unusable_capture"
description = "Choose the newest session regardless of whether its capture can be spent"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    for entry in restore.list_sessions(cfg):
        if entry.restorable:
            return entry
    return None'''
new = '''    for entry in restore.list_sessions(cfg):
        return entry
    return None'''

[[rows]]
id = "N2_an_unknown_identifier_is_not_refused"
description = "Fall through to the newest session when the named one does not exist"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    for entry in restore.list_sessions(cfg):
        if entry.session_id == session_id:
            return entry
    raise CratekitError('''
new = '''    for entry in restore.list_sessions(cfg):
        if entry.session_id == session_id:
            return entry
    for entry in restore.list_sessions(cfg):
        return entry
    raise CratekitError('''

