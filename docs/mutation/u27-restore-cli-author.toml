# ── The gate and its digest ──────────────────────────────────────────────────

[[rows]]
id = "G1_gate_found_by_position"
description = "Take gates[0] rather than the gate digested against the plan"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py", "tests/test_cli_contract.py"]
old = '''    for spec in entry.gates:
        if spec.digest_source == "plan":
            return spec'''
new = '''    for spec in entry.gates:
        return spec'''

[[rows]]
id = "G2_the_gate_is_never_offered_a_digest"
description = "Ask the confirmation with no digest, so a decision can never go stale"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    option = ctx.gate.require(spec, digest=offered["digest"])'''
new = '''    option = ctx.gate.require(spec)'''

[[rows]]
id = "G3_abort_restores_anyway"
description = "Treat an aborted confirmation as an approval"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py"]
old = '''    if option == "abort":
        return ctx.envelope(data=offered, outcome=Outcome.NO_OP)
    if chosen is None and not ctx.args.from_backup:'''
new = '''    if option == "never-an-option":
        return ctx.envelope(data=offered, outcome=Outcome.NO_OP)
    if chosen is None and not ctx.args.from_backup:'''

[[rows]]
id = "G4_the_gate_is_skipped_when_there_is_nothing_to_do"
description = "Return early before asking, so an empty library is the one never asked"
file = "src/cratekit/session/restore_cli.py"
surface = "user"
tests = ["tests/test_restore_cli.py", "tests/test_cli_contract.py"]
old = '''    spec = _confirm_gate(ctx.entry)
    option = ctx.gate.require(spec, digest=offered["digest"])'''
new = '''    if chosen is None and not ctx.args.from_backup:
        return ctx.envelope(data=offered, outcome=Outcome.NO_OP)
    spec = _confirm_gate(ctx.entry)
    option = ctx.gate.require(spec, digest=offered["digest"])'''

