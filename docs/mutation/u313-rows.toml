# Driver rules (METHOD's Driver rules and The mutation table), each a property of mutate.py

[[rows]]
id = "D1_quiet_flag_kept"
description = "pytest_addopts: stop stripping -q from pyproject's addopts, so every run is -qq and loses the summary and the collect listing"
file = "scripts/mutate.py"
surface = "maintainer"
tests = ["tests/test_mutation_driver.py"]
old = '''    return " ".join(token for token in tokens if token not in {"-q", "-qq", "--quiet"})'''
new = '''    return " ".join(token for token in tokens if token not in {"-qq", "--quiet"})'''

[[rows]]
id = "D2_collect_drift_unread"
description = "measure_row: never read a changed collected count as drift, so a file that fails to collect reads as a zero or a kill"
file = "scripts/mutate.py"
surface = "maintainer"
tests = ["tests/test_mutation_driver.py"]
old = '''    drift = final.collected != reference.collected'''
new = '''    drift = False'''

