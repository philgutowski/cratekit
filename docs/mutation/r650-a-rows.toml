name = "r650-a"
pass_kind = "light"

# ---------------------------------------------------------------------------
# A. The resolver: the tier that knows, and the index it consults.
# ---------------------------------------------------------------------------

[[rows]]
id = "A1_tier_five_sets_nothing"
description = "The last tier stops flagging its pass through, which is the state before this unit"
file = "src/cratekit/core/routing.py"
surface = "user"
old = '''    return Suggestion(tag=value, off_taxonomy=taxonomy.bucket_for_display(value) is None)'''
new = '''    return Suggestion(tag=value)'''

[[rows]]
id = "A2_tier_five_flags_everything"
description = "The last tier flags a bucket's own display, which routing places where the template says"
file = "src/cratekit/core/routing.py"
surface = "user"
old = '''    return Suggestion(tag=value, off_taxonomy=taxonomy.bucket_for_display(value) is None)'''
new = '''    return Suggestion(tag=value, off_taxonomy=True)'''

[[rows]]
id = "A3_suppression_widens_to_the_vocabulary"
description = "The review's first shape: suppress on any declared display, so a sub display and a changed case go unreported"
file = "src/cratekit/core/routing.py"
surface = "user"
old = '''    return Suggestion(tag=value, off_taxonomy=taxonomy.bucket_for_display(value) is None)'''
new = '''    declared = {b.display for b in taxonomy.buckets} | {
        sub.display for b in taxonomy.buckets for sub in b.subs
    }
    return Suggestion(tag=value, off_taxonomy=value not in declared)'''

[[rows]]
id = "A4_suppression_ignores_case"
description = "Suppress case insensitively, so a lowercased Bandcamp tag routing leaves in the catch-all reads as declared"
file = "src/cratekit/core/routing.py"
surface = "user"
old = '''    return Suggestion(tag=value, off_taxonomy=taxonomy.bucket_for_display(value) is None)'''
new = '''    lowered_displays = {b.display.lower() for b in taxonomy.buckets}
    return Suggestion(tag=value, off_taxonomy=lowered not in lowered_displays)'''

[[rows]]
id = "A6_declared_literal_rule_flagged"
description = "A declared rule carrying a literal tag and no bucket is reported as off taxonomy too"
file = "src/cratekit/core/routing.py"
surface = "user"
old = '''    return Suggestion(tag=rule.tag)'''
new = '''    return Suggestion(tag=rule.tag, off_taxonomy=True)'''

