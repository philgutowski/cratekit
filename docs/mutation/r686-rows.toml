name = "r686"
pass_kind = "light"

# R-686: the route.inbox.apply gate shows the plan it asks about. A display
# change on a gate that still holds the write, so the table is scoped to the
# branch's own new lines. Author's table, no independent verifier (METHOD,
# 2026-09-07).

[[rows]]
id = "G1_gate_passes_no_context"
description = "The apply gate drops its context, the defect R-686 recorded"
file = "src/cratekit/write/routing_cli.py"
surface = "user"
tests = ["tests/test_routing_workers.py"]
old = '''
    return ctx.gate.require(spec, digest=plan["digest"], context=shown)
'''
new = '''
    return ctx.gate.require(spec, digest=plan["digest"])
'''

