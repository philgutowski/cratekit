# Fourth attended sitting, 2026-09-17, R-355. Author's rows.
#
# Light table over the guards the sitting added to the outbound source, so the
# rows the outbound workers build carry the ISRC their audio file holds. Every
# row names its subset, so a death on the new tests is a real death and a zero
# on the subset is not yet a zero. Run attended:
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/sitting4-rows.toml

name = "sitting4"
pass_kind = "light"

