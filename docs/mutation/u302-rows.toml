# The composites of the three user facing zeros, each a mutation of the thing
# its zero row guards (METHOD). W9 is unreachable from the suite because every
# caller that passes a map passes the configuration's own; its composite drops
# the configuration's rules, which every write resolves recorded paths through.
# W14 is held by a second layer, `trees._root_row`, which refuses the same
# absent root when the membership write reads it back; its composite removes
# that layer. W18 is unreachable because the plan drops a soft deleted node
# from the tree it reads on the same handle; its composite keeps them.

[[rows]]
id = "W9c_configuration_rules_dropped"
description = "what W9 holds: prefix_rules with no caller map returns no rules, so a recorded path is never resolved through the configuration"
