[[rows]]
id = "C2_continue_before_save"
description = "decide: continue the verb before the answer is saved"
file = "src/cratekit/cli/verbs/runs.py"
surface = "user"
tests = ["tests/test_run_decide_continue.py"]
old = '''    gates.record(state, spec, ctx.args.option, actor=actor)
    gates.save(state)
