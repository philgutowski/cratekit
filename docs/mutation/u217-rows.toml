name = "u217"
pass_kind = "full"

# U217: a label's listing is kept. Rows target the store (kept_listing.py),
# the adapter's reads through it (tidal_catalogue.py), what the sweep and the
# two verbs say, and the ceiling message. 25 rows, METHOD's cap for a unit
# that writes.

