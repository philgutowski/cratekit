name = "u188"
pass_kind = "light"

# U188 adds no write and no delete. Its guards decide whether a rehearsal
# reads as the live plan, which is what the session approves a live landing
# on, so each row is user facing. Rows target the code the unit added.

[[rows]]
id = "M1_stored_pair_dropped"
description = "_mapped_back: leave the stored spelling pair out, so FolderPath on a renamed drive is never mapped back (the defect)"
file = "src/cratekit/intake/land_cli.py"
surface = "user"
tests = ["tests/test_intake_land_rehearse.py", "tests/test_intake_land_native.py"]
old = '''                (str(scratch_target), str(target)),
                stored,
            )'''
new = '''                (str(scratch_target), str(target)),
            )'''

[[rows]]
id = "M2_scratch_stored_under_the_mount"
description = "_mapped_back: spell the area's folder with no base drive, so the scratch side of the stored pair is the mounted spelling"
file = "src/cratekit/intake/land_cli.py"
surface = "user"
tests = ["tests/test_intake_land_rehearse.py", "tests/test_intake_land_native.py"]
old = '''            base_drive=scratch_rows.base_drive,
            current_drive=scratch_rows.current_drive,'''
new = '''            base_drive=None,
            current_drive=scratch_rows.current_drive,'''

