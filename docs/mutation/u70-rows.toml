name = "u70"
pass_kind = "light"

# U70 adds the reserved reference favorites to intake.playlist, a sixth
# Catalogue member, favourite_tracks, and one boundary that translates a hearts
# listing failure. The unit writes no file and no row, so the table is scoped
# to its new guards, each removed alone, plus a fixed sample of four existing
# guards the hearts path now leans on. Subset: the two test files that import
# the mutated modules and drive the new path; a zero is promoted to the full
# suite.

# ---------------------------------------------------------------------------
# The reserved reference, intake/cli.py
# ---------------------------------------------------------------------------

[[rows]]
id = "S1_sentinel_checked"
description = "The reserved reference is never recognised, so favorites reaches playlist_for as a playlist reference"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''    if is_favorites(reference):
        rows = label_cli.favourite_tracks_or_refuse(found, reference)'''
new = '''    if False:
        rows = label_cli.favourite_tracks_or_refuse(found, reference)'''

[[rows]]
id = "S2_sentinel_casefold"
description = "The sentinel is compared case sensitively, so Favorites is read as a playlist reference"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''    return str(reference or "").strip().casefold() == FAVORITES'''
new = '''    return str(reference or "").strip() == FAVORITES'''

[[rows]]
id = "S3_sentinel_strip"
description = "The sentinel is compared unstripped, so a padded favorites is read as a playlist reference"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''    return str(reference or "").strip().casefold() == FAVORITES'''
new = '''    return str(reference or "").casefold() == FAVORITES'''

[[rows]]
id = "S4_canonical_source"
description = "The job records the reference as typed rather than the canonical favorites, so the resume argv carries the typed spelling"
file = "src/cratekit/intake/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''        if hearts:
            reference = FAVORITES
        found = catalogue.resolve(cfg)'''
new = '''        found = catalogue.resolve(cfg)'''

[[rows]]
id = "S5_source_id_recorded"
description = "A hearts job is queued with no source_id, so nothing can tell it from a playlist job"
file = "src/cratekit/intake/cli.py"
surface = "maintainer"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''            source_id=FAVORITES_SOURCE_ID if hearts else None,'''
new = '''            source_id=None,'''

[[rows]]
id = "S6_source_id_only_for_hearts"
description = "Every playlist job is stamped source_id favorites, so a playlist reads as the hearts listing"
file = "src/cratekit/intake/cli.py"
surface = "maintainer"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''            source_id=FAVORITES_SOURCE_ID if hearts else None,'''
new = '''            source_id=FAVORITES_SOURCE_ID,'''

# ---------------------------------------------------------------------------
# The boundary, label/cli.py
# ---------------------------------------------------------------------------

[[rows]]
id = "B1_cratekit_passthrough"
description = "An adapter's own refusal under the hearts listing is flattened into label-playlist-unreadable"
file = "src/cratekit/label/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''        return list(found.favourite_tracks())
    except CratekitError:
        raise'''
new = '''        return list(found.favourite_tracks())
    except ZeroDivisionError:
        raise'''

[[rows]]
id = "B2_broad_translation"
description = "The translation is narrowed to LookupError, so ListingTruncated escapes the boundary as an unclassified crash"
file = "src/cratekit/label/cli.py"
surface = "user"
tests = ["tests/intake/test_workers.py", "tests/test_label_tidal_catalogue.py"]
old = '''        return list(found.favourite_tracks())
    except CratekitError:
        raise
    except Exception as exc:'''
new = '''        return list(found.favourite_tracks())
    except CratekitError:
        raise
    except LookupError as exc:'''

