file = "src/cratekit/sync/pair_merge.py"
surface = "user"
old = '''        if order_changed(rekordbox.keys, base.rekordbox) or order_changed(
            base.rekordbox, base.account
        ):'''
new = '''        if order_changed(rekordbox.keys, base.rekordbox) or False:'''

[[rows]]
id = "S2_placed_after_neighbour"
description = "sample, U130: a track only the following side holds goes to the start rather than after its neighbour"
file = "src/cratekit/sync/pair_merge.py"
surface = "user"
old = '''        anchor += 1
        result.insert(anchor, key)'''
new = '''        result.insert(0, key)'''

[[rows]]
id = "S3_scope_under_the_folder"
description = "sample, U231: a playlist under GIG READY is no longer read as kept, so its first sync is led by rekordbox"
file = "src/cratekit/sync/pair_cli.py"
surface = "user"
old = '''        return bool(rekordbox.ancestors) and rekordbox.top[1] == ORDER_FOLDER'''
new = '''        return False'''
