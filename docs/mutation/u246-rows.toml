file = "src/cratekit/write/rebuild.py"
surface = "user"
tests = ["tests/test_rebuild_growth.py", "tests/test_comprehension_sets.py", "tests/test_rebuild.py", "tests/test_genre_favorites.py", "tests/test_resort_scope.py"]
old = '''    favorites = tuple(entry for entry in placements if entry not in first_pass)'''
new = '''    favorites = tuple(entry for entry in placements if entry not in set(derived))'''

[[rows]]
id = "R2_rebuild_tuple_scan"
description = "rebuild_tree: test each placement against the derived tuple itself, a linear scan per placement, quadratic by equality and not by hashing"
