# R-102, the allowlist audit followed to its import closure. Author's rows.
#
# Every guard this change adds lives in tests/modules/test_reports.py, so every
# row targets that file and the subset the driver derives is that file. The full
# suite is about six minutes and the driver's preflight is two full runs, so the
# table cannot finish inside a relay task's ten minute foreground call. That is
# R-329. Run it attended:
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r-102-rows.toml
#
# The batch is named r-102-driver so the driver writes r-102-driver.md and .json
# and cannot overwrite r-102.md, the hand record.
#
# Every row was checked by hand on tests/modules/test_reports.py alone, each
# applied alone, the collected count checked on every row, node ids read from
# JUnit XML, the file restored from an in memory snapshot and compared against
# HEAD outside the run. The counts are in docs/mutation/r-102.md.

