file = "src/cratekit/core/jobs.py"
surface = "user"
tests = ["tests/test_jobs.py", "tests/test_label_workers.py"]
old = '''        f"empty result from a total failure is indistinguishable from having found "
        f"nothing, and only one of those may advance anything downstream",
        scope=Scope.SOURCE,
        retryable=retryable,
        origin=("jobs",),
        detail={"attempted": attempted},
'''
new = '''        f"empty result from a total failure is indistinguishable from having found "
        f"nothing, and only one of those may advance anything downstream",
        scope=Scope.SOURCE,
        retryable=True,
        origin=("jobs",),
        detail={"attempted": attempted},
'''

