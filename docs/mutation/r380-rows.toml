# R-380, author's table. A job of permanent failures is not resumable.
#
#     ./.venv/bin/python scripts/mutate.py docs/mutation/r380-rows.toml

name = "r380"
pass_kind = "light"

[[rows]]
id = "G1_the_wrapper_is_always_transient"
description = "the original defect: every job failure is unavailable-transient, retryable, resume-job"
file = "src/cratekit/core/jobs.py"
surface = "user"
tests = ["tests/test_jobs.py", "tests/test_label_workers.py"]
old = '''    if not failed or any(cause.retryable for cause in failed):
        return (
            "unavailable-transient",
            True,
            Remediation(remedy=Remedy.RESUME_JOB),
        )
    reasons = {cause.reason for cause in failed}
    reason = failed[0].reason if len(reasons) == 1 else failed[-1].reason
    return (
        reason,
        False,
        Remediation(
            steps=(
                "the failed items cannot succeed on resume; inspect each item's cause",
            )
        ),
    )
'''
new = '''    return (
        "unavailable-transient",
        True,
        Remediation(remedy=Remedy.RESUME_JOB),
    )
'''

[[rows]]
id = "G2_no_evidence_is_always_retryable"
