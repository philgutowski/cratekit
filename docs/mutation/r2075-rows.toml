name = "r2075"
pass_kind = "light"

# The four layers beside the gridless read back that R-2072's table read zero on
# the full suite (R-2075, card 1077): the read back's pending source and its flush
# (S2, S3), its place inside commit_guarded's rollback (S11), the landing's own
# rollback (C11) and the landing's read back after the commit (L1), kept under
# R-2072's ids; then variants of each layer, and a fixed sample of the read back's
# rows R-2072 killed.

[[rows]]
id = "S2_pending_creations_not_read_back"
description = "assert_created_rows_are_gridless: only the binding's buffer is read back, so a row added with the binding's tracking off is never read (R-2072 S2)"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_rb_writer_db.py", "tests/test_intake_land_native.py", "tests/test_write_guard_completeness.py"]
old = '''    instances = {**_registry_created_instances(db), **pending}'''
new = '''    instances = {**_registry_created_instances(db)}'''

[[rows]]
id = "S2b_pending_set_read_from_the_dirty_set"
description = "assert_created_rows_are_gridless: the pending source reads the session's changed objects instead of its new ones, a nearby spelling"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_rb_writer_db.py", "tests/test_intake_land_native.py", "tests/test_write_guard_completeness.py"]
old = '''    pending = {id(obj): obj for obj in session.new}'''
new = '''    pending = {id(obj): obj for obj in session.dirty}'''

[[rows]]
id = "S3_deliberate_flush_dropped"
description = "assert_created_rows_are_gridless: the flush before the read back is skipped, so a row still pending has no identity and is passed over (R-2072 S3)"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_rb_writer_db.py", "tests/test_intake_land_native.py", "tests/test_write_guard_completeness.py"]
old = '''    try:
        session.flush()
    except Exception:  # noqa: BLE001 - a flush failure is the caller's to report
        return'''
new = '''    try:
        pass
    except Exception:  # noqa: BLE001 - a flush failure is the caller's to report
        return'''

[[rows]]
id = "S3b_flush_before_the_pending_set_is_read"
description = "assert_created_rows_are_gridless: the flush runs before the pending set is gathered, which it empties, so the ordering the docstring calls load bearing is reversed"
file = "src/cratekit/core/rb_writer.py"
surface = "user"
tests = ["tests/test_rb_writer_db.py", "tests/test_intake_land_native.py", "tests/test_write_guard_completeness.py"]
old = '''    pending = {id(obj): obj for obj in session.new}
    instances = {**_registry_created_instances(db), **pending}
    if not instances:
        return

    # The flush populates the primary keys.
    try:
        session.flush()
    except Exception:  # noqa: BLE001 - a flush failure is the caller's to report
        return'''
new = '''    try:
        session.flush()
    except Exception:  # noqa: BLE001 - a flush failure is the caller's to report
        return
    pending = {id(obj): obj for obj in session.new}
    instances = {**_registry_created_instances(db), **pending}
    if not instances:
        return'''

