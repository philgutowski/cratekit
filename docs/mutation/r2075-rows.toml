old = '''            assert_created_rows_are_gridless(db)
            assert_foreign_untouched(db)
        except RekordboxUnavailable:
            db.rollback()
            raise'''
new = '''            assert_foreign_untouched(db)
        except RekordboxUnavailable:
            db.rollback()
            raise
        assert_created_rows_are_gridless(db)'''

