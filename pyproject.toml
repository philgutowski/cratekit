[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cratekit"
version = "0.4.0"
description = "Acquisition and curation for rekordbox DJs: slim core, toggleable feature modules, guarded library writes"
# KTD19: supported Python is 3.12 and 3.13, bounded by the vendored downloader.
# The upper bound is deliberate — an unbounded floor lets a resolver drag the
# install onto an interpreter the vendored tree has never run on, and the
# failure surfaces as an unrelated dependency error instead of a clear message.
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
# KTD19: authored code is MIT, and each vendored component keeps its own licence.
# The downloader under src/cratekit/_vendor/ is AGPL-3.0-only. Its text ships
# twice on purpose: once inside the package as data, so it can never be separated
# from the code it covers, and once here so it lands in the distribution metadata
# where a licence audit looks. tests/test_vendor_import.py asserts the two copies
# stay byte-identical, which turns the duplication into a checked invariant
# instead of two files that drift.
license-files = ["LICENSE", "vendor/LICENSE.tidal-dl-ng"]
authors = [{ name = "Cratekit contributors" }]

# ---------------------------------------------------------------------------
# SLIM CORE (R5). Everything here installs for every user, including the slim
# profile. The rule this list is built to: no audio DSP, no web framework, no
# machine-learning stack. Those live in extras named one-to-one with the module
# that needs them (KTD7), so a friend who never enables analysis never downloads
# torch. Adding a heavy dependency here is a regression, and
# tests/test_slim_core.py fails the build if one appears.
# ---------------------------------------------------------------------------
dependencies = [
    "platformdirs>=4.0",   # cross-platform config/state directory resolution (KTD6)
    "tomli-w>=1.0",        # TOML writing; reading uses the stdlib tomllib on 3.12+
    "keyring>=24.0",       # OS keychain for service credentials, never the plain config (R4)
    "psutil>=5.9",         # process liveness for lock holders, memory probe for worker sizing (KTD10)
    "mutagen>=1.47,<2",    # container-correct audio tag read/write (R18); also vendored-tree
    "lxml>=5.0",           # rekordbox XML parsing; writes go out as raw bytes, never a tree serialize
    "rapidfuzz>=3.0",      # three-state match scoring (R11)
    "requests>=2.32.5",    # service HTTP; floor raised by the vendored tree, see below
    "Pillow>=10.0",        # album art normalization for tagging (Core, feature 8)
    "tidalapi>=0.8.10,<0.9",  # Tidal playlist read + search (Core, feature 3); see below
    "pyrekordbox==0.4.4",  # guarded rekordbox database access; pinned because it is schema-coupled
    # Bandcamp purchases (U176). Bandcamp answers a plain HTTP client with a bot
    # check, and curl_cffi presents a browser's TLS fingerprint. A compiled
    # extension with wheels for CPython 3.12 and 3.13 on macOS, Linux and
    # Windows, imported only when a real Bandcamp request is made.
    "curl_cffi>=0.7,<1",

    # -----------------------------------------------------------------------
    # Transitive dependencies of the VENDORED downloader (KTD4, R8).
    #
    # The downloader itself is never a dependency specifier — it is a source
    # tree under src/cratekit/_vendor/, because its upstream was deleted from
    # PyPI and there is no index left to resolve it from. Its dependencies that
    # DO still exist stay ordinary dependencies, which is the other half of
    # KTD4.
    #
    # WHY THE UPPER BOUNDS ARE COPIED HERE. Vendoring moved responsibility for
    # them onto Cratekit. No resolver reads the vendored package's own metadata
    # any more, so a bound that is not written here is a bound that no longer
    # exists, and a major release of any of these breaks acquisition with an
    # error naming none of this.
    #
    # tidalapi is the one that matters most: it is the streaming client the
    # downloader is written against, and its 0.8 to 0.9 step is exactly the
    # change the vendored code cannot absorb. Its floor also moved up from 0.7,
    # which the core previously allowed — a resolver picking 0.7.x would have
    # satisfied the old specifier and broken the vendored tree at runtime.
    #
    # The ONE upstream bound deliberately not carried is requests<2.33. requests
    # is a stable HTTP client shared with the rest of the application, and
    # capping it there would constrain every other dependency for a pin that
    # reads like a version-range typo. The floor is real and is carried.
    #
    # None of these is DSP, ML, or a web framework, so the slim core holds.
    # Two are worth naming explicitly rather than adding silently:
    #   * pycryptodome is a compiled C extension. It publishes wheels for
    #     CPython 3.12 and 3.13 on macOS, Linux, and Windows, so no user needs a
    #     compiler, but it is the one dependency here that is not pure Python.
    #   * python-ffmpeg is a thin subprocess wrapper, small in itself, but it
    #     requires the ffmpeg BINARY on PATH. That is a SYSTEM dependency pip
    #     cannot install; doctor has to check for it or a download fails at the
    #     remux step with a message about a missing executable.
    # -----------------------------------------------------------------------
    "dataclasses-json>=0.6.7,<0.7",  # settings and token serialization
    "m3u8>=6.0,<7",                  # HLS manifest parsing for segmented streams
    "pathvalidate>=3.3.1,<4",        # filename sanitization per platform
    "pycryptodome>=3.23,<4",         # stream decryption; compiled, wheels published
    "python-ffmpeg>=2.0.12,<3",      # remux wrapper; NEEDS the ffmpeg binary on PATH
    "rich>=14.2,<15",                # progress rendering inside the vendored CLI
    "typer>=0.20,<0.21",             # the vendored CLI's argument parsing
]

[project.optional-dependencies]
# Extras are named one-to-one with the modules that need them (KTD7). A module
# toggled on without its extra attaches a stub subcommand that prints exactly
# this install command and exits non-zero — `crate --help` never crashes on a
# missing heavy dependency.
analysis = [
    "librosa>=0.10",       # BPM detection and the pure-Python key fallback
    "numpy>=1.24",         # feature math
    "scipy>=1.10",         # peak finding for transition detection
]
vocals = [
    "torch>=2.2",              # runs the pretrained CNN on CPU
    "panns-inference>=0.1",    # AudioSet CNN14: vocal presence and singer gender
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    "jinja2>=3.1",
]
desktop = ["pywebview>=5.0"]
# Not a module either. It exists because the repository scan is only a guard
# once `pre-commit install` has run, and that command is only available once
# pre-commit is installed. Leaving both to a README step means the guard is off
# by default on every fresh clone, which was observed: a planted personal path
# committed cleanly on a machine where pre-commit was not on PATH. Shipping the
# tool with the dev install makes the documented setup actually executable.
dev = ["pre-commit>=3.7", "pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.6"]
# Convenience aggregate. Not a module; it exists so a maintainer can install
# every extra in one command without hand-listing them.
all = ["cratekit[analysis,vocals,web,desktop]"]

[project.scripts]
# R2: one entry point. The 30 console scripts the source system exposes become
# subcommands on this one verb, registered through the static module registry.
crate = "cratekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cratekit = ["templates/*.toml"]
# R7: the operator skills SHIP WITH THE PACKAGE. They live under the package
# rather than beside it for exactly this line's sake: package-data can only name
# paths inside the importable tree, so a repository-root skills directory would
# be present in a checkout, absent from every wheel, and the install verb would
# have nothing to copy on the one machine that matters.
"cratekit.skills" = ["assets/*/SKILL.md"]
# The vendored component's AGPL text ships INSIDE its own package directory.
# Anything relying on license-files alone would put it in distribution metadata
# only, where an unpacked or relocated tree loses it; KTD19 wants the licence
# travelling with the code it covers.
"cratekit._vendor.tidal_dl_ng" = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party source is excluded from linting. It is code Cratekit did
# not write and will not restyle: every lint fix there becomes another patch to
# re-apply on the next version bump, for no defect. Excluding it does give up
# ruff's E9 syntax check over the tree, so tests/test_vendor_import.py byte
# compiles every vendored module instead, which is the stronger check for the
# thing that actually matters — that the extract is valid, importable Python on
# the interpreters KTD19 supports.
#
# This is an exclusion from STYLE only. scripts/scan_repo.py still runs over the
# vendored tree, deliberately and always. That is the highest-risk directory in
# the repository, not the most exempt one.
extend-exclude = ["src/cratekit/_vendor"]

[tool.ruff.lint]
# Real-error rules plus import hygiene. Style churn is deliberately excluded:
# this codebase is byte-sensitive in places and reformatting is risk without
# payoff. "I" is included because KTD23's layering test reads imports, and
# unsorted imports make its failures harder to read.
select = ["E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite runs against the source tree it SITS BESIDE, resolved from pytest's
# own rootdir, never against whatever an editable install happens to point at.
# In a plain checkout the two are the same path and this changes nothing. In a
# git worktree they are not: the editable install's path entry names the main
# checkout, so without this the tests in a worktree import a different tree than
# the one being edited, pass or fail on code nobody changed, and report it as if
# it were the worktree's. That is the P2 failure aimed at a build: a check that
# reads a different value from the thing it is checking.
pythonpath = ["src"]
# Every test runs against redirected state roots (tests/conftest.py autouse
# fixtures). A test that reaches real config, a real library, or a real keychain
# is a bug, not a slow test.
#
# `-n auto` runs the suite across every core through pytest-xdist, which ships
# in the dev extra. Measured 2026-09-18 on an 11 core machine at 7,678 tests:
# 532 seconds serial, 86 at eight workers, 61 at auto, green each time. It is
# safe here because of the sentence above: every test already owns its state
# roots, so no two workers share a directory, a keychain or a library. Pass
# `-n 0` to run in this process, which a debugger and a profiler both need.
# `scripts/mutate.py` inherits this line, so the driver's full suite baselines
# run parallel too, and its reporting plugin writes from the controller only.
addopts = "-q -n auto"

[tool.coverage.run]
source = ["cratekit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
