# Cratekit taxonomy template, schema 2.
#
# This file is PACKAGED DATA: it ships read-only inside the wheel and is the
# starting point a setup run copies into the library's own state root, where it
# becomes that library's active template (seam decision S6). Editing the copy
# in the wheel does nothing; edit the library's copy.
#
# Every entry carries a stable `id` alongside its `display` (R19). State keys on
# the id, rekordbox sees the display, and renaming a folder therefore orphans
# nothing.
#
# PROVENANCE OF THE LIBRARY-DERIVED VALUES. The structure below (which buckets
# exist, which subs each carries, which bucket is the fallback) was read from a
# rekordbox XML export of the author's library dated 2026-07-15, 10070 tracks,
# 18 folders under the tree root. The alias lists, the ordered fuzzy rules, the
# tempo priors and the family projection were emitted from the source system's
# own tables, so they are exact rather than transcribed.
#
# THREE BUCKETS ARE NOT FROM THAT EXPORT. R&B was a sub of the non electronic
# bucket there. The author moved it to the top level on 2026-10-01 (R-797), with
# energy bands, and Soul with it as one folder. On 2026-10-09 (U118) Soul left
# R&B for a folder of its own and Hip-Hop left the non electronic bucket, both
# with energy bands. Each entry says what it left behind.
#
# PROVISIONAL VALUES. The tempo priors are one person's hand-tuned windows and
# have never been measured against detector error rates; confirming them needs a
# detection run over a labelled sample per bucket, which no test here performs.
# The `family` projection is likewise a judgement call: two of its assignments
# (see the comments on those buckets) are accidents of rule ordering in the
# system it came from, preserved here so the projection is behaviour-identical,
# and both deserve a deliberate decision before anyone treats them as intended.
# The `rates` flags are the third: two of this file's consumers disagreed about
# whether those buckets get a star rating written, and this file follows the
# stricter one. Nothing measured that; somebody should decide it.
#
# THREE SOURCE STRINGS ROUTE ONE WAY AND TAG ANOTHER, on purpose and visibly:
#
#   Bass / Club    routes to the catch-all, tags as UK Garage / Bassline
#   Reggae         routes to the catch-all, tags as the Caribbean sub
#   Trap / Wave    routes to the breaks bucket, tags as the Hip-Hop bucket
#
# This is coherent rather than contradictory: tagging rewrites the file's genre
# to this library's own name and routing then resolves THAT, so the two are
# chained. It is recorded here because the two tables it came from held these
# three apart with no way to see it. Each is one `tag_aliases` line to change.

# 2 SINCE R-797, the version a template states before it may declare a former
# place, see the R&B bucket below. A build that knows only version 1 refuses
# this file by name, where it would otherwise ignore the declaration and file
# tracks twice. A template with no former place may stay at 1.
#
# 3 SINCE U118, the version a template states before it may declare a split
# place, see the Soul bucket below, for the same reason one version on. A
# template with no split place may stay at 2.
schema_version = 3

# KTD14 pins the tree at three levels: a child of ROOT, a folder, a sub-playlist.
# The XML bridge's indentation constants encode exactly that, so a template
# declaring another depth is refused by name rather than emitted wrong.
[tree]
id = "genre_energy"
display = "BY GENRE + ENERGY"
depth = 3

# The intake flow (R19). Tracks land here first and are swept into the tree.
[intake]
id = "inbox"
display = "INBOX"

# The folder inside the intake flow a stale batch is rotated into (U111):
# `crate inbox rotate` moves a batch older than reports.intake_stale_days here
# and removes one here older than reports.intake_expired_days, never its tracks.
# Optional; delete the section and the rotation refuses by name.
[intake_old]
id = "inbox_old"
display = "Old"

# The folder at the playlist root a set's playlist is kept in for good (U121).
# A set intake lands its downloads as one batch under the intake flow, which
# the rotation clears after 90 days, and writes every identified track the
# library owns, downloaded or not, as one more playlist here, named the source
# system's way: `10_09_26 Public Service NYC Live at Vonking 5-26`. Optional;
# delete the section and the set playlist refuses by name.
[inspiration]
id = "inspiration"
display = "INSPIRATION"

# The catalog tree (R19): where a whole-catalog import lands, one folder per
# catalogued source holding one playlist per release year. Optional, unlike the
# two above. Delete this section and a catalog import refuses by name instead of
# inventing a folder; the routing tree and the intake flow are unaffected.
[catalog]
id = "record_labels"
display = "Record Labels"

# The playlist that keeps sets apart from tracks: every collection track longer
# than over_seconds is a member, and a track is never taken out of it. A direct
# child of the playlist root. Optional like the catalog; delete the section and
# no such playlist is built. The values are the source system's own.
[long_tracks]
id = "long_tracks"
display = "Sets and Long Tracks"
over_seconds = 1200

[fallback]
bucket = "electronica_other"
# Routing must always land somewhere; tagging must never blanket-fall-back, or
# a coarse guess becomes the file's permanent genre tag. The two entry points
# read the same table and differ only here.
routing_uses_fallback = true
tagging_uses_fallback = false
# Source strings too coarse to accept as a final tag. Replaces the source
# system's separate reject set and its separate fallback-folder constant.
too_coarse_as_source = ["", "Electronica", "Electronic", "Electronica / Other"]

[energy]
enabled = true
scale_max = 10
# Ordered, each `max` an inclusive upper bound on the 1..scale_max scale.
bands = [
  { id = "low",  display = "Low",  max = 3 },
  { id = "med",  display = "Med",  max = 6 },
  { id = "high", display = "High", max = 10 },
]
# Where a track with no energy reading parks. A bucket may omit it, which means
# leave the track where it is rather than move it to a sink.
no_energy_sub = { id = "unsorted", display = "Unsorted" }

# The star curve is deliberately DECOUPLED from the band cuts above. Energy is
# decile-calibrated, so an even five-way split lands tracks evenly across five
# stars, while the tree stays a three-way split. Forcing the two to align would
# silently re-rate the library.
#
# Consequence, resolved deliberately (seam decision D3): composing these cuts
# with a five-to-three star fold makes energy 4 read as the middle band in the
# tree and the low band on a stars-derived dashboard. The TREE rule wins and is
# asserted by name in the parity suite. Do not 'fix' the dashboard into agreeing;
# it reads a rating field that is only written when unset, so its band is not a
# function of energy at all for any hand-rated track.
[energy.rating]
cuts = [
  { max = 2,  rating = 51 },
  { max = 4,  rating = 102 },
  { max = 6,  rating = 153 },
  { max = 8,  rating = 204 },
  { max = 10, rating = 255 },
]

# Two policies, not one 'excluded' flag. Collapsing them loses the reason:
#   manual  -> automation never writes it and never moves a track out of it.
#   derived -> automation rebuilds it from a signal, so it is written but is
#              still never a move source; moving a track out without re-deriving
#              silently drops the routing that put it there.
[[sub_class]]
id = "candy"
display = "Candy"
policy = "manual"
present_in = "energy_buckets"

[[sub_class]]
id = "with_vox"
display = "with vox"
policy = "derived"
additive = true
present_in = "all_buckets"

# The set-builder's family vocabulary is a PROJECTION off the bucket, not a
# second genre table. Reading the family off the resolved bucket also fixes a
# live inconsistency: the source system runs its family rules on the raw tag, so
# a track tagged for two genres can land in one bucket and score as another.
[family]
# The family that means 'nothing in common'. Two buckets share it without
# being alike, so it must never award a same-family bonus.
catch_all = "other"
same_genre = 1.0
same_family = 0.6
same_supergroup = 0.4
unrelated = 0.2
unknown_anchor = 0.5

[family.supergroup]
progressive = "house"
melodic = "house"
house = "house"

[[bucket]]
id = "deep_house"
display = "Deep House"
family = "house"
bpm = { start = 122, floor = 110, ceil = 132 }
aliases = [
  "Deep House",
]

[[bucket]]
id = "tech_house"
display = "Tech House"
family = "house"
bpm = { start = 125, floor = 115, ceil = 140 }
aliases = [
  "Bass House",
  "Electro House",
  "Future House",
  "Tech House",
]
# Tagging-only: source strings the tagger accepts that routing deliberately
# does not. Listing them here is the point — the two tables that used to
# hold them disagreed, and the disagreement was invisible.
tag_aliases = [
  "tech-house",
]

[[bucket]]
id = "minimal_deep_tech"
display = "Minimal / Deep Tech"
family = "house"
bpm = { start = 126, floor = 118, ceil = 136 }
aliases = [
  "Minimal / Deep Tech",
]
# Tagging-only: source strings the tagger accepts that routing deliberately
# does not. Listing them here is the point — the two tables that used to
# hold them disagreed, and the disagreement was invisible.
tag_aliases = [
  "deep tech",
  "minimal",
]
# Same band boundaries, different band labels. Only the display changes,
# which is why the override is on the label and not on the cut.
energy = { enabled = true, band_display = { low = "Low Energy", med = "Med Energy", high = "High Energy" } }

