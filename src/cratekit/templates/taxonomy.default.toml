# R&B AT THE TOP LEVEL, decided by the author on 2026-10-01 (R-797). He is
# growing an R&B collection and wants to pull from it by energy, so it left the
# non electronic bucket for a folder of its own, split by the same bands as the
# dance genres, and Soul came with it as one folder until U118 gave Soul its
# own, below. The energy measure was tuned on dance music and is unproven here;
# that was known when it was chosen.
#
# It took exactly what the old sub held, and keeps the two of those words the
# author left under R&B on 2026-10-09: R&B and MPB. The tempo window and the
# family are the non electronic bucket's, unchanged. The keyword rules for
# "r&b" and "soul" further down still send a partial match to the non
# electronic bucket's default sub, as they always did; that is a separate
# decision.
#
# `rates = false` IS CARRIED OVER TOO. These tracks got no star rating written
# while they sat in the non electronic bucket, and the author decided bands,
# not ratings. Delete the line to have a rating derived from energy here as it
# is in every other bucket that has bands.
[[bucket]]
id = "rnb"
display = "R&B"
family = "other"
bpm = { start = 110, floor = 70, ceil = 165 }
aliases = [
  "MPB",
  "R&B",
]
tag_aliases = [
  "rnb",
]
rates = false

# THE PLAYLIST THIS BUCKET'S TRACKS SAT IN BEFORE IT HAD A FOLDER. A former
# place is a competing sub of the bucket that declares it: adoption will not
# file a track into a band while it still sits here, and `crate adopt move`
# adds the band and then leaves this playlist. Nothing is ever filed into one.
# `bucket` is the bucket whose folder holds the playlist, `sub` the identifier
# it had there and `display` its name. Delete this table once the playlist is
# empty and gone from the library.
[[bucket.formerly]]
id = "non_electronic_soul_rnb"
bucket = "non_electronic"
sub = "soul_rnb"
display = "Soul / R&B"

# SOUL AT THE TOP LEVEL, decided by the author on 2026-10-09 (U118), beside
# R&B and split by the same bands, for the same reason: he pulls soul by
# energy while playing. Shaped as R&B is, the same family, tempo window and
# `rates = false`, and no Candy, which nobody asked for here.
#
# "Soul / R&B" and "soul & funk" file here on this table's own precedent, a
# combined source name goes under its first word, as "Hip-Hop / R&B" does
# under Hip-Hop. "soul & funk" is the general catalogue's own word (R-796),
# one genre there covering both; since R-799 that catalogue has a table of its
# own at the end of this file, and this alias is read for it only by a copy
# that declares no such table.
[[bucket]]
id = "soul"
display = "Soul"
family = "other"
bpm = { start = 110, floor = 70, ceil = 165 }
aliases = [
  "Soul",
  "Soul / R&B",
]
tag_aliases = [
  "soul & funk",
]
rates = false

# THE BANDS THIS BUCKET'S TRACKS SIT IN TODAY, which R&B still files into. A
# split place is a place of another bucket that is still that bucket's: a
# track whose genre names Soul and sits in one is moved by `crate adopt move`
# to the Soul band its reading names, or to Unsorted with no reading, and
# leaves the R&B band; a track whose genre names R&B is never touched. Its
# other memberships stay, "with vox" among them. Adoption will not file a
# Soul track into a band here while it still sits in one of these, and the
# move lists any Soul track it cannot move out. `bucket` is the folder that
# keeps the place, `sub` its identifier there and `display` the name that
# folder gives it. Delete these tables once no Soul track is left in them.
#
# THE LAST ONE IS R&B'S FORMER PLACE, the playlist Soul and R&B shared before
# either had a folder. A Soul track still there leaves it for Soul. Delete it
# with R&B's former place, which it names.
[[bucket.split_from]]
id = "rnb_low"
bucket = "rnb"
sub = "low"
display = "Low"

[[bucket.split_from]]
id = "rnb_med"
bucket = "rnb"
sub = "med"
display = "Med"

[[bucket.split_from]]
id = "rnb_high"
bucket = "rnb"
sub = "high"
display = "High"

[[bucket.split_from]]
id = "rnb_unsorted"
bucket = "rnb"
sub = "unsorted"
display = "Unsorted"

[[bucket.split_from]]
id = "rnb_soul_rnb"
bucket = "rnb"
sub = "non_electronic_soul_rnb"
display = "Soul / R&B"

# HIP-HOP AT THE TOP LEVEL, decided by the author on 2026-10-09 (U118). It
# was a style sub of the non electronic bucket with no energy split, and
# leaves it as R&B did, for a folder split by the dance bands. Shaped as R&B
# is, and no Candy.
#
# It takes every word the old sub filed and tagged. "Hip-hop & Rap" is the
# one routing alias the old sub never had: a keyword rule sent it to the non
# electronic bucket's default sub, and the author named it a Hip-Hop word. The
# keyword rules for "hip-hop" and "hip hop" further down still send any other
# partial match to the non electronic bucket, as R-797 decided for R&B.
[[bucket]]
id = "hip_hop"
display = "Hip-Hop"
family = "other"
bpm = { start = 110, floor = 70, ceil = 165 }
aliases = [
  "Hip-Hop",
  "Hip-Hop / R&B",
  "Hip-hop & Rap",
]
# "rap/hip hop" is the general catalogue's own word for this genre (R-796).
# Since R-799 that catalogue has a table of its own at the end of this file,
# and this alias is read for it only by a copy that declares no such table.
tag_aliases = [
  "hip hop",
  "hip-hop",
  "hip-hop / r&b",
  "rap",
  "rap fr",
  "rap/hip hop",
  "trap",
  "trap / wave",
]
rates = false

# THE PLAYLIST THIS BUCKET'S TRACKS SAT IN, as R&B's former place above.
[[bucket.formerly]]
id = "non_electronic_hip_hop"
bucket = "non_electronic"
sub = "hip_hop"
display = "Hip-Hop"

[[bucket]]
id = "non_electronic"
display = "NonElectronic"
family = "other"
bpm = { start = 110, floor = 70, ceil = 165 }
aliases = [
  "Afrobeat",
  "Alternative",
  "Bollywood",
  "Caribbean",
  "Classical",
  "Contemporary Classical",
  "Country",
  "Folk",
  "Funk",
  "Indie Rock",
  "Jazz",
  "Latin",
  "NonElectronic / Pop",
  "Punk",
  "Rock",
  "Tango",
  "World Music",
]
# Routes by the SOURCE genre, not by energy, into one sub per style.
# `rates = false`: a star rating derived from energy means nothing for a
# bucket that has no energy dimension. UNVERIFIED: two consumers of the old
# code disagreed here, one suppressing the rating for this bucket and one
# writing it anyway. This follows the stricter one.
rates = false
energy = { enabled = false }

[[bucket.sub]]
id = "jazz"
display = "Jazz"
tag_aliases = [
  "jazz",
]

[[bucket.sub]]
id = "classical"
display = "Classical"
tag_aliases = [
  "classical",
]

[[bucket.sub]]
id = "rock"
display = "Rock"
tag_aliases = [
  "rock",
]

# THE WORD THAT FILES HERE IS "NonElectronic / Pop", NOT "Pop" (R-799). A file
# whose genre is "Pop" routes to the Dance / Pop bucket, by that bucket's own
# alias, so the row for "Pop" in the map below is never reached and this sub's
# name cannot be the genre written for it. It carries no tag alias for the
# same reason: an alias here would answer with the sub's name. The general
# catalogue's table at the end of this file writes the word that does file
# here. To call it something else, change the alias above, the map row below
# and that table's row together.
[[bucket.sub]]
id = "pop"
display = "Pop"

# THERE IS NO SOUL / R&B SUB HERE ANY MORE (R-797). It is the "rnb" bucket
# above, which names the playlist this bucket's folder still holds as its
# former place. NOR A HIP-HOP SUB (U118): it is the "hip_hop" bucket above,
# the same way.

[[bucket.sub]]
id = "folk"
display = "Folk"
tag_aliases = [
  "folk",
]

[[bucket.sub]]
id = "funk"
display = "Funk"
tag_aliases = [
  "funk",
]

[[bucket.sub]]
id = "caribbean"
display = "Caribbean"
tag_aliases = [
  "caribbean",
  "dancehall",
  "reggae",
  "reggae / dancehall / ska",
  "ska",
]

[[bucket.sub]]
id = "afrobeat"
display = "Afrobeat"
tag_aliases = [
  "afrobeat",
  "afrobeats",
]

[bucket.sub_by_source]
# An unmapped source genre lands here. The system this came from hardcoded
# one sub as the default with no way to see it, so anything unrecognised
# filed as that style whether or not it was. Declaring it makes the choice
# reviewable; changing it is a one-line edit.
default = "rock"
map = [
  { source = "Afrobeat", sub = "afrobeat" },
  { source = "Alternative", sub = "rock" },
  { source = "Bollywood", sub = "caribbean" },
  { source = "Caribbean", sub = "caribbean" },
  { source = "Classical", sub = "classical" },
  { source = "Contemporary Classical", sub = "classical" },
  { source = "Country", sub = "caribbean" },
  { source = "Folk", sub = "folk" },
  { source = "Funk", sub = "funk" },
  { source = "Indie Rock", sub = "rock" },
  { source = "Jazz", sub = "jazz" },
  { source = "Latin", sub = "caribbean" },
  { source = "NonElectronic / Pop", sub = "pop" },
  { source = "Pop", sub = "pop" },
  { source = "Punk", sub = "rock" },
  { source = "Rock", sub = "rock" },
  { source = "Tango", sub = "caribbean" },
  { source = "World Music", sub = "caribbean" },
]

[[bucket]]
id = "electronica_other"
display = "Electronica / Other"
family = "other"
bpm = { start = 124, floor = 90, ceil = 160 }
aliases = [
  "Acapella",
  "DJ Tools / Acapellas",
  "DJ Tools / Samples",
  "Electro",
  "Electro (Classic / Detroit / Modern)",
  "Electronic",
  "Electronica",
  "Experimental",
  "Live Electronic",
  "Loop Samples",
  "Mainstage",
]

[[bucket]]
id = "chill_ambient"
display = "Chill / Ambient"
family = "downtempo"
bpm = { start = 90, floor = 60, ceil = 120 }
aliases = [
  "Ambient",
  "Ambient / Experimental",
  "Balearic",
  "Chill / Ambient",
]
# Tagging-only: source strings the tagger accepts that routing deliberately
# does not. Listing them here is the point — the two tables that used to
# hold them disagreed, and the disagreement was invisible.
tag_aliases = [
  "chill",
  "chillout",
]
# No energy dimension and no sink: this bucket has exactly one sub, named
# for the bucket itself, and a track with no energy reading lands there
# rather than in a sink that does not exist.
# `rates = false`: a star rating derived from energy means nothing for a
# bucket that has no energy dimension. UNVERIFIED: two consumers of the old
# code disagreed here, one suppressing the rating for this bucket and one
# writing it anyway. This follows the stricter one.
rates = false
energy = { enabled = false }
single_sub = { id = "chill_ambient_all", display = "Chill / Ambient" }

[[bucket]]
id = "progressive_house"
display = "Progressive House"
family = "progressive"
bpm = { start = 124, floor = 114, ceil = 134 }
aliases = [
  "Melodic / Progressive House",
  "Progressive House",
]
# Tagging-only: source strings the tagger accepts that routing deliberately
# does not. Listing them here is the point — the two tables that used to
# hold them disagreed, and the disagreement was invisible.
tag_aliases = [
  "progressive",
]

