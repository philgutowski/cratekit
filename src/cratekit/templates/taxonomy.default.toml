# Ordered rules for TAGGING only, first match wins, matched against the
# lowercased source string. `all_of` requires every substring, `any_of` requires
# one. These run BEFORE the alias lookup, because their whole job is to catch
# strings an alias would accept too readily: a catch-all bucket name must be
# refused, not written to a file as if it were an answer.

# EXACT refusals run first, before the alias lookup. Each names a source
# taxonomy's catch-all bucket, and accepting one as a final tag is the blanket
# genre this entry point exists to refuse. They are `equals` and not substrings
# on purpose: the specific sub-genres whose names contain these words are
# confident answers and must keep resolving normally.
[[suggest]]
equals = ["techno"]
decline = "ask"

[[suggest]]
equals = ["electronica", "electronic", "electronica / other", "other"]
decline = "ask"

# Substring corrections run after the alias lookup, so a declared alias always
# beats a guess.
[[suggest]]
all_of = ["deep house"]
bucket = "deep_house"

# Deliberate default rather than a question: on a house-leaning catalogue this
# pairing is overwhelmingly the house side, and leaving it blank once starved
# entire labels (52 percent of one 400-track batch landed in this bucket with
# nobody ever seeing the review queue).
[[suggest]]
all_of = ["melodic", "techno", "house"]
bucket = "melodic_house"

# No bucket exists for this. The rule is preserved because deleting it would
# silently re-route explicit melodic techno into a house bucket, which is the
# one thing the rule above exists to prevent. It writes a tag with no folder,
# which is a gap in the taxonomy, not a bug in the engine: declare a bucket for
# it, or accept that these tracks route through the fallback.
[[suggest]]
all_of = ["melodic", "techno"]
tag = "Melodic Techno"

[[suggest]]
all_of = ["progressive"]
bucket = "progressive_house"

[[suggest]]
all_of = ["melodic"]
bucket = "melodic_house"

# The one rule that reads tempo, and the only kind of substring rule that runs
# BEFORE the alias lookup: it decides on evidence a name lookup does not have.
# Below the cut it is one bucket, at or above it another, and with no tempo
# known it takes the safer bucket and asks for review rather than guessing.
#
# It requires BOTH terms, which is narrower than the rule it replaces. That
# rule fired on either term, so it also swallowed the two source strings that
# name one of these buckets outright and moved them to the other one with a
# review flag. The combined source bucket is what needs splitting; a source
# that already named one side does not.
[[suggest]]
all_of = ["organic house", "downtempo"]
bucket = "organic_house"
[suggest.split]
when_contains = "downtempo"
max_bpm = 115
below = "downtempo"
at_or_above = "organic_house"
unknown_bpm = "organic_house"
unknown_bpm_needs_review = true

# Anything else naming one side of that pair, with no tempo to split on.
[[suggest]]
any_of = ["organic house", "downtempo"]
bucket = "organic_house"

[[suggest]]
all_of = ["tech house"]
bucket = "tech_house"

[[suggest]]
any_of = ["minimal", "deep tech"]
bucket = "minimal_deep_tech"

[[suggest]]
all_of = ["afro"]
bucket = "afro_house"

[[suggest]]
any_of = ["nu disco", "indie dance"]
bucket = "nu_disco_indie_dance"

# The acquisition gate keys on the SOURCE vocabulary, never on the resolved
# bucket, and that is deliberate: a bucket-level 'ask' means the FOLDER is
# uncertain, while a confident source sub-genre is still a confident family
# signal. Merging the two would undo the softening that stopped this gate
# dropping half of a legitimate catalogue.
#
# Family names here are opaque identifiers compared only against each other.
# They are deliberately not bucket ids: a family is a property of the source's
# taxonomy, not of ours.
[label_gate]
# A family drops only when it is under this share of a label's classified
# output, i.e. genuinely out of place for that label rather than merely absent
# from our taxonomy.
out_of_place_share = 0.10
# What a followed label is taken to be when its registry entry names no kind.
# One of the kinds the published rules at the end of this section name, or
# "any". Set a label's own with: crate label registry set NAME --kind KIND
default_kind = "dance"

# Keep-exceptions first: each contains a term a family rule below would catch.
[[label_gate.rule]]
all_of = ["melodic", "techno", "house"]
keep = true

[[label_gate.rule]]
any_of = ["uk garage", "bassline"]
keep = true

[[label_gate.rule]]
any_of = ["nu disco", "indie dance"]
keep = true

# Candidate-drop families.
[[label_gate.rule]]
all_of = ["melodic", "techno"]
family = "melodic_techno"

[[label_gate.rule]]
any_of = ["techno"]
family = "techno"

[[label_gate.rule]]
any_of = ["trance"]
family = "trance"

[[label_gate.rule]]
all_of = ["drum", "bass"]
family = "breaks_bass"

[[label_gate.rule]]
any_of = ["d&b", "dnb"]
family = "breaks_bass"

[[label_gate.rule]]
any_of = ["breaks", "breakbeat"]
family = "breaks_bass"

[[label_gate.rule]]
any_of = ["dubstep"]
family = "breaks_bass"

[[label_gate.rule]]
any_of = ["dance / pop", "dance/pop"]
family = "dance_pop"

[[label_gate.rule]]
any_of = ["hip hop", "hip-hop", "r&b", "trap ", "rap"]
family = "hip_hop_rnb"

[[label_gate.rule]]
equals = ["trap"]
family = "hip_hop_rnb"


# The same gate asked about KIND, over a GENERAL catalogue's words (R-798).
#
# The rules above read the record shops' vocabulary and ask about a share. These
# read the words a general catalogue publishes for a release's album and say
# what kind of music each word is. A sweep holds back a release when the
# catalogue's words for it are all another kind than its label is followed as:
# one word of the label's kind passes the release, a word no rule knows neither
# passes nor holds it, and a release with no known word is filed for review as
# not judged.
#
# In order, first match wins. `kind` is an opaque name: the kinds a label can be
# marked with are exactly the ones named here, plus "any", which passes
# everything and is reserved.
#
# MEASURED on 2026-10-01: the catalogue's 27 top level words, every one of which
# a rule below claims. Pop, Rap/Hip Hop, Reggaeton, Rock, Dance, R&B,
# Alternative, Christian, Electro, Folk, Reggae, Jazz, Country, Salsa,
# Traditional Mexicano, Classical, Films/Games, Metal, Soul & Funk, African
# Music, Asian Music, Blues, Brazilian Music, Cumbia, Indian Music, Kids, Latin
# Music. NOT MEASURED: the words it lists below that level. The other needles
# are written from its published genre names, and a word none of them claims is
# simply not judged, so add a rule when a sweep names one.

# An exception first: it contains a word the dance rule would claim.
[[label_gate.published]]
any_of = ["dancehall"]
kind = "reggae"

[[label_gate.published]]
any_of = ["dance", "electro", "techno", "house", "trance", "dubstep", "disco"]
kind = "dance"

[[label_gate.published]]
any_of = ["hip hop", "hip-hop"]
kind = "hip_hop"

# Before jazz, whose "blues" would claim the long spelling of R&B.
[[label_gate.published]]
any_of = ["r&b", "soul", "rhythm & blues", "rhythm and blues"]
kind = "rnb"

[[label_gate.published]]
any_of = ["christian", "gospel"]
kind = "christian"

# Before reggae and pop: Reggaeton holds the first word and Latin Pop the second.
[[label_gate.published]]
any_of = ["reggaeton", "salsa", "cumbia", "mexican", "latin", "brazil"]
kind = "latin"

[[label_gate.published]]
any_of = ["reggae"]
kind = "reggae"

[[label_gate.published]]
any_of = ["pop"]
kind = "pop"

[[label_gate.published]]
any_of = ["rock", "alternative", "metal"]
kind = "rock"

[[label_gate.published]]
any_of = ["jazz", "blues"]
kind = "jazz"

[[label_gate.published]]
any_of = ["folk", "country"]
kind = "folk_country"

[[label_gate.published]]
any_of = ["classical"]
kind = "classical"

[[label_gate.published]]
any_of = ["african", "asian", "indian"]
kind = "world"

[[label_gate.published]]
any_of = ["films/games", "soundtrack"]
kind = "soundtrack"

[[label_gate.published]]
equals = ["kids"]
kind = "kids"


# A SOURCE'S OWN VOCABULARY (R-799).
#
# The alias lists on the buckets above were written against the record shops'
# words, where Pop is a dance genre. A general catalogue says Pop of every
# kind of pop, and read through those aliases its Pop was written as
# Dance / Pop and its Alternative as the non electronic bucket's bare name. So
# a source can have a table of its own, named as a file's record names the
# source, the name the tag summary counts under.
#
# Each row is one of that source's words and the `tag` written onto the file
# for it. A word is matched whole, whatever its case. Where the tag files is
# not declared here: it is filed the way any file carrying that genre is.
#
# THE TAG MUST NAME A FOLDER, and a template is refused when one does not. It
# has to be an exact routing alias or a bucket's own name. In a bucket that
# files by source genre it has to have a row of its own in that bucket's map,
# so the bucket's bare name can never be written.
#
# THE TABLE IS ASKED FIRST. A word with no row goes on to the aliases above,
# as it did before this table existed, so a specific word they already file
# correctly, Disco or Trance, still is. One thing changes for such a word on a
# copy that declares this table: what the aliases answer must name a folder by
# the rule above, so the bare name of the non electronic bucket is never
# written and the word is declined instead. A declined word leaves the file
# with no genre and askable, and is named in the run's summary, which is where
# to read what to add a row for.
#
# ONLY THE GENERAL CATALOGUE HAS ONE. The record shops' words are resolved by
# the aliases above, which were written for them, and a table under any other
# name is refused, since nothing would read it. Delete this table and the
# general catalogue's words are filed by the aliases too, as before R-799.
#
# MEASURED on 2026-10-01: the general catalogue's 27 top level words. The 11
# below have a folder. Electro and Dance are too coarse for a dance track and
# have no row on purpose: the aliases decline both. Reggaeton, Christian,
# Salsa, Traditional Mexicano, Films/Games, Metal, African Music, Asian Music,
# Blues, Brazilian Music, Cumbia, Indian Music, Kids and Latin Music have no
# folder that names them. NOT MEASURED: the words it lists below that level.
# None has a row, so each is filed as it was before, less the bare name.
[vocabulary.deezer]
words = [
  { word = "Pop", tag = "NonElectronic / Pop" },
  { word = "Alternative", tag = "Rock" },
  { word = "Rock", tag = "Rock" },
  { word = "Country", tag = "Folk" },
  { word = "Folk", tag = "Folk" },
  { word = "R&B", tag = "R&B" },
  { word = "Soul & Funk", tag = "Soul" },
  { word = "Rap/Hip Hop", tag = "Hip-Hop" },
  { word = "Jazz", tag = "Jazz" },
  { word = "Classical", tag = "Classical" },
  { word = "Reggae", tag = "Caribbean" },
]
