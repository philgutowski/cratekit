name: CI

# WHAT THIS WORKFLOW IS FOR, decided 2026-08-15, and it does NOT run the suite.
#
# It proves PACKAGING and PORTABILITY, which are the two things the local battery
# structurally cannot see, because the laptop has everything already. The suite
# is a macOS proof and its authority is the local battery in docs/METHOD.md.
#
# It used to run pytest on Linux and every run on main failed for ten commits
# while the local battery was clean for every one of them, so a red run
# distinguished nothing. That is R-115. The fix is not to make the suite pass
# here, because a large part of it cannot: hdiutil volumes, rclone, a machine
# specific timing calibration, and a filename normalisation that APFS performs
# and ext4 does not. It is to stop claiming here what only macOS can answer.
#
# READ docs/METHOD.md, "What CI is for", before adding a step. The rule is that
# every step here must be able to pass, and a step that cannot belongs in the
# battery instead.

on:
  push:
  pull_request:

jobs:
  # The repository scan runs FIRST and on its own, with no dependencies
  # installed. Two reasons it is a separate job rather than a step in `portable`:
  #
  # 1. It must be able to run when the package does not install. A credential or
  #    a personal path is exactly the kind of thing that lands in a branch whose
  #    dependencies are also broken, and that is the worst moment to have the
  #    guard silently not run.
  # 2. It needs a checkout and nothing else, so it reports in seconds. A guard
  #    that reports after a fifteen-minute matrix gets ignored. The checkout is
  #    full history for the closing check (U158), which costs seconds here.
  #
  # The same script is wired as a pre-commit hook. The hook is the one that
  # matters, because a secret that reaches a commit is already in the history;
  # this is the backstop for the machine where the hook was never installed.
  scan:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, for the closing check below (U158). A depth one checkout
      # holds only the tip, so a range read there judges one commit whatever
      # the range says: on a pull request that tip is GitHub's synthetic merge
      # and the branch's own commits were never read at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portability and secret scan (R1)
        run: python scripts/scan_repo.py

      # The closing check, in the one place nobody can skip it. Same job as the
      # scan and for the same reason: it needs no dependencies, it reports in
      # seconds, and it must run on a machine where the hook was never
      # installed. R1 is the finding that a fresh clone has no hooks at all, and
      # the commit-msg hook needs a SECOND install command on top of that, so
      # this is the wiring that is actually load-bearing.
      #
      # Network-free by construction: it reads tests/_pending.py and the verb
      # registry, never `gh`. That is what lets it run in this job.
      #
      # `--since` NAMES THE REF'S PREVIOUS TIP, so the range is exactly the
      # commits this push added.
      #
      # It used to name the merge base with `origin/main`, and that judged an
      # EMPTY RANGE on every push. This repository opened no pull requests then,
      # pushing only `main`, so after the push `origin/main` IS `HEAD`, the merge
      # base is `HEAD`, and `HEAD..HEAD` holds nothing. The trailer lives in the
      # merge commit the push delivers, which is precisely the commit that range
      # excludes. So the copy this comment calls load-bearing had never judged a
      # single trailer, and the only thing actually running was the commit-msg
      # hook, which needs a second install line and is absent from a fresh clone.
      #
      # `github.event.before` is all zeros when a ref is created, and falls
      # through to exit 0: a check that cannot read its input reports that
      # rather than refusing, because a step that fails where it cannot see is
      # a step somebody deletes.
      #
      # A PULL REQUEST IS JUDGED, decided by U158. Units reach main through a
      # pull request the session merges once this is green, so the range is
      # the pull request's own, base to head, and the card its head branch
      # names (`cloud/N-slug`) is judged as closed too, because the trailer
      # that closes it is written by the merge and is in no commit yet. A pull
      # request event with no base sha still exits 0 and says why.
      - name: A unit may not close while a register still owes it a module
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_FROM: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The merge commit's trailer is the one close. GitHub also closes
            # from a pull request's body at the merge, which no range check
            # sees, so a closing keyword in the body is refused outright.
            if printf '%s' "$PR_BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b[[:space:]]*#[0-9]+'; then
              echo "the pull request body carries a closing keyword next to an issue number; remove it"
              exit 2
            fi
            if [ -z "$PR_BASE" ]; then
              echo "pull request event carries no base sha; nothing to judge"
              exit 0
            fi
            python scripts/board.py closing --since "$PR_BASE" --pull-request-head "$PR_HEAD_REF"
            exit $?
          fi
          case "$PUSHED_FROM" in
            ""|0000000000000000000000000000000000000000)
              echo "no previous tip for this ref; nothing to judge"
              exit 0
              ;;
          esac
          python scripts/board.py closing --since "$PUSHED_FROM"

  # WAS `test`, AND THE RENAME IS THE POINT. It lints and it proves the slim
  # profile. It does not run pytest, and it does not deselect anything either:
  # nothing is skipped here, so nothing here can read as a passing proof that
  # never ran, which is the hazard the hardware tests were written to refuse.
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # KTD19 declares 3.12 and 3.13 supported. Both run, because "supported"
        # that is only ever exercised on one interpreter is a claim, not a fact.
        # What both legs prove here is narrower than it was: the package installs
        # and lints on each. That the SUITE passes on 3.13 is now proved nowhere,
        # and that is a real loss rather than an oversight. It is recorded in
        # R-115 and the cheap half of it is bought back by cold-install below,
        # which imports and drives the entry point on both.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The dependency list is DERIVED from pyproject.toml, never mirrored by
      # hand (U1). Adding a core dependency needs no workflow edit.
      - name: Install slim core
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          python scripts/ci_deps.py | xargs -r python -m pip install
          pip install ruff

      # Proves the claim the slim profile rests on: a core install has no DSP,
      # no web framework, and no ML stack present at all.
      - name: Assert the slim install is actually slim
        run: |
          for forbidden in torch panns_inference librosa fastapi uvicorn; do
            if python -c "import ${forbidden}" 2>/dev/null; then
              echo "slim core install pulled in ${forbidden}; it belongs in an extra"
              exit 1
            fi
          done

      - name: Lint
        run: ruff check src tests scripts

  # A separate job, not another matrix leg, because its whole purpose is to
  # prove the package is importable with nothing but its own dependencies in a
  # brand new environment. Reusing the other job's environment would defeat it.
  cold-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both interpreters, added 2026-08-15. This is what is left of KTD19's
        # claim once the suite stops running here: the package installs, imports
        # and answers on 3.12 and on 3.13.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from a clean checkout and import
        run: |
          python -m venv /tmp/cold
          /tmp/cold/bin/pip install --upgrade pip
          /tmp/cold/bin/pip install .
          /tmp/cold/bin/python -c "import cratekit; print(cratekit.__version__)"
          /tmp/cold/bin/crate --help
          # Since U248 crate --help imports no verb module, so the eager parser
          # is what proves every landed verb's module imports on a cold install.
          /tmp/cold/bin/python -c "from cratekit import cli; cli.build_parser(eager=True)"
      # The vendored downloader is the half of the install that no index can
      # supply (KTD4), so it is the half most likely to be missing from a wheel
      # and least likely to be noticed: nothing fails until a user tries to
      # acquire a track. Importing it here, from the INSTALLED package rather
      # than the checkout, is what proves the source tree and its licence data
      # actually shipped.
      - name: Import the vendored downloader from the installed package
        run: |
          cd /tmp
          /tmp/cold/bin/python -c "
          import cratekit._vendor.downloader as vendored
          from cratekit._vendor import DOWNLOADER, license_text
          assert 'site-packages' in vendored.__file__, vendored.__file__
          assert vendored.__version__ == DOWNLOADER.version
          assert 'AFFERO' in license_text(DOWNLOADER)
          print('vendored', DOWNLOADER.project, vendored.__version__, DOWNLOADER.license_id)
          "
